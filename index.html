<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>킥오프 라이프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-width column like a matchday programme — app bar, player strip, tabbed cards stacked below */
:root{
  --bg:#e8ebe4; --surface:#ffffff; --surface-2:#f3f5f0; --ink:#14213d; --muted:#5b6678; --line:#d4d9cf;
  --pitch:#1e7a4c; --pitch-soft:#dcefe3; --card:#f0bd2b; --card-ink:#2a2000; --red:#c23b2c; --red-soft:#f8e1dd;
  --btn:#14213d; --btn-fg:#ffffff;
  --f-display:'Black Han Sans','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Saira Condensed','Arial Narrow',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#161e31; --surface-2:#1c2640; --ink:#e6eaf2; --muted:#97a3b8; --line:#2a3550;
  --pitch:#4cc28a; --pitch-soft:#173a2b; --card:#f0bd2b; --card-ink:#2a2000; --red:#f07261; --red-soft:#3d1d1a;
  --btn:#f0bd2b; --btn-fg:#1a1500; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#161e31; --surface-2:#1c2640; --ink:#e6eaf2; --muted:#97a3b8; --line:#2a3550;
  --pitch:#4cc28a; --pitch-soft:#173a2b; --card:#f0bd2b; --card-ink:#2a2000; --red:#f07261; --red-soft:#3d1d1a;
  --btn:#f0bd2b; --btn-fg:#1a1500; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 40px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--card);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 8px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo .mark{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:15px}
.logo b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.logo small{display:block;font-family:var(--f-num);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--ink);color:var(--bg);border:0;padding:22px 18px;gap:14px}
.hero .eyebrow{color:var(--card)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.2}
.hero p{opacity:.85}
.btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-radius:10px;padding:13px 16px;background:var(--btn);color:var(--btn-fg);font-weight:700;text-align:left}
.hero .btn{background:var(--card);color:var(--card-ink)}
.btn.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .arr{font-family:var(--f-num);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--f-num);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted)}

/* form */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* player strip & card */
.strip{display:flex;align-items:center;gap:12px}
.jersey{width:54px;height:58px;flex:none;border-radius:10px 10px 14px 14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:28px;position:relative}
.jersey::before{content:"";position:absolute;top:0;left:50%;width:16px;height:7px;transform:translateX(-50%);border-radius:0 0 8px 8px;background:var(--surface)}
.strip .who{flex:1;min-width:0}
.strip .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovr{flex:none;background:var(--card);color:var(--card-ink);border-radius:10px;padding:4px 10px;text-align:center;line-height:1}
.ovr .v{font-family:var(--f-num);font-weight:800;font-size:28px}
.ovr .k{font-family:var(--f-num);font-size:11px;letter-spacing:.1em;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--pitch-soft);color:var(--pitch);border-color:transparent}
.chip.bad{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.gold{background:var(--card);color:var(--card-ink);border-color:transparent}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:8px;padding:8px 0;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}

/* stats */
.stat{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.stat .track{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.stat .fill{height:100%;background:var(--muted);border-radius:99px}
.stat .fill.hi{background:var(--pitch)}
.stat .fill.mid{background:var(--ink)}
.stat .n{text-align:right;font-family:var(--f-num);font-weight:700;font-size:17px;white-space:nowrap}
.guide summary b{font-size:16px}
.guide ul{margin:8px 0 0;padding-left:18px;display:grid;gap:8px}
.guide li{font-size:14px;line-height:1.55}
.gtip{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--card);background:color-mix(in srgb,var(--card) 14%,var(--surface))}
.aform{display:grid;gap:6px;margin:12px 0}
.alab{font-size:13px;font-weight:700;margin-top:6px}
.alab .muted{font-weight:400}
.ainp{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:16px}
.rcode{font-size:24px;font-weight:800;letter-spacing:2px;text-align:center;padding:16px;margin:12px 0;border:2px dashed var(--card);border-radius:12px;background:color-mix(in srgb,var(--card) 12%,var(--surface));user-select:all}
.acct{padding-top:10px;padding-bottom:10px}
.bar-r{display:flex;gap:6px;align-items:center;min-width:0}
.fbbadge{display:inline-flex;align-items:center;gap:3px;border:0;border-radius:999px;padding:4px 9px;background:var(--red);color:#fff;font-size:12px;font-weight:700;animation:fxpulse 1.4s ease-in-out infinite}
.acctb{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frq{display:flex;gap:8px;margin-top:10px}
.frq .ainp{flex:1}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px;margin:8px 0 10px}
.vsrow>div{display:flex;flex-direction:column;gap:2px}
.vsrow .num{font-size:30px;font-weight:800}
.vs{font-weight:800;color:var(--muted)}
.seg button.locked{opacity:.55;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.seg button.locked .small{font-size:10.5px;font-weight:500}
.crl{padding-top:8px}
.crr{display:grid;grid-template-columns:30px 1fr 32px 30px 30px 34px;align-items:center;gap:6px;padding:11px 0;border-bottom:1px solid var(--line)}
.crc.rt{color:var(--pitch)}
.crr:last-child{border-bottom:0}
.crh{padding:6px 0;border-bottom:1px solid var(--line)}
.crh .crc{font-size:12px;color:var(--muted);font-weight:700}
.cri{display:flex;justify-content:center}
.crmil{font-size:22px}
.crn{min-width:0;line-height:1.35}
.crn b{font-size:15px}
.crc{text-align:center;font-size:15px;font-weight:700}
.chip.mv em{font-style:normal;margin-left:2px}
.chip.mv em.up,.orow .up{color:var(--pitch)}
.chip.mv em.down,.orow .down{color:var(--red)}
.hlg{display:grid;gap:10px;margin-top:8px}
.hl{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.hl>span:last-child{display:flex;flex-direction:column;min-width:0}
.hli{font-size:24px;display:flex;justify-content:center}
.hlk{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted)}
.hl b{font-size:17px;line-height:1.3}
.sgrade{flex:none;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:800;font-size:24px;background:var(--surface-2);border:1px solid var(--line)}
.sgrade.gSp,.sgrade.gS{background:var(--card);color:var(--card-ink);border-color:transparent}
.sgrade.gA{background:var(--pitch);color:#fff;border-color:transparent}
.hl.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--surface))}
.fblink{display:block;margin:4px auto 0;font-size:14px}
textarea.ainp{resize:vertical;min-height:110px;font-family:inherit;line-height:1.5}
.fbi{align-items:flex-start}
/* 팀 색 배경과 분위기 효과 */
body.teamed{background:linear-gradient(180deg,color-mix(in srgb,var(--team) 22%,var(--bg)) 0,color-mix(in srgb,var(--team) 8%,var(--bg)) 300px,color-mix(in srgb,var(--team) 4%,var(--bg)) 100%) fixed,var(--bg)}
body.teamed .bar{background:color-mix(in srgb,var(--team) 22%,var(--bg))}
body.onfire{background:linear-gradient(180deg,color-mix(in srgb,#ff7a1a 34%,var(--bg)) 0,color-mix(in srgb,var(--team) 12%,var(--bg)) 300px,var(--bg) 600px) no-repeat,var(--bg)}
body.onfire .bar{background:color-mix(in srgb,#ff7a1a 34%,var(--bg))}
body.onfire::before{content:'';position:fixed;left:0;right:0;top:0;height:6px;z-index:6;background:linear-gradient(90deg,#ff3d00,#ffb300,#ff3d00);background-size:200% 100%;animation:fireline 1.2s linear infinite}
body.cold{background:linear-gradient(180deg,color-mix(in srgb,#4a90d9 26%,var(--bg)) 0,var(--bg) 420px) no-repeat,var(--bg)}
body.cold .bar{background:color-mix(in srgb,#4a90d9 26%,var(--bg))}
body.gloom{background:linear-gradient(180deg,color-mix(in srgb,#555 30%,var(--bg)) 0,var(--bg) 480px) no-repeat,var(--bg)}
body.gloom .bar{background:color-mix(in srgb,#555 30%,var(--bg))}
body.glory{background:linear-gradient(180deg,color-mix(in srgb,#f2c14e 40%,var(--bg)) 0,var(--bg) 480px) no-repeat,var(--bg)}
body.glory .bar{background:color-mix(in srgb,#f2c14e 40%,var(--bg))}
.streak{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:4px;letter-spacing:0}
.streak.hot{background:#ff7a1a;color:#fff;display:inline-block;animation:flicker 1s ease-in-out infinite}
.streak.icy{background:#4a90d9;color:#fff}
@keyframes flicker{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.25)}}
@keyframes fireline{from{background-position:0 0}to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){.streak.hot,body.onfire::before{animation:none}}
.trsplit{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:10px 0 4px;color:var(--muted)}
.trsplit b{color:var(--ink)}
.endbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.endbar .btn{font-size:14px;padding:12px}
.achbox.celeb{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.celebi{font-size:64px;line-height:1;animation:achspin .9s ease-out}
.celebt{font-size:24px;line-height:1.3}
.achbox.celeb .btn{width:100%}
.aftg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aftg .dbtn.locked{opacity:.5}
.eyebrow.fin{color:var(--card-ink);background:var(--card);padding:1px 6px;border-radius:5px}
.achov{position:fixed;inset:0;z-index:100;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:achfade .25s ease-out}
.achbox{position:relative;z-index:2;width:min(360px,100%);background:var(--surface);border-radius:18px;padding:20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:achpop .45s cubic-bezier(.2,1.4,.4,1)}
.achbox .btn{margin-top:12px}
.achrow{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:8px 0}
.achrow>span:last-child{display:flex;flex-direction:column}
.achrow.locked{opacity:.45}
.achi{font-size:28px;text-align:center}
.achbox .achi{font-size:34px;animation:achspin .8s ease-out}
.achlist{display:grid}
.achlist .achrow{border-bottom:1px solid var(--line)}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.conf i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:achfall linear infinite;opacity:.9}
@keyframes achfall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(105vh) rotate(540deg)}}
@keyframes achpop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes achfade{from{opacity:0}to{opacity:1}}
@keyframes achspin{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
/* 큰 순간 연출: 해트트릭·골·선방·우승·승격·강등 */
.fxlayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.fxball{position:absolute;bottom:-60px;font-size:42px;line-height:1;animation:2.2s cubic-bezier(.3,.7,.4,1) infinite both}
.fxball.b1{left:-10px;animation-name:ballL}
.fxball.b2{right:-10px;animation-name:ballR;animation-delay:.35s}
.fxball.b3{left:calc(50% - 21px);animation-name:ballU;animation-delay:.7s}
.fxball.b4{left:-10px;bottom:20%;font-size:48px;animation:ballShot 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes ballL{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}60%{transform:translate(42vw,-62vh) rotate(600deg);opacity:1}100%{transform:translate(48vw,-40vh) rotate(800deg) scale(.4);opacity:0}}
@keyframes ballR{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}60%{transform:translate(-42vw,-58vh) rotate(-600deg);opacity:1}100%{transform:translate(-48vw,-38vh) rotate(-800deg) scale(.4);opacity:0}}
@keyframes ballU{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}55%{transform:translateY(-78vh) rotate(500deg);opacity:1}100%{transform:translateY(-55vh) rotate(700deg) scale(.4);opacity:0}}
@keyframes ballShot{0%{transform:translate(0,0) rotate(0) scale(.6)}70%{transform:translate(78vw,-14vh) rotate(900deg) scale(1)}80%{transform:translate(74vw,-12vh) rotate(950deg)}100%{transform:translate(76vw,-4vh) rotate(1000deg);opacity:0}}
.fxbig{font-family:var(--f-num);font-weight:900;font-size:30px;letter-spacing:.06em;color:var(--card-ink);background:var(--card);padding:0 12px;border-radius:8px;animation:fxzoom .7s cubic-bezier(.2,1.6,.4,1) both,fxpulse 1.2s .7s ease-in-out infinite}
@keyframes fxzoom{0%{transform:scale(3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fxpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.cere{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px}
.cerei{font-size:46px;line-height:1.1;animation:cereIn 1s cubic-bezier(.2,.9,.3,1) both,cereJump .9s 1s ease-in-out infinite}
@keyframes cereIn{0%{transform:translateX(-160px) rotate(-18deg);opacity:0}55%{transform:translateX(12px) rotate(6deg);opacity:1}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}
@keyframes cereJump{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.08)}60%{transform:translateY(-14px) scale(1.08)}}
.rays{position:absolute;top:-70px;left:50%;width:260px;height:260px;margin-left:-130px;border-radius:50%;z-index:-1;pointer-events:none;background:repeating-conic-gradient(rgba(242,193,78,.45) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:raySpin 9s linear infinite}
@keyframes raySpin{to{transform:rotate(360deg)}}
.achov.fx-save .celebi{animation:gloveIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes gloveIn{0%{transform:translateX(140px) rotate(40deg) scale(.5);opacity:0}100%{transform:none;opacity:1}}
.achov.fx-up .celebi{animation:rise 1.4s ease-out both}
@keyframes rise{0%{transform:translateY(60px);opacity:0}70%{transform:translateY(-10px);opacity:1}100%{transform:translateY(0)}}
/* 강등: 어두운 화면 · 빗줄기 · 흔들림 */
.achov.fx-down{background:rgba(12,14,20,.82)}
.achov.fx-down .achbox{animation:achpop .45s ease-out,shake .5s .45s ease-in-out 2;filter:saturate(.4)}
.achov.fx-down .celebi{animation:sink 1.6s ease-in both;filter:grayscale(1)}
.achov.fx-down .celebt{color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes sink{0%{transform:translateY(-40px);opacity:0}40%{opacity:1}100%{transform:translateY(8px)}}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rain i{position:absolute;top:-40px;width:2px;height:34px;background:linear-gradient(transparent,rgba(170,185,210,.7));animation:rainfall linear infinite}
@keyframes rainfall{to{transform:translate(-30px,110vh)}}
/* 결과 발표 카운트다운: 뒤 화면(이미 바뀐 결과)이 비치지 않게 배경을 완전히 가린다 */
.achov.rv{background:#0b1222;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:none;opacity:1}
.achov.rv .rvbox{animation:none}
.rvbox{min-height:230px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;overflow:hidden}
.cd{position:relative;width:100%;height:150px}
.cd span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:900;font-size:96px;color:var(--pitch);opacity:0;animation:cdPop 1s ease-out both}
.cd span:nth-child(2){animation-delay:1s}.cd span:nth-child(3){animation-delay:2s;color:var(--red)}
@keyframes cdPop{0%{opacity:0;transform:scale(2.4)}25%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(.6)}}

// 승강과 전력 변화는 선수마다 따로 기록되는 '세계'에 저장된다
const CLUB_DEF=CLUBS.map(c=>({lg:c.lg,str:c.str,name:c.name}));
// 선수가 직접 바꾼 출신 고교 이름 (구단 번호 → 이름)
let ALIAS={};
function applyWorld(w){const ok=w&&w.lg;CLUBS.forEach((c,i)=>{const has=ok&&i<w.lg.length;c.lg=has?w.lg[i]:CLUB_DEF[i].lg;c.str=has?w.str[i]:CLUB_DEF[i].str;c.name=CLUB_DEF[i].name});
  ALIAS=(w&&w.alias)||{};Object.keys(ALIAS).forEach(i=>{if(CLUBS[i])CLUBS[i].name=ALIAS[i]});
  CLUBS.forEach((c,i)=>{c.hidden=c.custom&&ALIAS[i]==null});
  // 대륙대회 출전권·지난 시즌 순위 (예전 저장에는 없으면 전력 순으로 정한다)
  if(ok&&w.comp){CLUBS.forEach((c,i)=>{c.comp=w.comp[i]||null;c.lastRank=w.rank?w.rank[i]||null:null})}else defaultComps()}
function snapWorld(p){p.world={lg:CLUBS.map(c=>c.lg),str:CLUBS.map(c=>c.str),comp:CLUBS.map(c=>c.comp||null),rank:CLUBS.map(c=>c.lastRank||null),alias:ALIAS}}
CLUBS.forEach(c=>{c.parent=c.parentName?CLUBS.findIndex(x=>x.name===c.parentName):null});
const SANGMU=CLUBS.findIndex(c=>c.name==='김천 상무');
/* ---------- 대륙대회 출전권 ----------
   지난 시즌 리그 순위로 이번 시즌 대륙대회 출전팀이 정해진다 (각 리그 실제 방식에 맞춤)
   잉글랜드·스페인·독일·이탈리아: 1~4위 UCL · 5~6위 UEL · 7위 UECL
   프랑스: 1~4위 UCL(4위는 예선) · 5위 UEL · 6위 UECL
   K리그1: 1~2위 ACLE(AFC 챔피언스리그 엘리트) · 3위 ACL2(AFC 챔피언스리그 2) */
const COMP={
  UCL:{n:'UEFA 챔피언스리그',s:'UCL',c:'ucl'},UEL:{n:'UEFA 유로파리그',s:'UEL',c:'uel'},UECL:{n:'UEFA 컨퍼런스리그',s:'UECL',c:'uecl'},
  ACLE:{n:'AFC 챔피언스리그 엘리트',s:'ACLE',c:'ucl'},ACL2:{n:'AFC 챔피언스리그 2',s:'ACL2',c:'uel'}
};
const QUAL={
  epl:[[4,'UCL'],[6,'UEL'],[7,'UECL']],laliga:[[4,'UCL'],[6,'UEL'],[7,'UECL']],bundes:[[4,'UCL'],[6,'UEL'],[7,'UECL']],
  seriea:[[4,'UCL'],[6,'UEL'],[7,'UECL']],ligue1:[[4,'UCL'],[5,'UEL'],[6,'UECL']],k1:[[2,'ACLE'],[3,'ACL2']]
};
const qualOf=(lg,rank)=>{const q=QUAL[lg];if(!q||!rank)return null;for(const [r,c] of q)if(rank<=r)return c;return null};
// 새 커리어 처음에는 전력 순서로 출전팀을 정해 둔다
function defaultComps(){
  CLUBS.forEach(c=>{c.comp=null;c.lastRank=null});
  Object.keys(LG).forEach(lg=>{if(LG[lg].am)return;const ids=clubsIn(lg).sort((a,b)=>CLUBS[b].str-CLUBS[a].str);ids.forEach((ci,i)=>{CLUBS[ci].lastRank=i+1;CLUBS[ci].comp=qualOf(lg,i+1)})});
}
const compChip=ci=>{const c=CLUBS[ci]&&CLUBS[ci].comp;return c?`<span class="cchip ${COMP[c].c}">${COMP[c].s}</span>`:''};
// 오퍼 카드용: 대륙대회 + 순위 (같은 리그면 지금 순위, 아니면 지난 시즌 순위)
function clubStatusTxt(p,ci){
  const s=p.season,live=s&&s.tab&&p.phase==='round'&&s.tabLg===CLUBS[ci].lg&&!s.tabU21?sortTab(s.tab,s.split).findIndex(r=>r.ci===ci)+1:0;
  const rk=live?`현재 ${live}위`:CLUBS[ci].lastRank?`지난 시즌 ${CLUBS[ci].lastRank}위`:'';
  return `${compChip(ci)}${rk?`<span class="small muted"> ${rk}</span>`:''}`;
}

function clubsBetween(lo,hi,except){const fromEu=except!=null&&isEuro(except);return CLUBS.map((c,i)=>i).filter(i=>!CLUBS[i].noOffer&&!LG[CLUBS[i].lg].am&&i!==except&&(fromEu||!isEuro(i))&&teamLv(i,false)>=lo&&teamLv(i,false)<=hi)}

function forcedSale(p){
  if(longInj(p)||p.stage!=='pro'||p.contract.years<=0||p.u21||p.mil.st==='serving'||p.loan)return null;
  const o=ovr(p),L=clubLv(p);

  else if(p.age>=30&&o<L-1&&Math.random()<.35)kind='aging';
  else if(!isEuro(p.club)&&o>=L+4&&Math.random()<.12)kind='money';
  if(!kind)return null;
  const why={surplus:'감독이 전력 외로 분류했고, 구단이 이적료를 받고 매각하기로 결정했습니다.',
    aging:'구단이 세대교체를 이유로 매각을 결정했습니다.',strike:'태업 이후 구단이 더 이상 함께할 수 없다며 매각을 결정했습니다.',money:'재정난에 빠진 구단이 거액의 이적료를 받고 매각하기로 했습니다.'}[kind];
  const pool=shuffle(kind==='money'?clubsBetween(L+1,o+3,p.club):clubsBetween(o-9,o+1,p.club)).slice(0,2);
  if(!pool.length)return null;
  const offs=pool.map(ci=>{const of=mkOffer(p,ci,false,'매각 이적');of.block=0;of.forced=true;return of});
  if(kind!=='money'){const lp=shuffle(clubsBetween(o-8,o-1,p.club));if(lp.length)offs.push({kind:'loan',club:lp[0],label:'1년 임대'})}
  offs.push({kind:'refuse',money:kind==='money'});

}

// 라이벌 소식: 이번 라운드 라이벌의 활약에 따라 기사가 바뀐다
function rivalNews(p){const s=p.season,r=p.rival,rv=s&&s.rv,last=s&&s.rvLast;if(!r||!rv||!last||!rv.apps||Math.random()>.28)return;

  if(dfn&&rv.apps>=3&&s.apps)sp.push(rAvg>myAvg?`${R}, 평균 평점 ${dr2(rAvg)} · ${N}(${dr2(myAvg)})보다 높은 평가`:`평점 대결은 ${N} 우세 · ${R} 평균 ${dr2(rAvg)}`);
  if(last.best>=8)sp.push(`${R}, 평점 ${dr(last.best)} 맹활약 · 이주의 팀 후보`);
  if(last.apps===0)sp.push(`${R} 결장… ${RC} 구상에 변수`);
  if(last.apps>=2&&last.best<5.8&&Math.random()<.4)sp.push(`${R} 부진한 경기력에 ${RC} 팬들 실망`);
  const gen=[`${R} "${N}? 좋은 선수지만 신경 쓰지 않는다"`,`${R} "${N} 같은 경쟁자가 있어 더 성장한다"`,`${R}, ${pick(['해외 진출설','재계약 협상','대표팀 발탁설'])} 솔솔… 경쟁 구도 변수`,`팬 투표 · ${N} vs ${R}, 누가 더 나은 ${pn}인가`,`대표팀 ${pn} 자리 두고 ${N}·${R} 2파전`];
  addNews(p,`[라이벌] ${sp.length&&Math.random()<.75?pick(sp):pick(gen)}`,'',r.ci)}

/* 실제 대회 일정: 월드컵 2018·2022부터 4년마다, 아시안게임 2018·2023(항저우 연기)·2026부터 4년마다,

const evYear=(list,y)=>list.includes(y)||(y>list[list.length-1]&&(y-list[list.length-1])%4===0);
const WC_Y=[2018,2022,2026],AG_Y=[2018,2023,2026],OLY_Y=[2021,2024,2028],AC_Y=[2019,2024,2027];

const NAT_NAME={a:'A대표팀',wc:'FIFA 월드컵',ac:'AFC 아시안컵',ag:'아시안게임',oly:'올림픽'};
// 이번 시즌 받을 수 있는 소집. 시즌 중반에 통보가 오고 '참가'를 골라야 대회에 나간다
// 대표팀 선발 점수: 실력에 리그 수준, 팀 내 입지(출전), 최근 폼, 인지도를 더한다. 같은 포지션 경쟁 때문에 해마다 조금씩 흔들린다
function natScore(p){
  if(p.stage!=='pro')return ovr(p)-8;
  const lg=CLUBS[p.club].lg,L=LG[lg];
  const lgB=p.u21?-4:L.euro?(L.tier===1?3:1):lg==='k1'?0:lg==='k2'?-3:-6;
  const roleB={'주전':1,'로테이션':-1,'벤치':-4}[p.role]||0;
  return ovr(p)+lgB+roleB+clamp((recentAvg(p)-6.9)*6,-4,4)+(p.rep||30)/25+gauss()*1.5;
}
function natCalls(p){
  const o=ovr(p),c=[];if(p.age<19||p.stage==='hs')return c;
  const sel=natScore(p);
  if(sel>=70)c.push({k:'a',n:'A대표팀 소집',t:'A매치 기간에 국가대표로 소집됐습니다. 소속팀 일정과 겹쳐 피로가 쌓입니다.'});
  if(evYear(WC_Y,p.year)&&sel>=72)c.push({k:'wc',n:'FIFA 월드컵 최종 명단',t:'4년에 한 번 열리는 월드컵 최종 명단에 이름을 올렸습니다.'});
  if(evYear(AC_Y,p.year)&&sel>=71)c.push({k:'ac',n:'AFC 아시안컵 명단',t:'아시아 최고를 가리는 아시안컵에 소집됐습니다.'});
  const wild=p.mil.st==='none'&&p.age>23&&p.age<=29&&o>=70&&Math.random()<.6;
  if(evYear(AG_Y,p.year)&&((p.age<=23&&o>=60)||wild))c.push({k:'ag',n:`아시안게임 대표팀${p.age>23?' (와일드카드)':''}`,t:'금메달을 따면 병역 면제 혜택을 받습니다. 소속팀이 차출을 아쉬워합니다.'});
  if(evYear(OLY_Y,p.year)&&((p.age<=23&&o>=62)||wild))c.push({k:'oly',n:`올림픽 대표팀${p.age>23?' (와일드카드)':''}`,t:'동메달 이상이면 병역 면제 혜택을 받습니다.'});

function answerCall(p,yes){

    // 변경 이유: 최근 폼, 부상 공백, 태업, 경쟁자
    const pl=res.filter(m=>m.play),fa=pl.length?pl.reduce((a,m)=>a+m.r,0)/pl.length:null,outN=res.filter(m=>m.out).length;
    const why=up?(fa!=null&&fa>=(p.formBase||6.7)?'최근 폼이 좋아 감독의 신임을 얻었다':Math.random()<.5?'경쟁자의 부진으로 기회를 잡았다':'꾸준한 훈련 태도로 감독의 눈에 들었다')
      :(p.strike?'태업으로 감독의 신뢰를 잃었다':outN?'부상으로 빠진 사이 경쟁자가 자리를 차지했다':fa!=null&&fa<(p.formBase||6.7)-.1?'최근 부진으로 감독의 신뢰를 잃었다':'경쟁자가 좋은 폼을 보이며 밀려났다');

}/* ---------- 실시간 리그 순위표 ---------- */
// 내 경기 결과는 실제 결과로, 다른 팀들은 내 경기마다 한 라운드씩 서로 경기를 치른다
function tabKey(p){return `${p.club}|${p.u21?1:0}`}
function initTable(p,pre){
  const s=p.season,lg=CLUBS[p.club].lg,L=curLg(p),ids=clubsIn(lg);
  const rows=ids.map(ci=>({ci,n:teamName(ci,p.u21),str:teamLv(ci,p.u21),pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  const filler=LG[lg].am?(lg==='hs'?'지역 고교':'지역 대학'):'기타 구단';
  for(let k=rows.length;k<L.teams;k++)rows.push({ci:null,n:`${filler} ${k-ids.length+1}`,str:L.lv-1+gauss()*1.5,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  s.tab=rows;s.tabKey=tabKey(p);s.tabLg=lg;s.tabU21=!!p.u21;
  for(let i=0;i<(pre||0);i++)simOthers(s,[]);
}
function ensureTable(p){const s=p.season;if(s&&(!s.tab||s.tabKey!==tabKey(p)))initTable(p,s.mi||0)}
function tabRes(r,gf,ga){r.pl++;r.gf+=gf;r.ga+=ga;if(gf>ga){r.w++;r.pts+=3}else if(gf===ga){r.d++;r.pts++}else r.l++}
function simOthers(s,skip){
  if(s.split){const A=s.tab.filter(r=>s.split.includes(r.ci)),B=s.tab.filter(r=>!s.split.includes(r.ci));[A,B].forEach(g=>pairUp(g.filter(r=>!skip.includes(r.ci)||r.ci==null)));return}
  pairUp(s.tab.filter(r=>!skip.includes(r.ci)||r.ci==null));
}
function pairUp(list){
  const rest=shuffle(list);
  for(let i=0;i+1<rest.length;i+=2){const a=rest[i],b=rest[i+1],d=a.str-b.str;
    const ga=poisson(clamp(1.35+d*.07,.3,3.5)),gb=poisson(clamp(1.35-d*.07,.3,3.5));tabRes(a,ga,gb);tabRes(b,gb,ga)}
}
function tabMatch(s,me,opp,gf,ga){
  const a=s.tab.find(r=>r.ci===me),b=s.tab.find(r=>r.ci===opp);
  if(a)tabRes(a,gf,ga);if(b)tabRes(b,ga,gf);
  simOthers(s,[me,opp]);
}
const tabCmp=(a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;
// K리그1 스플릿: 33라운드 뒤 상위 6팀(파이널 A)과 하위 6팀(파이널 B)이 나뉘고, 파이널 B는 7위 위로 못 올라간다
const sortTab=(t,split)=>{if(!split)return t.slice().sort(tabCmp);const A=t.filter(r=>split.includes(r.ci)).sort(tabCmp),B=t.filter(r=>!split.includes(r.ci)).sort(tabCmp);return A.concat(B)};
function myRank(p){const s=p.season;if(!s||!s.tab)return null;return sortTab(s.tab,s.split).findIndex(r=>r.ci===p.club)+1}
// 순위별 구역: 우승·대륙대회·승격·플레이오프·강등
function zoneOf(lg,rank,N){
  const l=LG[lg];if(!l||l.am)return '';
  const q=qualOf(lg,rank),qz=q?COMP[q].c:'';   // 다음 시즌 대륙대회 출전권 구역
  if(lg==='k1'){if(rank===N)return 'down';if(rank>=N-2)return 'po';return qz}
  if(lg==='k2'){if(rank===1)return 'up';if(rank<=5)return 'po';return ''}
  if(l.tier===1){if(rank>N-3)return 'down';return qz}
  if(rank<=2)return 'up';if(rank<=6)return 'po';return '';
}/* 경기 진행: 한 번에 최대 4경기. 피로는 경기마다 쌓이고 회복되며,
   과부하·번아웃에 들어서거나 부상을 당하면 그 경기에서 바로 멈추고 알려준다 */
function playRound(p,key){
  if(!APPR[key])key='normal';
  if(key==='attack'&&p.fatigue>=FAT_NOPUSH)key='normal';   // 지쳐 있으면 강도를 올릴 수 없다
  const s=p.season,ap=APPR[key];
  ensureTable(p);
  if(s.mi==null)s.mi=Math.min(s.round*PER,s.games);
  // 다음 경기를 진행하면 이전 소식은 읽은 것으로 처리한다 (배지는 이번 경기들의 새 소식만 센다)
  s.seenPrev=s.newsSeq||0;s.seenMi=s.newsSeq||0;s.roleChange=null;
  const res=[],half=s.games/2,startMi=s.mi;s.alert=null;p.note=null;s.fat0=Math.round(p.fatigue);
  s.streak=key==='attack'?(s.streak||0)+1:0;s.mult=key==='attack'?pushMult(s.streak-1):1;s.lastAppr=key;
  const fx=fixtures(p),bigAhead=fx.some(f=>f.tags.includes('big'));
  // 빅매치를 앞두고 쉬겠다고 하면 감독이 실망한다. 약팀 상대로 쉬는 건 괜찮다
  if(ap.rest&&bigAhead&&p.stage==='pro'){p.morale=clamp(p.morale-3,0,100);if(p.standing!=null)p.standing=Math.max(0,p.standing-5);addNews(p,'[팀] 빅매치를 앞두고 휴식을 요청해 감독이 실망했다','bad')}
  for(let i=0;i<PER&&s.mi<s.games;i++){
    const before=p.fatigue,m=simMatch(p,s,ap,s.mi+1,fx[i]);
    p.fatigue=Math.max(0,p.fatigue-matchRecovery(p.fatigue));
    m.fat=Math.round(p.fatigue);m.tired=m.play&&before>=60;m.pen=m.play?fatiguePenalty(before):0;
    res.push(m);s.mi++;
    if(!s.split&&s.tabLg==='k1'&&!s.tabU21&&s.mi>=33){s.split=sortTab(s.tab).slice(0,6).map(r=>r.ci);addNews(p,`[K리그] 33라운드 종료 · ${s.split.includes(p.club)?'파이널 A(상위 스플릿) 진출!':'파이널 B(하위 스플릿)에서 잔류 경쟁'}`,s.split.includes(p.club)?'good':'bad')}
    if(m.inj)break;                                                        // 부상: 즉시 대처를 고르게 한다
    if(m.play&&!m.inj&&!m.sub&&m.tags&&m.tags.includes('big')&&Math.abs(m.gf-m.ga)<=1&&Math.random()<.4){p.moment=buildMoment(p,m,'league');break}   // 접전인 빅매치: 결정적 순간
    if(!p.restLeft&&p.fatigue>=FAT_REST){p.restLeft=REST_GAMES;s.alert='rest';break}   // 번아웃: 4경기 강제 휴식
    if(before<FAT_SUB&&p.fatigue>=FAT_SUB)s.alert='sub';                   // 과부하 진입 (계속 밀어붙이면 번아웃)
    // 주중 대륙대회 경기 (출전권이 있는 시즌만)
    if(s.cc){const cm=ccStep(p,ap);let stop=false;
      for(const c of cm){res.push(c);if(c.inj){stop=true;break}
        if(c.play&&!c.sub&&!c.inj&&c.tags.includes('big')&&Math.abs(c.gf-c.ga)<=1&&Math.random()<(c.ko?.45:.2)){p.moment=buildMoment(p,c,'cc');stop=true;break}}
      if(stop)break}
  }
  s.last=res;s.round++;s.boost=0;s.fx=fx.slice(res.length);
  if(key==='attack'&&res.some(m=>m.play))s.pushRounds=(s.pushRounds||0)+1;
  if(key==='attack'&&!res.some(m=>m.play))s.streak=Math.max(0,s.streak-1);
  if(ap.rest)p.morale=clamp(p.morale-3,0,100);
  roundMorale(p,res);
  p.chem=clamp((p.chem==null?40:p.chem)+res.filter(m=>m.play).length*1.2,0,100);
  if((p.stage==='pro'||p.stage==='hs'||p.stage==='univ')&&!p.fa)updateStanding(p,res);
  rivalPlays(p,res.length);pressAfterRound(p,res);
  const crossedHalf=startMi<half&&s.mi>=half,done=s.mi>=s.games;
  if(startMi<s.games*.8&&s.mi>=s.games*.8&&!done)scheduleFinals(p);
  if(p.mil.st==='serving'&&(crossedHalf||done)){
    p.mil.left--;
    if(p.mil.left<=0){
      const r=p.mil.ret;s.from=teamName(p.club,false);
      p.club=r.club;p.u21=r.u21;p.contract={years:r.years,salary:r.salary};p.mil={st:'done',why:'김천 상무 복무'};
      p.role=roleFor(p,p.club,p.u21);p.morale=clamp(p.morale+8,0,100);
      p.note=`전역! 병역 의무를 마치고 원소속팀 ${teamName(p.club,p.u21)}에 복귀했습니다.`;
    }
  }
  if(crossedHalf&&p.rival&&s.rv)addNews(p,`[라이벌] 전반기 결산 · ${p.rival.name}(${CLUBS[p.rival.ci].name}) ${rivalLine(p,s,true)}`,'');
  if(done){if(s.cc)ccSettle(p);s.done=true;return}
  // A매치 소집은 자동으로 합류(소식만 남김), 대회 소집(월드컵·아시안컵·아시안게임·올림픽)만 직접 고른다
  if(crossedHalf&&s.calls&&s.calls.length){const inj=p.injury>0;
    if(inj)addNews(p,'[대표팀] 부상으로 대표팀 소집에서 제외됐습니다','bad');
    else{if(s.calls.some(c=>c.k==='a')){s.joined.push('a');p.fatigue+=6;addNews(p,'[대표팀] A매치 기간 국가대표 소집 · 피로 +6','good')}p.callQ=s.calls.filter(c=>c.k!=='a')}}
  // 무소속: 겨울 이적시장에 FA 영입 제안이 온다. 없으면 입단 테스트 기회가 생기기도 한다
  if(crossedHalf&&p.fa){
    let offs=scout(p,'fa');
    if(!offs.length&&!longInj(p)&&Math.random()<.6){const pool=CLUBS.map((c,i)=>i).filter(i=>['k1','k2'].includes(CLUBS[i].lg)&&!CLUBS[i].noOffer&&ovr(p)>=teamLv(i,false)-10);if(pool.length){const of=mkOffer(p,pick(pool),false,'입단 테스트 합격');of.years=1;offs=[of]}}
    if(offs.length){offs.forEach(o=>{o.block=0;if(o.label==='FA 영입 제안')o.label='겨울 FA 영입 제안'});p.winter=offs;return}
    addNews(p,'[이적] 겨울 이적시장에서도 연락이 오지 않았다. 여름 이적시장을 기다린다','bad');
  }
  // 보스만: 계약 마지막 시즌 겨울에는 다른 구단과 사전 계약을 맺을 수 있다 (소속팀이 막을 수 없음)
  if(crossedHalf&&p.stage==='pro'&&p.contract.years===1&&!p.loan&&p.mil.st!=='serving'&&!p.precontract&&Math.random()<.6){
    const pre=scout(p,'fa').slice(0,2).map(o=>{o.pre=true;o.label='보스만 사전 계약';o.block=0;o.fee=0;return o});
    if(pre.length){p.winter=pre;return}
  }
  if(crossedHalf&&p.stage==='pro'&&!p.fa&&p.mil.st!=='serving'&&!p.loan&&Math.random()<(p.wantsOut||p.strike?.9:.4)){
    const offs=scout(p,'winter');
    if(offs.length){p.winter=offs;return}
  }
  // 이벤트는 가끔만: 라운드당 12%, 한 시즌 최대 3개
  if(!s.alert&&(s.evCount||0)<3&&Math.random()<.12*res.length/PER){p.event=pickEvent(p);if(p.event!=null)s.evCount=(s.evCount||0)+1}
}// 같은 이벤트가 반복되지 않게: 이번 시즌에 나온 것과 최근 6개는 제외
function pickEvent(p){
  if(p.fa)return null;   // 무소속일 때는 팀 이벤트가 없다
  const s=p.season;s.usedEv=s.usedEv||[];p.evHist=p.evHist||[];
  const recent=p.evHist.slice(-6);
  const ok=EVENTS.map((e,i)=>i).filter(i=>(!EVENTS[i].c||EVENTS[i].c(p))&&!s.usedEv.includes(EVENTS[i].t)&&!recent.includes(EVENTS[i].t));

  let tot=ok.reduce((a,i)=>a+(EVENTS[i].w||1),0),r=Math.random()*tot,i=ok[0];for(const k of ok){r-=EVENTS[k].w||1;if(r<=0){i=k;break}}

// 라운드 결과에 따라 사기가 움직인다: 활약, 출전 시간, 팀 성적
function roundMorale(p,res){

/* 이벤트: 같은 선택이라도 결과가 매번 다르다. 좋은 선택이 역효과를 낼 때도 있고, 소극적인 선택이 뜻밖에 잘 풀릴 때도 있다 */

const EVENTS=[

// 역할에서 중요한 능력치 중 가장 낮은 것
function weakStat(p){const w=DPOS[dposOf(p)].w;return STATS.filter(k=>w[k]>=.1).sort((a,b)=>p.stats[a]-p.stats[b])[0]||STATS[0]}

/* ---------- promotion & relegation ---------- */
// 리그 순위표를 만든다. 목록에 없는 팀은 이름 없는 팀으로 채우고, 내 팀은 실제 순위에 넣는다
function simTable(lg,fixed,order){
  if(order&&fixed)return order.map((ci,i)=>({ci,rank:i+1}));   // 내 리그는 실제 순위표 그대로
  const N=LG[lg].teams,ids=clubsIn(lg).filter(i=>!fixed||i!==fixed.ci);
  const e=ids.map(i=>({ci:i,s:CLUBS[i].str+gauss()*2.2}));
  for(let k=e.length+(fixed?1:0);k<N;k++)e.push({ci:null,s:-1+gauss()*1.8});
  e.sort((a,b)=>b.s-a.s);
  if(fixed)e.splice(clamp(fixed.rank,1,N)-1,0,{ci:fixed.ci});
  return e.map((x,i)=>({ci:x.ci,rank:i+1}));
}
// 리그를 옮기면 절대 전력은 유지하고 새 리그 기준으로 다시 계산한다
// 리그를 옮기면 절대 전력은 유지하되, 승격팀은 1부 적응에 애를 먹고(전력 -2) 강등팀은 2부에서 강팀이 된다
function moveClub(ci,to,drop){const c=CLUBS[ci],abs=LG[c.lg].lv+c.str;c.lg=to;c.str=clamp(abs-LG[to].lv+(drop?0:-2),-7,8)}
/* 승강 규칙: 1부 최하위 3팀 강등 · 2부 1·2위 자동 승격 · 2부 3~6위 플레이오프(준결승 3위-6위, 4위-5위 → 결승) 우승팀 승격 */
const poName=(x,lg)=>x.ci!=null?CLUBS[x.ci].name:`${LG[lg].name} ${x.rank}위 팀`;
function poMatch(p,x,y,lg){
  const me=p.stage==='pro'&&!p.u21?p.club:null,lv=e=>e.ci!=null?teamLv(e.ci,false):LG[lg].lv-1+gauss()*1.5;
  const mine=x.ci===me?x:y.ci===me?y:null;
  let sx=lv(x),sy=lv(y);const o=ovr(p);
  const playing=mine&&p.injury<=0&&!p.strike&&p.fatigue<FAT_REST;
  if(playing){const d=(o-clubLv(p))*.35;if(mine===x)sx+=d;else sy+=d}
  let gx=poisson(clamp(1.3+(sx-sy)*.07,.3,3)),gy=poisson(clamp(1.3+(sy-sx)*.07,.3,3)),pk=false;
  if(gx===gy){pk=true;if(Math.random()<.5+(sx-sy)*.02)gx++;else gy++}
  const win=gx>gy?x:y;let myG=0;
  if(playing){const dp=DPOS[dposOf(p)],gf=mine===x?gx:gy;for(let i=0;i<gf;i++)if(Math.random()<dp.goal)myG++}
  return {win,line:`${poName(x,lg)} ${gx}:${gy} ${poName(y,lg)}${pk?' (승부차기)':''}${myG?` · 내 ${myG}골`:''}`,mineIn:!!mine,mineWon:mine===win};
}
function seasonMovements(p,rank,order){
  const me=p.stage==='pro'&&!p.u21?p.club:null,news=[];let my=null,myPo=null;
  for(const pr of PAIRS){
    const fx=lg=>me!=null&&CLUBS[me].lg===lg?{ci:me,rank}:null;
    const T=simTable(pr.top,fx(pr.top),order),B=simTable(pr.bot,fx(pr.bot),order),Nt=T.length;
    // 다음 시즌 대륙대회 출전권과 지난 시즌 순위 기록
    T.forEach(x=>{if(x.ci!=null){CLUBS[x.ci].lastRank=x.rank;CLUBS[x.ci].comp=qualOf(pr.top,x.rank)}});
    B.forEach(x=>{if(x.ci!=null){CLUBS[x.ci].lastRank=x.rank;CLUBS[x.ci].comp=null}});
    let D,U,poWinCi=null;
    if(pr.top==='k1'){
      // K리그 실제 승강 방식: 1부 12위 다이렉트 강등 · 2부 1위 다이렉트 승격
      // 승강 PO: 1부 11위 vs 2부 2위, 1부 10위 vs 2부 PO 승자(4위-5위 준PO → 승자 vs 3위)
      const t=k=>T.find(x=>x.rank===k),b=k=>B.find(x=>x.rank===k);
      D=[t(Nt)];U=[b(1)];
      const q1=poMatch(p,b(4),b(5),pr.bot),q2=poMatch(p,b(3),q1.win,pr.bot);

  // 랭킹에서 다른 사람이 볼 커리어 카드 (경력·하이라이트·은퇴 후 이야기)
  rec.detail={avg:t.avg?Math.round(t.avg*100)/100:0,conc:t.conc||0,
    stints:careerStints(p).map(r=>({n:r.mil?'현역 복무':r.fa?'무소속':r.name,ci:r.ci,y1:r.y1,y2:r.y2,a:r.apps,g:r.goals,as:r.assists,cs:r.cs,rt:r.apps?Math.round(r.rs/r.apps*100)/100:0,l:r.loan?1:0})).slice(-14),
    hl:careerHighlights(p).map(x=>({i:x.i,k:x.k,v:x.v,d:x.d})),story:(p.final.story&&p.final.story.lines||[]).map(x=>({i:x.i,t:x.t}))};
  p.final.id=rec.id;p.final.rec=rec;p.final.saved=null;   // 저장 여부는 은퇴 화면에서 고른다
}
function saveCareer(p,yes){const f=p.final;if(!f||f.saved!=null)return;f.saved=!!yes;if(yes){G.hof.unshift(f.rec);G.hof=G.hof.slice(0,60)}delete f.rec}

/* ---------- shared ranking (Supabase REST) ---------- */
const sharedOn=()=>!!(SUPABASE_URL&&SUPABASE_KEY);
function sbHeaders(){const h={apikey:SUPABASE_KEY,'Content-Type':'application/json'};if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;return h}
async function fetchRanking(){
  if(!sharedOn())return;
  G.rank.loading=true;G.rank.err=null;G.rank.view=null;render();
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/hof?select=*&order=score.desc&limit=10`,{headers:sbHeaders()});   // 상위 10명만
    if(!r.ok)throw new Error('HTTP '+r.status);
    G.rank.rows=await r.json();
  }catch(e){G.rank.err='랭킹을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'}
  G.rank.loading=false;render();
}
async function shareRecord(id){
  const h=G.hof.find(x=>x.id===id);if(!h||h.shared||!sharedOn())return;
  h.sharing=true;render();
  try{
    const body={name:h.name.slice(0,12),num:h.num,pos:h.pos,dpos:h.dpos||null,peak:h.peak,score:h.score,grade:h.grade||gradeOf(h.score),
      apps:h.apps,goals:h.goals,assists:h.assists,caps:h.caps,trophies:h.trophies,club:h.club,retired_year:h.year,retired_age:h.age,
      // 'highlights' 칸에 커리어 카드(경력·하이라이트)와 등록자 닉네임을 JSON으로 함께 담는다
      highlights:JSON.stringify({v:2,top:h.top||[],nick:G.auth?(G.auth.nick||G.auth.name):null,cs:h.cs||0,tTeam:h.tTeam,tInd:h.tInd,intlGoals:h.intlGoals||0,d:h.detail||null})};
    const r=await fetch(`${SUPABASE_URL}/rest/v1/hof`,{method:'POST',headers:{...sbHeaders(),Prefer:'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    h.shared=true;G.rank.rows=null;
  }catch(e){h.shareErr='등록하지 못했어요. 잠시 후 다시 시도해 주세요.'}
  h.sharing=false;store();render();
}

/* ---------- 계정: 아이디·비밀번호 (Supabase Auth, 이메일 없이) ----------
   아이디는 내부적으로 가짜 이메일(아이디@ID_DOMAIN)로 바꿔 가입한다. 메일은 보내지 않는다.
   비밀번호는 저장하지 않고, 로그인 토큰만 이 브라우저에 보관한다 */
const AUTHKEY='kickoff-life-auth',DEVKEY='kickoff-life-device',ID_DOMAIN='players.kickofflife.app';
const idEmail=id=>`${id.toLowerCase()}@${ID_DOMAIN}`;
const ID_RE=/^[a-z0-9_]{3,12}$/;
G.auth=load(AUTHKEY,null);
G.acct={mode:'login',id:'',pw:'',pw2:'',code:'',busy:false,err:null,newCode:null,conflict:null,saved:null};
function saveAuth(){try{G.auth?localStorage.setItem(AUTHKEY,JSON.stringify(G.auth)):localStorage.removeItem(AUTHKEY)}catch(e){}}
const deviceId=()=>load(DEVKEY,null);
async function authReq(path,body){
  const r=await fetch(`${SUPABASE_URL}/auth/v1/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j;
}
function setSession(j,name){G.auth={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user&&j.user.id,name};saveAuth()}
async function authToken(){
  if(!G.auth)return null;
  if(Date.now()>G.auth.exp-60000){
    try{const j=await authReq('token?grant_type=refresh_token',{refresh_token:G.auth.rt});setSession(j,G.auth.name)}
    catch(e){G.auth=null;saveAuth();render();return null}
  }
  return G.auth.at;
}
async function rest(path,opt){
  opt=opt||{};const t=await authToken();if(!t)throw new Error('로그인이 필요해요');
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok)throw new Error('HTTP '+r.status);const tx=await r.text();return tx?JSON.parse(tx):null;
}
// 복구 코드: 비밀번호를 잊었을 때 쓰는 일회성 열쇠 (헷갈리는 글자 0/O, 1/I 제외)
function makeCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',u=new Uint32Array(12);crypto.getRandomValues(u);const s=[...u].map(x=>A[x%A.length]).join('');return `${s.slice(0,4)}-${s.slice(4,8)}-${s.slice(8)}`}
const authErr=e=>{const m=(e&&(e.msg||e.error_description||e.message||e.error))||'';
  if(/already registered|already exists/i.test(m))return '이미 있는 아이디예요. 다른 아이디를 써 주세요.';
  if(/Invalid login/i.test(m))return '아이디나 비밀번호가 맞지 않아요.';
  if(/Password should be/i.test(m))return '비밀번호는 6자 이상이어야 해요.';
  if(/confirm/i.test(m))return 'Supabase에서 Confirm email 설정을 꺼 주세요.';
  return '연결에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'};
const saveData=()=>({p:G.p,hof:G.hof,b11:G.b11,unlock:G.unlock,ach:G.ach,frRec:G.frRec,chal:G.chal,create:{seed:G.create.seed,rerolls:G.create.rerolls,used:G.create.used}});
function applyData(d){
  if(!d)return;G.p=d.p||null;G.hof=d.hof||[];G.b11=d.b11||G.b11;if(d.create)Object.assign(G.create,d.create);if(d.unlock)G.unlock=UNLOCK_ORDER.filter(k=>d.unlock.includes(k)||G.unlock.includes(k));syncUnlock();
  if(d.ach)G.ach={...d.ach,...G.ach};if(d.frRec)G.frRec={...d.frRec,...G.frRec};if(d.chal){for(const k in d.chal)G.chal[k]=Math.max(G.chal[k]||0,d.chal[k])}
  if(G.p){applyWorld(G.p.world);G.p.evHist=G.p.evHist||[]}
}
// 자동 클라우드 저장: 진행할 때마다 몇 초 모았다가 한 번에 올린다
let cloudTimer=null;
function cloudSaveSoon(){if(!sharedOn()||!G.auth||G.acct.conflict)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,2500)}
async function cloudSave(){
  if(!G.auth)return;
  try{await rest('saves',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:G.auth.uid,data:saveData(),updated_at:new Date().toISOString()})});
    if(!G.fr.off)try{await rest('showcase',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(showcaseData())})}catch(e){}
    G.acct.saved=Date.now();G.acct.saveErr=false}
  catch(e){G.acct.saveErr=true}
  if(G.screen==='home'||(G.screen==='acct'&&G.auth))render();
}
async function afterLogin(){
  await loadProfile();loadFriends(true);
  // 클라우드 기록과 이 기기 기록이 둘 다 있으면 어느 쪽을 쓸지 묻는다
  const rows=await rest(`saves?select=data,updated_at&user_id=eq.${G.auth.uid}`);
  const cloud=rows&&rows[0]&&rows[0].data,local=G.p||G.hof.length;
  if(cloud&&local&&JSON.stringify(cloud)!==JSON.stringify(saveData())){G.acct.conflict={data:cloud,at:rows[0].updated_at};return}
  if(cloud)applyData(cloud);else await cloudSave();
  store();if(needNick()){G.screen='acct';G.acct.mode='nick'}else G.screen='home';
}
async function acctSubmit(kind){
  const a=G.acct,id=a.id.trim().toLowerCase();a.err=null;
  if(!ID_RE.test(id)){a.err='아이디는 영문 소문자·숫자·_ 로 3~12자예요.';return render()}
  if(kind!=='reset'&&a.pw.length<6){a.err='비밀번호는 6자 이상이어야 해요.';return render()}
  if(kind==='signup'&&a.pw!==a.pw2){a.err='비밀번호 확인이 일치하지 않아요.';return render()}
  if(kind==='signup'&&deviceId()){a.err='이 기기에서는 이미 아이디를 만들었어요.';return render()}
  if(kind==='signup'&&!NICK_RE.test((a.nick||'').trim())){a.err='닉네임은 한글·영문·숫자·_ 로 2~10자예요.';return render()}
  a.busy=true;render();
  try{
    if(kind==='signup'){
      const j=await authReq('signup',{email:idEmail(id),password:a.pw});
      if(!j.access_token)throw {msg:'confirm'};
      setSession(j,id);try{localStorage.setItem(DEVKEY,JSON.stringify(id))}catch(e){}
      const code=makeCode();await rest('rpc/set_recovery',{method:'POST',body:JSON.stringify({p_code:code})});
      // 가입 화면에서 받은 닉네임을 바로 저장. 그 사이 누가 먼저 썼으면 복구 코드 뒤에 다시 정하게 한다
      const nk=(a.nick||'').trim(),nr=await putNick(nk);
      if(nr==='dup'){a.nickMsg=`'${nk}'은(는) 이미 있는 닉네임이에요. 다른 닉네임을 정해 주세요.`;a.nick=''}
      else if(nr==='err')await loadProfile();
      else a.nick='';
      a.newCode=code;await cloudSave();
    }else if(kind==='login'){
      const j=await authReq('token?grant_type=password',{email:idEmail(id),password:a.pw});
      setSession(j,id);await afterLogin();
    }else{
      if(a.pw.length<6){a.err='새 비밀번호는 6자 이상이어야 해요.';a.busy=false;return render()}
      const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/reset_password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_username:id,p_code:a.code.trim().toUpperCase(),p_new:a.pw})});
      const ok=r.ok&&await r.json();
      if(!ok){a.err='아이디나 복구 코드가 맞지 않아요.'}
      else{const j=await authReq('token?grant_type=password',{email:idEmail(id),password:a.pw});setSession(j,id);await afterLogin()}
    }
    a.pw='';a.pw2='';a.code='';
  }catch(e){a.err=authErr(e)}
  a.busy=false;store();render();
}

  // 비밀번호 변경

const slotList=f=>FORMATIONS[f].flatMap((row,r)=>row.map((d,c)=>({d,key:`${r}-${c}`})));
// 은퇴 선수가 특정 역할에서 보여줄 능력: 전성기 능력치 기준, 포지션군이 다르면 감점
function slotRating(h,d){
  const g=DPOS[d].g;
  if(!h.stats)return Math.round(h.peak*(h.pos===g?1:g==='GK'||h.pos==='GK'?.35:.8));
  const f=fitOf(h.stats,d);
  if(h.pos===g)return f;
  return Math.round(f*(g==='GK'||h.pos==='GK'?.35:.9));
}
function autoB11(){
  const sl=slotList(G.b11.f),pairs=[];
  sl.forEach(s=>G.hof.forEach(h=>pairs.push({s:s.key,id:h.id,r:slotRating(h,s.d)})));
  pairs.sort((a,b)=>b.r-a.r);
  const used=new Set(),slots={};
  pairs.forEach(x=>{if(!slots[x.s]&&!used.has(x.id)){slots[x.s]=x.id;used.add(x.id)}});
  G.b11.slots=slots;G.b11.sel=null;G.b11.match=null;
}
function teamRating(){
  const sl=slotList(G.b11.f),line={att:[],mid:[],def:[]};let sum=0,n=0;
  sl.forEach(s=>{const h=G.hof.find(x=>x.id===G.b11.slots[s.key]);const r=h?slotRating(h,s.d):40;sum+=r;n++;
    const g=DPOS[s.d].g;(g==='FW'?line.att:g==='MF'?line.mid:line.def).push(r)});
  const av=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  return {ovr:Math.round(sum/n),att:av(line.att),mid:av(line.mid),def:av(line.def),filled:sl.filter(s=>G.hof.some(h=>h.id===G.b11.slots[s.key])).length};
}
const OPP=[{n:'K리그 올스타',lv:66},{n:'아시아 올스타',lv:71},{n:'유럽 올스타',lv:77},{n:'역대 월드 레전드',lv:83}];
function friendly(i){
  const t=teamRating(),o=OPP[i],diff=t.ovr-o.lv;
  const gf=poisson(clamp(1.4+diff*.08+(t.att-t.ovr)*.03,.2,4)),ga=poisson(clamp(1.3-diff*.08-(t.def-t.ovr)*.03,.2,4));
  const sc=[];const ids=Object.values(G.b11.slots);
  for(let k=0;k<gf;k++){const att=slotList(G.b11.f).filter(s=>DPOS[s.d].g!=='GK').map(s=>({h:G.hof.find(x=>x.id===G.b11.slots[s.key]),w:DPOS[s.d].goal+.02})).filter(x=>x.h);
    if(!att.length)break;let r=Math.random()*att.reduce((a,x)=>a+x.w,0),pk=att[0];for(const x of att){r-=x.w;if(r<=0){pk=x;break}}sc.push(`${ri(1,90)}' ${pk.h.name}`)}
  G.b11.match={opp:o.n,gf,ga,sc:sc.sort((a,b)=>parseInt(a)-parseInt(b))};

/* ---------- 포지션 해금 ----------
   공격수부터 시작. 그 포지션으로 S등급(78점 이상) 커리어를 한 번 만들면 다음 포지션이 열린다
   (공격수 → 미드필더 → 수비수 → 골키퍼). 명예의 전당에 저장하지 않아도 은퇴할 때 S등급이면 열린다 */
const UNLOCK_ORDER=['FW','MF','DF','GK'],UNLOCK_SCORE=78,UNLOCKKEY='kickoff-life-unlock';
G.unlock=load(UNLOCKKEY,null);
function syncUnlock(){
  const first=G.unlock==null,u=new Set(G.unlock||[]);u.add('FW');
  // 이 기능이 생기기 전에 이미 키워 본 포지션은 열어 둔다
  if(first){G.hof.forEach(h=>u.add(h.pos));if(G.p&&G.p.pos)u.add(G.p.pos)}
  G.hof.forEach(h=>{if(h.score>=UNLOCK_SCORE){const i=UNLOCK_ORDER.indexOf(h.pos);if(i>=0&&i<UNLOCK_ORDER.length-1)u.add(UNLOCK_ORDER[i+1])}});
  G.unlock=UNLOCK_ORDER.filter(k=>u.has(k));
}
syncUnlock();
const isUnlocked=pos=>G.unlock.includes(pos);
const unlockNeed=pos=>{const i=UNLOCK_ORDER.indexOf(pos);return i>0?`${POS[UNLOCK_ORDER[i-1]].name} S등급 1명`:''};
// 은퇴할 때 S등급이면 다음 포지션 해금. 새로 열린 포지션 이름을 돌려준다
function unlockByCareer(pos,score){
  if(score<UNLOCK_SCORE)return null;
  const i=UNLOCK_ORDER.indexOf(pos),nx=UNLOCK_ORDER[i+1];
  if(!nx||isUnlocked(nx))return null;
  G.unlock=UNLOCK_ORDER.filter(k=>k===nx||G.unlock.includes(k));return nx;
}

function lineRating(line){

  line.forEach(s=>{const r=s.h?slotRating(s.h,s.d):40;sum+=r;const k=DPOS[s.d].g;(k==='FW'?g.att:k==='MF'?g.mid:g.def).push(r)});

function pickScorers(line,n){
  const pool=line.filter(s=>s.h&&DPOS[s.d].g!=='GK').map(s=>({n:s.h.name,w:DPOS[s.d].goal+.02})),out=[];
  for(let k=0;k<n;k++){if(!pool.length){out.push({m:ri(1,90),n:'유스 선수'});continue}
    let r=Math.random()*pool.reduce((a,x)=>a+x.w,0),pk=pool[0];for(const x of pool){r-=x.w;if(r<=0){pk=x;break}}out.push({m:ri(1,90),n:pk.n})}

  if(good&&Math.random()<.5)extra.push(pk([{i:'📖',t:`자서전 『${pk(['마지막 휘슬까지','그라운드 위의 나','다시, 킥오프'])}』을 출간해 베스트셀러가 됐다.`},{i:'🎟️',t:`은퇴 기념 경기에 옛 동료들이 총출동했다.`}]));

  if(out[0].k!=='bad'&&extra.length)out.push(...extra.slice(0,2));
  return {grade:g,lines:out};
}

/* ---------- 대륙대회: 조별리그 → 토너먼트 ----------
   출전권이 있는 팀은 리그 사이사이 주중에 대륙대회 경기를 치른다. 조 추첨(포트·같은 리그 회피)과
   토너먼트 추첨은 실제처럼 하고, 다른 팀 경기는 전력으로 확률 계산한다. 내 경기는 직접 뛰어 시즌 기록에 더해진다 */
const CC_F={

  UECL:[['헹크',64],['AEK 아테네',63],['헤이렌베인',62],['세르클러 브뤼허',62],['레기아 바르샤바',61],['마카비 텔아비브',61],['LASK',61],['라피드 빈',61],['시그마 올로모우츠',60],['하이두크 스플리트',60],['레흐 포즈난',60],['유르고르덴',60],['아포엘',59],['FC 루체른',59],['오모니아',58],['첼레',58],['HJK 헬싱키',57],['샴록 로버스',56],['FC 루가노',59],['비킹구르',54]],
  ACLE:[['알 힐랄',67],['알 나스르',67],['알 이티하드',66],['알 아흘리',66],['알 사드',63],['요코하마 F. 마리노스',63],['비셀 고베',63],['가와사키 프론탈레',63],['산프레체 히로시마',62],['알 아인',62],['샤바브 알아흘리',61],['상하이 하이강',61],['페르세폴리스',60],['상하이 선화',59],['부리람 유나이티드',59],['조호르 다룰 탁짐',58]],
  ACL2:[['감바 오사카',61],['산둥 타이산',60],['알 와슬',59],['샤르자',59],['세파한',58],['이스테그랄',58],['나사프 카르시',56],['방콕 유나이티드',56],['포트 FC',55],['라이언 시티 세일러스',55],['동아시아 예선 통과팀',54],['서아시아 예선 통과팀',54]]
};
const CC_RR=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
const CC_RN={16:'16강',8:'8강',4:'준결승'};
const ccTag=cc=>`[${COMP[cc.cp].s}]`;
const ccMine=(p,cc)=>cc.ci===p.club&&!p.u21;
function ccSim(A,B){const d=A.lv-B.lv;return [poisson(clamp(1.35+d*.07,.3,3.5)),poisson(clamp(1.35-d*.07,.3,3.5))]}
function ccInit(p){
  const s=p.season,cp=CLUBS[p.club].comp;if(!cp||p.u21||p.stage!=='pro')return;
  const G=cp==='ACLE'||cp==='ACL2'?4:8,N=G*4,euro=!(cp==='ACLE'||cp==='ACL2');
  const okLg=i=>euro?LG[CLUBS[i].lg].euro&&LG[CLUBS[i].lg].tier===1:CLUBS[i].lg==='k1';
  const real=CLUBS.map((c,i)=>i).filter(i=>CLUBS[i].comp===cp&&okLg(i));if(!real.includes(p.club))real.push(p.club);
  const T=i=>({ci:i,n:CLUBS[i].name,lv:teamLv(i,false),lg:CLUBS[i].lg});
  let teams=real.map(T).concat(shuffle(CC_F[cp].slice()).map(([n,lv])=>({ci:null,n,lv:lv+gauss()*.8,lg:null})));
  if(teams.length<N)shuffle(CLUBS.map((c,i)=>i).filter(i=>okLg(i)&&!teams.some(t=>t.ci===i))).slice(0,N-teams.length).forEach(i=>teams.push(T(i)));
  while(teams.length<N)teams.push({ci:null,n:`예선 통과팀 ${teams.length}`,lv:euro?62:56,lg:null});
  // 내 팀은 반드시 들어가게 하고, 전력 순으로 32(16)팀을 고른다
  const me=teams.find(t=>t.ci===p.club);teams=teams.filter(t=>t!==me).sort((a,b)=>b.lv-a.lv).slice(0,N-1).concat(me).sort((a,b)=>b.lv-a.lv);
  // 조 추첨: 전력 순 포트 4개, 포트마다 조에 한 팀씩. 같은 리그 팀은 같은 조를 피한다
  const groups=Array.from({length:G},()=>[]);
  for(let pot=0;pot<4;pot++)shuffle(teams.slice(pot*G,pot*G+G)).forEach(t=>{let gi=groups.findIndex(g=>g.length===pot&&!(t.lg&&g.some(x=>x.lg===t.lg)));if(gi<0)gi=groups.findIndex(g=>g.length===pot);groups[gi].push(t)});
  groups.forEach((g,gi)=>g.forEach(t=>Object.assign(t,{gi,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})));
  const mg=groups.findIndex(g=>g.includes(me));groups[mg].splice(groups[mg].indexOf(me),1);groups[mg].unshift(me);
  const gm=s.games,at=f=>Math.max(1,Math.round(gm*f));
  const gr=G===8?[.08,.15,.22,.29,.36,.43]:[.08,.16,.24,.32,.4,.48],ko=G===8?[[.55,.59],[.66,.7],[.76,.8]]:[[.6,.64],[.74,.78]];
  const sched=gr.map((f,md)=>({at:at(f),k:'g',md})).concat(ko.flatMap((r,ri)=>r.map((f,leg)=>({at:at(f),k:'ko',r:ri,leg}))));
  s.cc={cp,G,groups,mg,md:0,q:0,sched,ko:[],stage:'group',ci:p.club,alive:true,fin:null,champ:null};
  addNews(p,`${ccTag(s.cc)} 조 추첨 · ${'ABCDEFGH'[mg]}조: ${groups[mg].slice(1).map(t=>t.n).join(', ')}`,'');
}
// 토너먼트 추첨: 첫 판은 조 1위 vs 다른 조 2위(같은 리그 회피), 다음부터는 자유 추첨
function ccDraw(win,run){
  const ties=[];
  if(run){const rs=shuffle(run.slice());shuffle(win.slice()).forEach(w=>{let k=rs.findIndex(r=>r.gi!==w.gi&&!(w.lg&&r.lg===w.lg));if(k<0)k=rs.findIndex(r=>r.gi!==w.gi);if(k<0)k=0;ties.push({a:rs[k],b:w,legs:[]});rs.splice(k,1)})}
  else{const l=shuffle(win.slice());for(let i=0;i+1<l.length;i+=2)ties.push({a:l[i],b:l[i+1],legs:[]})}
  return {name:CC_RN[ties.length*2]||`${ties.length*2}강`,ties,done:false};
}
function ccPlay(p,ap,o,label,ko){
  const s=p.season,cc=s.cc,before=p.fatigue,big=ko||o.lv>=clubLv(p);
  const m=simMatch(p,s,ap,COMP[cc.cp].s,{oi:null,tags:big?['cc','cup','big']:['cc','cup'],cc:{n:o.n,lv:o.lv,s:COMP[cc.cp].s}});
  p.fatigue=Math.max(0,p.fatigue-matchRecovery(p.fatigue));m.fat=Math.round(p.fatigue);m.tired=m.play&&before>=60;m.pen=m.play?fatiguePenalty(before):0;
  m.ccRound=`${COMP[cc.cp].s} ${label}`;m.oci=o.ci;m.ko=!!ko;return m;
}
// 결과가 정해진 단계를 정리한다: 조별리그 순위 확정·추첨, 토너먼트 승자·다음 추첨, 결승
function ccSettle(p){
  const s=p.season,cc=s&&s.cc;if(!cc)return;const tag=ccTag(cc),mine=ccMine(p,cc);
  if(cc.stage==='group'&&cc.md>=6){
    cc.stage='ko';const sorted=cc.groups.map(g=>g.slice().sort(tabCmp));cc.sorted=sorted.map(g=>g.map(t=>t.n));
    const pos=sorted[cc.mg].findIndex(t=>t.ci===cc.ci)+1;cc.alive=pos<=2;
    cc.ko=[ccDraw(sorted.map(g=>g[0]),sorted.map(g=>g[1]))];
    if(mine){if(cc.alive){const t=cc.ko[0].ties.find(t=>t.a.ci===cc.ci||t.b.ci===cc.ci),o=t.a.ci===cc.ci?t.b:t.a;addNews(p,`${tag} 조별리그 ${pos}위로 ${cc.ko[0].name} 진출! 추첨 결과 상대는 ${o.n}`,'good',o.ci);mor(p,4)}
      else{addNews(p,`${tag} 조별리그 ${pos}위… ${COMP[cc.cp].n} 조별 탈락`,'bad');mor(p,-4)}}
    else if(cc.alive)addNews(p,`${tag} 친정팀 ${CLUBS[cc.ci].name}, 조별리그 통과`,'');
  }
  if(cc.stage==='ko'){const R=cc.ko[cc.ko.length-1];
    if(R&&!R.done&&R.ties.every(t=>t.legs.length===2&&t.legs[1])){
      R.done=true;
      R.ties.forEach(t=>{const A=t.legs[0][0]+t.legs[1][0],B=t.legs[0][1]+t.legs[1][1];t.agg=[A,B];
        if(A!==B)t.w=A>B?t.a:t.b;else{t.pk=true;t.w=Math.random()<clamp(.5+(t.a.lv-t.b.lv)*.03,.25,.75)?t.a:t.b}});
      const my=R.ties.find(t=>t.a.ci===cc.ci||t.b.ci===cc.ci);
      if(my&&cc.alive){const meA=my.a.ci===cc.ci,o=meA?my.b:my.a,ag=meA?my.agg:[my.agg[1],my.agg[0]];
        if(my.w.ci===cc.ci){if(mine){addNews(p,`${tag} ${R.name} 통과! vs ${o.n} 합계 ${ag[0]}-${ag[1]}${my.pk?' (승부차기)':''}`,'good',o.ci);mor(p,5)}}
        else{cc.alive=false;if(mine){addNews(p,`${tag} ${R.name} 탈락… vs ${o.n} 합계 ${ag[0]}-${ag[1]}${my.pk?' (승부차기)':''}`,'bad',o.ci);mor(p,-5)}}}
      const ws=R.ties.map(t=>t.w);
      if(ws.length===2){cc.stage='final';cc.fin={a:ws[0],b:ws[1]};
        if(cc.alive&&mine){const o=ws.find(t=>t.ci!==cc.ci);s.finals=(s.finals||[]).concat({name:COMP[cc.cp].n,opp:o.n,oppL:o.lv,cc:true});s.finalWins=s.finalWins||[];addNews(p,`[결승 진출] ${COMP[cc.cp].n} 결승 진출! 상대는 ${o.n}`,'good',o.ci)}
        else{const [x,y]=ccSim(ws[0],ws[1]);const w=x>y?ws[0]:x<y?ws[1]:Math.random()<.5?ws[0]:ws[1];cc.fin.res={gf:x,ga:y,pk:x===y};cc.champ=w.n;cc.stage='done';
          addNews(p,`${tag} 결승 ${ws[0].n} ${x}-${y} ${ws[1].n}${x===y?' (승부차기)':''} · 우승은 ${w.n}`,'',w.ci)}}
      else{cc.ko.push(ccDraw(ws));const N=cc.ko[cc.ko.length-1];
        if(cc.alive&&mine){const t=N.ties.find(t=>t.a.ci===cc.ci||t.b.ci===cc.ci),o=t.a.ci===cc.ci?t.b:t.a;addNews(p,`${tag} ${N.name} 추첨 · 상대는 ${o.n}`,'',o.ci)}}
    }}
}
// 리그 경기 뒤 그 시점까지 잡혀 있던 대륙대회 경기를 치른다 (내 경기는 결과 목록에 더해 돌려준다)
function ccStep(p,ap){
  const s=p.season,cc=s&&s.cc;if(!cc)return [];const out=[];
  ccSettle(p);
  while(cc.q<cc.sched.length&&cc.sched[cc.q].at<=s.mi){
    const ev=cc.sched[cc.q],mine=ccMine(p,cc);
    if(ev.k==='g'&&cc.stage==='group'){
      cc.groups.forEach((g,gi)=>CC_RR[ev.md%3].forEach(([x,y])=>{const A=g[x],B=g[y];
        if(mine&&(A.ci===cc.ci||B.ci===cc.ci)){const meA=A.ci===cc.ci,o=meA?B:A,m=ccPlay(p,ap,o,`조별리그 ${ev.md+1}차전`,false);
          m.ccRef={t:'g',gi,a:meA?x:y,b:meA?y:x};tabRes(meA?A:B,m.gf,m.ga);tabRes(o,m.ga,m.gf);out.push(m)}
        else{const [a,b]=ccSim(A,B);tabRes(A,a,b);tabRes(B,b,a)}}));
      cc.md++;
    }else if(ev.k==='ko'){
      if(cc.stage==='group')ccSettle(p);
      const R=cc.ko[ev.r];
      if(R&&!R.done)R.ties.forEach((t,ti)=>{if(t.legs[ev.leg])return;
        if(mine&&cc.alive&&(t.a.ci===cc.ci||t.b.ci===cc.ci)){const meA=t.a.ci===cc.ci,o=meA?t.b:t.a,m=ccPlay(p,ap,o,`${R.name} ${ev.leg+1}차전`,true);
          m.ccRef={t:'ko',r:ev.r,ti,leg:ev.leg,home:meA};t.legs[ev.leg]=meA?[m.gf,m.ga]:[m.ga,m.gf];out.push(m)}
        else t.legs[ev.leg]=ccSim(t.a,t.b)});
    }
    cc.q++;
    if(out.some(m=>m.inj))break;
  }
  return out;
}
// 결정적 순간으로 대륙대회 경기 결과가 바뀌었을 때
function ccFix(p,m,gf,ga){
  const s=p.season,cc=s.cc,def=p.pos==='GK'||p.pos==='DF';
  if(m.play&&def){if(m.ga===0&&ga>0)s.cs--;if(m.ga>0&&ga===0)s.cs++}
  if(m.play)s.conc=(s.conc||0)+(ga-m.ga);
  const ref=m.ccRef,undo=(r,x,y)=>{r.pl--;r.gf-=x;r.ga-=y;if(x>y){r.w--;r.pts-=3}else if(x===y){r.d--;r.pts--}else r.l--};
  if(cc&&ref){if(ref.t==='g'){const g=cc.groups[ref.gi];undo(g[ref.a],m.gf,m.ga);undo(g[ref.b],m.ga,m.gf);tabRes(g[ref.a],gf,ga);tabRes(g[ref.b],ga,gf)}
    else{const t=cc.ko[ref.r].ties[ref.ti];t.legs[ref.leg]=ref.home?[gf,ga]:[ga,gf]}}
  m.gf=gf;m.ga=ga;
}
// 순위 탭 › 대륙대회: 조별리그 순위표와 토너먼트 대진
function ccView(p){
  const cc=p.season.cc,C=COMP[cc.cp],L='ABCDEFGH';
  const row=(t,i)=>`<div class="trow${t.ci===cc.ci?' me':''}${i<2?' z-'+C.c:''}"><span class="num">${i+1}</span>${crest(t.ci,16)}<span class="tn">${esc(t.n)}</span>${tabCells(t)}</div>`;
  const gt=(g,gi)=>`<div class="ttab">${tabHead(`${L[gi]}조`,'')}${g.slice().sort(tabCmp).map(row).join('')}</div>`;

/* ---------- 결승전 ----------
   시즌 막판(80% 지점)에 컵대회·대륙대회 결승 진출 여부가 정해지고, 결승은 직접 치른다 */
const AFC_OPP=['요코하마 F. 마리노스','알 힐랄','상하이 하이강','가와사키 프론탈레','알 아인','부리람 유나이티드','알 나스르'];
function scheduleFinals(p){
  const s=p.season,l=curLg(p),club=CLUBS[p.club],rank=myRank(p)||99,eu=isEuro(p.club)&&!p.u21&&isTop(p.club);
  if(p.u21||s.finalsSet)return;s.finalsSet=true;
  const list=[],sameLg=clubsIn(club.lg).filter(i=>i!==p.club);
  if(l.cup&&Math.random()<clamp((.06+club.str*.025+(rank<=3?.05:0))*2.2,.04,.6))list.push({name:l.cup,opp:sameLg.length?teamName(pick(sameLg),false):'상대 팀',oppL:clubLv(p)+gauss()*3});
  // 대륙대회: 지난 시즌 순위로 얻은 출전권(UCL·UEL·UECL·ACLE·ACL2)에 따라 결승 진출을 노린다
  // 대륙대회는 실제 조별리그·토너먼트(s.cc)로 치른다. 예전 저장(s.cc 없음)만 확률로 결승을 정한다
  const cp=s.cc?null:club.comp;
  if(cp){const str=club.str,reach={UCL:(.04+str*.02)*2.2,UEL:.08+str*.025,UECL:.12+str*.03,ACLE:(.08+str*.03)*2,ACL2:.2+str*.03}[cp];
    const euPool=(lo,hi)=>CLUBS.map((c,i)=>i).filter(i=>i!==p.club&&CLUBS[i].lg!==club.lg&&LG[CLUBS[i].lg].euro&&LG[CLUBS[i].lg].tier===1&&CLUBS[i].str>=lo&&CLUBS[i].str<=hi);
    const pool=cp==='UCL'?euPool(4,9):cp==='UEL'?euPool(1,5):cp==='UECL'?euPool(-3,2):[];
    if(Math.random()<clamp(reach,.03,.45))list.push({name:COMP[cp].n,opp:pool.length?teamName(pick(pool),false):pick(AFC_OPP),oppL:clubLv(p)+({UCL:2,UEL:1,UECL:0,ACLE:1,ACL2:0}[cp])+gauss()*2});
  }
  s.finals=(s.finals||[]).concat(list);s.finalWins=s.finalWins||[];

function playFinal(p,mode){
  const s=p.season,f=pendingFinal(p);if(!f||p.moment)return;
  const lv=clubLv(p),o=ovr(p)+sharpMod(p),allIn=mode==='all';
  const can=p.injury<=0&&!(p.susp>0)&&!p.strike;
  const play=can&&Math.random()<({'주전':.97,'로테이션':.65,'벤치':.25}[p.role]||.5);
  const perf=play?5.72+(o-lv)/9+(allIn?.35:0)+moraleBonus(p.morale)+chemBonus(p)-fatiguePenalty(p.fatigue)+gauss()*.7:0;
  const diff=lv+(play?(o-lv)*.45+(perf-6.5)*.4:0)-f.oppL;
  let gf=poisson(clamp(1.3+diff*.07,.3,3.2)),ga=poisson(clamp(1.3-diff*.07,.3,3.2));
  let g=0,a=0,r=null;
  if(play){const dp=DPOS[dposOf(p)];for(let i=0;i<gf;i++){const u=Math.random();if(u<clamp(dp.goal*(1+(perf-6.5)*.35),0,.7))g++;else if(u<clamp(dp.goal*(1+(perf-6.5)*.35),0,.7)+clamp(dp.ast*(1+(perf-6.5)*.3),0,.5))a++}
    r=clamp(perf+.3+g*.45+a*.3+(gf>ga?.3:gf<ga?-.2:0)+(p.pos==='GK'?(ga===0?.45:0)-ga*.15:p.pos==='DF'?(ga===0?.4:0)-ga*.08:0),4,10)}

  if(win){s.finalWins.push(f.name);p.finalWins=(p.finalWins||0)+1;mor(p,8);repA(p,play?3:1);celebrate('🏆',`${f.name} 우승!`,`결승 vs ${f.opp} ${gf}-${ga}${pk?' (승부차기)':''}${play?` · 평점 ${dr(r)}${g?` · ${g}골`:''}`:''}`)}else mor(p,-5);
  const me=play?` · ${p.name} ${g?`${g}골 `:''}${a?`${a}도움 `:''}평점 ${dr(r)}`:' · 출전하지 못했다';

  addNews(p,`[결승] ${f.name} ${win?'우승!':'준우승'} · ${gf}-${ga}${pk?' (승부차기)':''}`,win?'good':'bad');

function buildMoment(p,m,kind,idx){

  const S=pick(MOMENTS[grp]),od=shuffle(S.pool.slice()).slice(0,4).map(([t,o,st,b,dir])=>({t,o,st,b,dir}));
  const type={goal:'shot',assist:'pass',team:'pass',keep:'pass',block:'def',foul:'def',save:'pk'}[od[0].o]||'shot';
  // 숨은 변수: 장면마다 새로 뽑는다 (골키퍼·키커가 노리는 방향, 수비 위치 등)
  const w=od.map(()=>Math.random()),lean=Math.floor(Math.random()*3);
  return {kind,type,grp,dirK:S.dirK||null,title:S.title,txt:`${where} ${min}분, ${sc}. ${S.txt}`,opts:od.map(x=>x.t),od,w,lean,min,where,idx,m};

function momentChance(p,M,i){
  const st=p.stats,w=M.w,n=x=>clamp(x,.05,.92);

  const o=M.od?M.od[i]:{o:{shot:'goal',pass:'assist',def:i===3?'foul':'block',pk:'save'}[M.type],st:'sho',b:.4,dir:M.type==='pk'||M.type==='shot'?(i<3?i:null):null};
  const sv=(st[o.st]==null?60:st[o.st])-60;
  if(o.dir!=null&&M.dirK==='gkpen')return n(o.dir===M.lean?.62+sv/200:.07);          // 키커 방향을 맞히면 선방
  if(o.dir!=null&&M.dirK==='pen')return n(o.dir===M.lean?.28:o.b+w[i]*.12+sv/250);    // 골키퍼가 읽은 쪽으로 차면 막힌다
  if(o.dir!=null)return n((o.dir===M.lean?.14:o.b+w[i]*.2)+sv/160);                     // 1대1: 골키퍼가 노리는 쪽
  if(o.o==='foul')return n(o.b);                                                        // 파울: 막을 확률은 높지만 경고·퇴장 위험
  if(o.o==='keep')return n(o.b+w[i]*.2+sv/200);
  return n(o.b+w[i]*.32-.08+sv/165);
}

function reResult(p,m,gf,ga){
  const s=p.season;if(!s)return;
  const was=m.gf>m.ga?'w':m.gf===m.ga?'d':'l',now=gf>ga?'w':gf===ga?'d':'l';
  s[was]--;s[now]++;s.gf+=gf-m.gf;s.ga+=ga-m.ga;
  if(s.tab){const a=s.tab.find(r=>r.ci===p.club),b=s.tab.find(r=>r.ci===m.oi);
    const undo=(r,x,y)=>{r.pl--;r.gf-=x;r.ga-=y;if(x>y){r.w--;r.pts-=3}else if(x===y){r.d--;r.pts--}else r.l--};
    if(a){undo(a,m.gf,m.ga);tabRes(a,gf,ga)}if(b){undo(b,m.ga,m.gf);tabRes(b,ga,gf)}}
  const def=p.pos==='GK'||p.pos==='DF';
  if(m.play&&def){if(m.ga===0&&ga>0)s.cs--;if(m.ga>0&&ga===0)s.cs++}
  if(m.play)s.conc=(s.conc||0)+(ga-m.ga);
  m.gf=gf;m.ga=ga;
}
function resolveMoment(p,i){
  const M=p.moment;if(!M)return;p.moment=null;
  const ok=Math.random()<momentChance(p,M,i),m=M.m,ch=M.opts[i];p.lastMoment={type:M.type,i,ok};
  let gf=m.gf,ga=m.ga,dg=0,da=0,dr0=0,line='';
  const oc=M.od?M.od[i].o:{shot:'goal',pass:i===3?'team':i===2?'goal':'assist',def:i===3?'foul':'block',pk:'save'}[M.type];
  if(oc==='goal'){if(ok){gf++;dg=1;dr0=.8;line=pick(['골망을 갈랐다! ⚽','구석에 꽂혔다! ⚽','골키퍼가 손쓸 수 없었다! ⚽'])}else{dr0=-.25;line=pick(['골키퍼가 막아냈다','골대를 맞고 나왔다','아깝게 빗나갔다','수비 몸에 맞고 굴절됐다'])}}
  else if(oc==='assist'){if(ok){gf++;da=1;dr0=.6;line=pick(['완벽한 패스로 골을 만들었다! 🅰️','동료가 깔끔하게 마무리했다! 🅰️'])}else{dr0=-.25;line=pick(['패스가 끊겼다','동료의 슈팅이 빗나갔다','수비에 막혔다'])}}
  else if(oc==='team'){if(ok){gf++;dr0=.3;line='동료의 골로 이어졌다'}else{dr0=0;line='공격이 무산됐다'}}
  else if(oc==='keep'){if(ok){dr0=.2;line='공을 지켜 냈다 · 흐름을 되찾았다'}else{ga++;dr0=-.4;line='공을 빼앗겨 역습으로 실점…'}}
  else if(oc==='foul'){if(ok){dr0=.5;line='파울로 끊어 냈다';if(Math.random()<.18){p.susp=(p.susp||0)+2;line+=' · 퇴장! 다음 2경기 출장 정지';dr0=-.6}else line+=' · 경고'}else{ga++;dr0=-.45;line='끊지 못했다. 실점…'}}
  else if(oc==='block'){if(ok){dr0=.5;line='완벽하게 막아냈다! 🧱'}else{ga++;dr0=-.45;line='뚫리고 말았다. 실점…'}}
  else{if(ok){dr0=.7;line=pick(['막아냈다! 선방 🧤','슈퍼 세이브! 🧤'])}else{ga++;dr0=-.15;line=pick(['손끝을 스치고 들어갔다. 실점…','반대쪽으로 들어갔다. 실점…'])}}
  if(ok){p.momentOk=(p.momentOk||0)+1;if(oc==='save'&&M.title==='페널티킥 위기')p.pkSaved=(p.pkSaved||0)+1}
  // 성공한 결정적 순간은 화면 연출로 보여 준다
  const sub=`${M.where||(M.kind==='final'?'결승':'빅매치')} ${M.min}분 · ${ch}`;
  if(ok&&gf>m.gf)celebrate(dg?'⚽':'🅰️',dg?'골!!!':da?'완벽한 어시스트!':'동료의 골!',sub,'goal');
  else if(ok&&oc==='save')celebrate('🧤',M.title==='페널티킥 위기'?'페널티킥 선방!':'슈퍼 세이브!',sub,'save');
  else if(ok&&oc==='block')celebrate('🧱','완벽한 수비!',sub,'save');
  if(M.kind==='final'){const res=m;res.gf=gf;res.ga=ga;res.g+=dg;res.a+=da;res.r=Math.round(clamp(res.r+dr0,4,10)*10)/10;
    p.note=`⚡ ${M.title} · ${ch} → ${line}`;finishFinal(p,pendingFinal(p),res);return}
  // 리그 빅매치·대륙대회: 스코어·기록·평점·순위표 반영
  const s=p.season;if(M.kind==='cc')ccFix(p,m,gf,ga);else reResult(p,m,gf,ga);
  if(dg){m.g+=dg;s.goals+=dg}if(da){m.a+=da;s.assists+=da}
  const nr=Math.round(clamp(m.r+dr0,4,10)*10)/10;s.ratingSum+=nr-m.r;m.r=nr;
  if(ok){mor(p,4);if(p.standing!=null)p.standing=clamp(p.standing+4,0,100)}else mor(p,-2);
  p.note=`⚡ ${M.title} (vs ${m.opp}) · ${ch} → ${line} · 최종 ${m.gf}-${m.ga}`;
  addNews(p,`[결정적 순간] ${M.kind==='cc'?m.ccRound+' · ':''}vs ${m.opp} ${M.min}분 · ${line.replace(/[⚽🅰️🧱🧤]/g,'').trim()}`,ok?'good':'bad');
}

  const F=G.fb,body=F.text.trim();F.msg=null;F.err=null;
  if(body.length<2){F.err='내용을 2자 이상 적어 주세요.';return render()}
  if(body.length>1000){F.err='1000자 이하로 적어 주세요.';return render()}
  if(!G.auth){F.err='로그인한 뒤에 보낼 수 있어요. 오른쪽 위 로그인 버튼을 눌러 주세요.';return render()}
  F.busy=true;render();
  try{
    const t=G.auth?await authToken():null,h={apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'};if(t)h.Authorization='Bearer '+t;
    const r=await fetch(`${SUPABASE_URL}/rest/v1/feedback`,{method:'POST',headers:h,body:JSON.stringify({user_id:t?G.auth.uid:null,nickname:G.auth?(G.auth.nick||G.auth.name):null,category:F.cat,body,version:UPDATES[0].d})});
    if(r.status===404)throw new Error('notable');
    if(!r.ok)throw new Error('HTTP '+r.status);
    F.text='';F.msg='고마워요! 피드백이 전달됐어요.';F.mine=null;if(G.auth)fbLoad();
  }catch(e){F.err=e.message==='notable'?'피드백 기능이 아직 준비되지 않았어요. (관리자가 피드백용 SQL을 실행해야 해요)':'보내지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'}
  F.busy=false;render();
}
// 관리자: 마지막으로 확인한 뒤 새로 들어온 피드백 수 (홈 위쪽 배지로 보여 준다)
const FBSEEN='kickoff-life-fbseen';G.fbNew=0;
async function fbCheck(){
  if(!sharedOn()||!G.auth||!isAdmin())return;
  try{const seen=load(FBSEEN,'1970-01-01T00:00:00Z'),r=await rest(`feedback?select=id&created_at=gt.${encodeURIComponent(seen)}&limit=99`)||[];
    if(r.length!==G.fbNew){G.fbNew=r.length;render()}}catch(e){}
}
async function fbLoad(){
  if(!G.auth)return;
  try{
    G.fb.mine=await rest(`feedback?select=id,created_at,category,body&user_id=eq.${G.auth.uid}&order=created_at.desc&limit=20`)||[];
    if(isAdmin()){const all=await rest('feedback?select=id,created_at,user_id,nickname,category,body,version&order=created_at.desc&limit=200')||[];
      // 닉네임이 비어 있는 피드백은 보낸 계정의 닉네임을 찾아 붙인다
      const ids=[...new Set(all.filter(x=>x.user_id&&!x.nickname).map(x=>x.user_id))];
      if(ids.length){try{const ps=await rest(`profiles?select=user_id,nickname&user_id=in.(${ids.join(',')})`)||[];all.forEach(x=>{if(!x.nickname&&x.user_id){const q=ps.find(y=>y.user_id===x.user_id);if(q)x.nickname=q.nickname}})}catch(e){}}
      G.fb.all=all;if(all.length){try{localStorage.setItem(FBSEEN,JSON.stringify(all[0].created_at))}catch(e){}}G.fbNew=0}
  }catch(e){G.fb.mine=G.fb.mine||[]}
  render();
}
async function fbDelete(id){try{await rest(`feedback?id=eq.${id}`,{method:'DELETE',headers:{Prefer:'return=minimal'}})}catch(e){}fbLoad()}
const fbTime=s=>{const d=new Date(s);return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

// 비밀번호 변경 (로그인한 상태에서)
async function changePw(){
  const a=G.acct;a.err=null;a.msg=null;
  if(a.pw.length<6){a.err='새 비밀번호는 6자 이상이어야 해요.';return render()}
  if(a.pw!==a.pw2){a.err='비밀번호 확인이 일치하지 않아요.';return render()}
  a.busy=true;render();
  try{const t=await authToken();const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({password:a.pw})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw j}
    a.msg='비밀번호를 바꿨어요. 다음 로그인부터 새 비밀번호를 쓰세요.';a.mode='me';a.pw='';a.pw2=''}
  catch(e){a.err=/same/i.test((e&&(e.msg||e.message))||'')?'지금 쓰는 비밀번호와 같아요.':'바꾸지 못했어요. 다시 로그인한 뒤 시도해 주세요.'}
  a.busy=false;render();
}

function weekKey(d){d=d||new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear(),w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return `${y}-W${String(w).padStart(2,'0')}`}
function challengeSetup(c){
  const wk=weekKey(),h=hashStr('KL-'+wk),pos=UNLOCK_ORDER[h%4],types=Object.keys(POS[pos].types);
  c.challenge=wk;c.seed=h;c.rerolls=0;c.used=false;c.pos=pos;c.type=types[(h>>>3)%types.length];c.foot='오른발';c.school=-1;c.cands=null;makeCands(c);
}

// 랭킹 기록의 커리어 카드 (예전 기록은 highlights가 그냥 글자라 카드 정보가 적다)
function rankDetail(r){try{const j=JSON.parse(r.highlights);if(j&&j.v===2)return j}catch(e){}return null}
function rankCard(r,i){
  const j=rankDetail(r),d=j&&j.d,gk=r.pos==='GK';
  const per=s=>s.y1===s.y2?`${s.y1}`:`${s.y1} - ${s.y2}`;
  return `<button class="ghost" data-act="rank-back" style="margin-bottom:10px">‹ 랭킹으로</button>
  <section class="panel"><div class="strip"><div class="ovr" style="padding:8px 14px"><div class="v" style="font-size:30px">${esc(r.grade)}</div><div class="k">${r.score}점</div></div>
    <div class="who"><b>${i+1}위 · ${esc(r.name)}</b><span class="muted small">#${r.num} ${esc(DPOS[r.dpos]?DPOS[r.dpos].n:POS[r.pos]?POS[r.pos].name:'')} · ${r.retired_year} 은퇴 (${r.retired_age}세)${j&&j.nick?` · 등록 ${esc(j.nick)}`:''}</span></div></div>
    <div class="statline"><div><b>${r.apps}</b><span>출장</span></div>${gk?`<div><b>${j?j.cs:'-'}</b><span>무실점</span></div><div><b>${d?d.conc:'-'}</b><span>실점</span></div>`:`<div><b>${r.goals}</b><span>골</span></div><div><b>${r.assists}</b><span>도움</span></div>`}<div><b>${d&&d.avg?dr2(d.avg):'-'}</b><span>평균 평점</span></div></div>
    <div class="trsplit"><span>🏆 팀 트로피 <b>${j&&j.tTeam!=null?j.tTeam:'-'}</b></span><span>🏅 개인 수상 <b>${j&&j.tInd!=null?j.tInd:'-'}</b></span><span>🇰🇷 A매치 <b>${r.caps}</b>${j&&r.caps?` · ${j.intlGoals}골`:''}</span></div></section>
  ${d&&d.stints&&d.stints.length?`<section class="panel crl"><div class="crr crh"><span class="cri"></span><span class="crn eyebrow">경력</span>${(gk?['경기','무실점','실점','평점']:['경기','골','도움','평점']).map(c=>`<span class="crc">${c}</span>`).join('')}</div>
    ${d.stints.slice().reverse().map(s=>`<div class="crr"><span class="cri">${s.n==='현역 복무'?'<span class="crmil">🎖️</span>':s.n==='무소속'?'<span class="crmil">🏠</span>':crest(s.ci!=null&&CLUBS[s.ci]?s.ci:null,26)}</span><span class="crn"><b>${esc(s.n)}</b>${s.l?' <span class="muted">(임대)</span>':''}<br><span class="muted small">${per(s)}</span></span><span class="crc num">${s.a||'-'}</span><span class="crc num">${gk?s.cs||0:s.g||0}</span><span class="crc num">${gk?'-':s.as||0}</span><span class="crc num rt">${s.rt?dr(s.rt):'-'}</span></div>`).join('')}</section>`:''}
  ${d&&d.story&&d.story.length?`<section class="panel"><span class="eyebrow">은퇴 후 이야기</span><div class="hlg">${d.story.map(x=>`<div class="hl"><span class="hli">${x.i}</span><span class="small" style="line-height:1.5">${esc(x.t)}</span></div>`).join('')}</div></section>`:''}
  ${d&&d.hl&&d.hl.length?`<section class="panel"><span class="eyebrow">빛났던 순간들</span><div class="hlg">${d.hl.map(x=>`<div class="hl"><span class="hli">${x.i}</span><span><span class="hlk">${esc(x.k)}</span><b>${esc(x.v)}</b><span class="small muted">${esc(x.d)}</span></span></div>`).join('')}</div></section>`
    :`<section class="panel"><p class="small muted">${j&&j.top&&j.top.length?'대표 트로피: '+esc(j.top.join(', ')):r.highlights&&!j?'대표 트로피: '+esc(r.highlights):'예전 버전에서 등록한 기록이라 자세한 커리어 카드가 없어요.'}</p></section>`}`;
}
function hofView(){
  const tab=sharedOn()?G.rank.tab:'mine';
  let h=`<section class="panel"><span class="eyebrow">HALL OF FAME</span><h2 class="sectionh">명예의 전당 · 랭킹</h2>
    ${sharedOn()?`<div class="tabs" style="grid-template-columns:1fr 1fr"><button data-act="rank-tab" data-v="shared" aria-selected="${tab==='shared'}">모두의 랭킹</button><button data-act="rank-tab" data-v="mine" aria-selected="${tab==='mine'}">내 선수들</button></div>`:''}
    <p class="small muted">커리어 평점(100점 만점) 순서입니다. S+ 88점 · S 78 · A 65 · B 50 · C 35</p></section>`;
  if(tab==='shared'){
    const R=G.rank;
    if(R.loading)return h+'<section class="panel"><p class="muted">랭킹을 불러오는 중…</p></section>';
    if(R.err)return h+`<section class="panel"><div class="warn small">${esc(R.err)}</div><button class="btn alt" data-act="rank-reload">다시 불러오기</button></section>`;
    if(!R.rows)return h+'<section class="panel"><p class="muted">랭킹을 불러오는 중…</p></section>';
    if(!R.rows.length)return h+'<section class="panel"><p class="muted">아직 등록된 선수가 없어요. 은퇴 화면이나 "내 선수들" 탭에서 첫 기록을 올려 보세요.</p></section>';
    // 랭킹 카드 하나 자세히 보기
    if(R.view!=null&&R.rows[R.view])return h+rankCard(R.rows[R.view],R.view);
    return h+`<section class="panel"><span class="eyebrow">TOP 10</span><div class="list">${R.rows.slice(0,10).map((r,i)=>{const j=rankDetail(r);return `<div class="li" data-act="rank-view" data-v="${i}" role="button" style="cursor:pointer"><span style="display:flex;gap:10px;align-items:center;min-width:0">

        <div class="who"><b>${GRADE_TXT[f.grade]}</b><span class="muted small">커리어 평점 ${f.score}점</span></div></div>

        <div class="trsplit"><span>🏆 팀 트로피 <b>${p.trophies.filter(t=>t.k!=='indiv').length}</b></span><span>🏅 개인 수상 <b>${p.trophies.filter(t=>t.k==='indiv').length}</b></span><span>🇰🇷 A매치 <b>${p.caps}</b>${p.caps?` · ${p.intlGoals}골`:''}</span></div>

        ${f.chal?`<section class="panel"><span class="eyebrow">🗓️ 주간 챌린지 ${f.chal}</span><p class="small">이번 챌린지 점수 <b>${f.score}점</b> · 내 이번 주 최고 ${G.chal[f.chal]}점. 친구 화면의 챌린지 순위에 올라가요.</p></section>`:''}
        <section class="panel">

        ${h?shareBtn(h):''}<button class="ghost" data-act="hof">명예의 전당 보기</button></section>`})():''}`;
  }

// 오퍼는 한 줄 요약 + 버튼만 보이는 작은 카드
function offerCard(p,o,i,act){

  if(o.kind==='univ')return card('진학','대학 진학','U리그에서 최대 4년 더 성장',b('대학으로','alt'));

  if(o.kind==='sangmu'){const el=o.elig||{ok:true},ch=el.ok?oddWord(sangmuChance(p)):'';return card(`병역 · ${o.forced?'입대 기한':'조기 입대'}`,'김천 상무 지원',el.ok?`18개월 K리그1에서 뛰며 복무하고, 전역하면 원소속팀으로 돌아갑니다.<br>지원 자격 충족 · 서류·체력 테스트를 거쳐 합격 가능성 <b>${ch}</b>${o.blocked?` · <b style="color:var(--red)">${esc(o.why)}</b>`:''}`:`<b style="color:var(--red)">지원 불가 · ${esc(el.why)}</b><br><span class="muted">자격: 입대 시 만 27세 이하 · K리그 소속 · 직전 시즌 10경기 이상 출전 · 징계 없음</span>`,b(!el.ok?'자격 미달':o.blocked?'불합격':'지원','',!el.ok||o.blocked),!el.ok||o.blocked?'blocked':'')}
  if(o.kind==='raise')return card('현 소속팀','재계약 협상 (주급 인상)',o.done||o.blocked?`<b style="color:${o.done?'var(--pitch)':'var(--red)'}">${esc(o.why)}</b>`:`지금 ${wageTxt(p.contract.salary)} · 계약 ${p.contract.years}년 남음. 활약을 근거로 주급을 올린 새 계약을 요구합니다(${p.age<=23?'4~5년':p.age<=29?'2~5년':'1~3년'}). 거절당하면 사기가 떨어져요.`,b(o.done?'완료':o.blocked?'거절됨':'요청하기','alt',o.blocked),o.blocked&&!o.done?'blocked':'');
  if(o.kind==='army')return card(`병역 · ${o.forced?'입대 기한':'조기 입대'}`,'현역 입대','2시즌 공백 · 체력 소폭↑ · 기술 소폭↓',b('입대','alt'));
  if(o.kind==='loan'){const r=roleFor(p,o.club,false);return card(esc(o.label),esc(CLUBS[o.club].name),`${LG[CLUBS[o.club].lg].name} · ${tierLabel(o.club,false)} ${clubStatusTxt(p,o.club)}<br><span class="chip ${r==='주전'?'good':r==='벤치'?'bad':''}">예상 ${r}</span> ${r==='벤치'?'임대 가서도 출전이 어려울 수 있어요':r==='주전'?'꾸준히 뛸 수 있어요':'경쟁하며 기회를 노려요'} · 시즌 뒤 복귀`,b('임대 간다',r==='벤치'?'alt':''),'',o.club)}
  if(o.kind==='loanreq')return card('임대','임대 요청',o.blocked?`<b style="color:${o.done?'var(--pitch)':'var(--red)'}">${esc(o.why)}</b>`:'출전 기회를 찾아 한 시즌 임대를 요청해요. 주전일수록 구단이 잘 안 보내줍니다.',b(o.done?'수락됨':o.blocked?'거절됨':'요청하기','alt',o.blocked),o.blocked&&!o.done?'blocked':'');
  if(o.kind==='refuse')return card('거부','매각 거부하고 버티기',o.money?'구단과 관계가 틀어짐':'이번 시즌 1군 훈련 제외',b('버틴다','danger'));
  const l=leagueOf(o.club,o.u21),same=o.club===p.club;

  const canNego=!o.blocked&&!o.nego&&o.label!=='1군 승격';

  return card(esc(o.label)+(prestige(o.club)&&!o.u21?` · ${prestige(o.club)}`:''),esc(teamName(o.club,o.u21)),desc,b(btn,'',o.blocked)+(canNego?`<button class="sbtn alt" data-act="nego-open" data-v="${act}:${i}">주급 협상</button>`:'')+(o.negoOpen&&canNego?`<div class="nego">${NEGO.map((N,k)=>`<button class="sbtn alt" data-act="nego" data-v="${act}:${i}:${k}"><b>${N.n}</b><span>성공 ${oddWord(negoOdds(p,o,k))}<br>${N.risk?(N.risk>=1?'실패 시 철회':'철회 위험'):'실패해도 안전'}</span></button>`).join('')}</div>`:''),o.blocked?'blocked':'',o.club);
}
function newsHtml(news){
  return `<div class="lnews-wrap">${news.slice().sort((a,b)=>(b.mine?1:0)-(a.mine?1:0)).map(n=>{
    if(typeof n==='string')return `<p class="small">${esc(n)}</p>`;
    const team=ci=>`<span class="tname">${crest(ci,14)}${esc(CLUBS[ci].name)}${ci===n.po?' <span class="muted small">PO</span>':''}</span>`;
