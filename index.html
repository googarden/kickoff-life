<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>킥오프 라이프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-width column like a matchday programme — app bar, player strip, tabbed cards stacked below */
:root{
  --bg:#e8ebe4; --surface:#ffffff; --surface-2:#f3f5f0; --ink:#14213d; --muted:#5b6678; --line:#d4d9cf;
  --pitch:#1e7a4c; --pitch-soft:#dcefe3; --card:#f0bd2b; --card-ink:#2a2000; --red:#c23b2c; --red-soft:#f8e1dd;
  --btn:#14213d; --btn-fg:#ffffff;
  --f-display:'Black Han Sans','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Saira Condensed','Arial Narrow',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#161e31; --surface-2:#1c2640; --ink:#e6eaf2; --muted:#97a3b8; --line:#2a3550;
  --pitch:#4cc28a; --pitch-soft:#173a2b; --card:#f0bd2b; --card-ink:#2a2000; --red:#f07261; --red-soft:#3d1d1a;
  --btn:#f0bd2b; --btn-fg:#1a1500; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#161e31; --surface-2:#1c2640; --ink:#e6eaf2; --muted:#97a3b8; --line:#2a3550;
  --pitch:#4cc28a; --pitch-soft:#173a2b; --card:#f0bd2b; --card-ink:#2a2000; --red:#f07261; --red-soft:#3d1d1a;
  --btn:#f0bd2b; --btn-fg:#1a1500; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 40px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--card);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 8px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo .mark{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:15px}
.logo b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.logo small{display:block;font-family:var(--f-num);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}

/* blocks */
.panel{background:var(--surface);border:1px solid transparent;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--ink);color:var(--bg);border:0;padding:22px 18px;gap:14px}
.hero .eyebrow{color:var(--card)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.2}
.hero p{opacity:.85}
.btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-radius:10px;padding:13px 16px;background:var(--btn);color:var(--btn-fg);font-weight:700;text-align:left}
.hero .btn{background:var(--card);color:var(--card-ink)}
.btn.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .arr{font-family:var(--f-num);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--f-num);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted)}

/* form */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* player strip & card */
.strip{display:flex;align-items:center;gap:12px}
.jersey{width:54px;height:58px;flex:none;border-radius:10px 10px 14px 14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:28px;position:relative}
.jersey::before{content:"";position:absolute;top:0;left:50%;width:16px;height:7px;transform:translateX(-50%);border-radius:0 0 8px 8px;background:var(--surface)}
.strip .who{flex:1;min-width:0}
.strip .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovr{flex:none;background:var(--card);color:var(--card-ink);border-radius:10px;padding:4px 10px;text-align:center;line-height:1}
.ovr .v{font-family:var(--f-num);font-weight:800;font-size:28px}
.ovr .k{font-family:var(--f-num);font-size:11px;letter-spacing:.1em;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--pitch-soft);color:var(--pitch);border-color:transparent}
.chip.bad{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.gold{background:var(--card);color:var(--card-ink);border-color:transparent}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:8px;padding:8px 0;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}

/* stats */
.stat{display:grid;grid-template-columns:minmax(62px,max-content) 1fr 34px;align-items:center;gap:10px;font-size:14px}
.stat .track{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.stat .fill{height:100%;background:var(--muted);border-radius:99px}
.stat .fill.hi{background:var(--pitch)}
.stat .fill.mid{background:var(--ink)}
.stat .n{text-align:right;font-family:var(--f-num);font-weight:700;font-size:17px;white-space:nowrap}
.guide summary b{font-size:16px}
.guide ul{margin:8px 0 0;padding-left:18px;display:grid;gap:8px}
.guide li{font-size:14px;line-height:1.55}
.gtip{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--card);background:color-mix(in srgb,var(--card) 14%,var(--surface))}
.aform{display:grid;gap:6px;margin:12px 0}
.alab{font-size:13px;font-weight:700;margin-top:6px}
.alab .muted{font-weight:400}
.ainp{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:16px}
.rcode{font-size:24px;font-weight:800;letter-spacing:2px;text-align:center;padding:16px;margin:12px 0;border:2px dashed var(--card);border-radius:12px;background:color-mix(in srgb,var(--card) 12%,var(--surface));user-select:all}
.acct{padding-top:10px;padding-bottom:10px}
.bar-r{display:flex;gap:6px;align-items:center;min-width:0}
.tdet summary{cursor:pointer;color:var(--muted);padding:4px 0}
.tlg{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.tli{display:grid;grid-template-columns:40px 1fr;gap:6px;font-size:12.5px;padding:2px 0;border-bottom:1px dashed var(--line)}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);z-index:120;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.tcab{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.tcr{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.tci{font-size:20px;text-align:center}
.tcn{display:flex;flex-direction:column;min-width:0;font-size:13px}
.tcc{font-family:var(--f-num);font-weight:800;font-size:15px;color:var(--pitch)}
/* 레전드 상점 */
.lpbal{display:flex;align-items:baseline;gap:6px;font-size:13px}.lpbal b{font-family:var(--f-num);font-size:32px;color:var(--card-ink);background:var(--card);padding:0 10px;border-radius:8px}
.shop-i{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shop-ic{font-size:24px;text-align:center}.shop-t{display:flex;flex-direction:column;min-width:0}
.fprev{display:inline-block;width:26px;height:32px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.dlov .dlbox{animation:dlShake .5s ease-out}
@keyframes dlShake{0%{transform:scale(.7) rotate(-3deg);opacity:0}60%{transform:scale(1.04) rotate(1deg);opacity:1}80%{transform:rotate(-1deg)}100%{transform:none}}
.dlclub{display:flex;align-items:center;gap:10px;margin:6px 0}.dlclub>span{display:flex;flex-direction:column}
.dlterms{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;margin:4px 0 8px}
.dlbox .grid2 .btn{font-size:13px;justify-content:center}
.ntbox{display:flex;flex-direction:column;gap:4px}
.ntgift{padding:8px 10px;border-radius:9px;background:var(--card);color:var(--card-ink);font-size:13px;text-align:center}
.promo{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:10px;background:var(--pitch-soft);color:var(--ink);margin-bottom:2px}
.promo span{flex:1;min-width:0}.promo .linkb{font-size:12px;font-weight:700;white-space:nowrap}.promo .promo-x{color:var(--muted);font-weight:400}
.footline{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:8px 0 2px;font-size:12px}
.footline .linkb{font-size:12px}
.useb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.useb .sbtn,.cand .sbtn{white-space:nowrap;flex:none;width:auto;writing-mode:horizontal-tb}
.traitpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.potg{display:flex;align-items:center;gap:8px}
.pg{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:8px;font-family:var(--f-num);font-weight:900;font-size:17px;color:#fff;background:#6b7280}
.pg-S{background:linear-gradient(135deg,#f59e0b,#ef4444)}.pg-A{background:#7c3aed}.pg-B{background:#2563eb}.pg-C{background:#16a34a}
/* 카드 테두리 스킨 */
.frame-gold{border:2px solid #e3b23c!important;box-shadow:0 0 0 3px rgba(227,178,60,.22)}
.frame-club{border:3px solid var(--fc,#888)!important}
.frame-fire{border:2px solid #ff6a00!important;animation:fireGlow 1.6s ease-in-out infinite}
@keyframes fireGlow{0%,100%{box-shadow:0 0 6px rgba(255,106,0,.45)}50%{box-shadow:0 0 18px rgba(255,170,0,.85)}}
.frame-holo{border:2px solid transparent!important;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,#7df9ff,#c084fc,#f472b6,#facc15,#7df9ff) border-box!important;background-size:100% 100%,300% 300%!important;animation:holo 4s linear infinite}
@keyframes holo{to{background-position:0 0,300% 0}}
.frame-pink{border:2px solid #f472b6!important;box-shadow:0 0 0 3px rgba(244,114,182,.22),0 0 12px rgba(244,114,182,.35)}
.frame-diamond{border:2px solid #8fe3ff!important;box-shadow:0 0 14px rgba(143,227,255,.7),inset 0 0 10px rgba(143,227,255,.25)}
/* 골·선방 연출 변형 */
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flashb 1.6s ease-out 3}
@keyframes flashb{0%{opacity:.85}25%{opacity:0}45%{opacity:.5}70%{opacity:0}100%{opacity:0}}
.cerp i.bst{position:absolute;font-size:26px;animation:bstOut 1.4s ease-out infinite}
@keyframes bstOut{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1);opacity:0}}
/* 은퇴식 연출 */
.cerp{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cerp i{position:absolute;font-style:normal;font-size:22px}
.cerp.fall i{top:-30px;animation:achfall linear infinite}
.cerp.rise i{bottom:-40px;animation:riseUp linear infinite}
@keyframes riseUp{0%{transform:translateY(0)}100%{transform:translateY(-115vh)}}
.fw{position:absolute;width:5px;height:5px;border-radius:50%;animation:fwb 1.8s ease-out infinite}
@keyframes fwb{0%{transform:scale(.05);opacity:1}75%{opacity:1}100%{transform:scale(1);opacity:0}}
.cerjersey{display:inline-flex;width:84px;height:96px;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);font-family:var(--f-num);font-size:46px;font-weight:900;border-radius:16px 16px 10px 10px;animation:jUp 2.2s ease-out both;box-shadow:0 0 30px rgba(242,193,78,.6)}
@keyframes jUp{0%{transform:translateY(90px) scale(.5);opacity:0}60%{transform:translateY(-12px) scale(1.08);opacity:1}100%{transform:none}}.rolepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px}
.rp{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);text-align:left;font-size:12px}
.rp b{font-size:12.5px}.rp .num{font-family:var(--f-num);font-weight:800;font-size:15px}
.rp.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.rp.on .rst{color:#f2c14e}
.rst{color:#d4a017;font-size:11px;letter-spacing:1px}
.list .li .ghost{white-space:nowrap;flex:none}
.train button.rec{box-shadow:inset 0 0 0 2px #f2c14e}
.rec-dot{display:inline-block;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:5px;box-shadow:inset 0 0 0 2px #f2c14e}
.milplan{display:block;margin-top:4px}
.milplan .mpl{margin-top:4px}
.milplan summary{cursor:pointer;list-style:none;padding:2px 0}
.milplan summary::-webkit-details-marker{display:none}
.milplan[open] summary{margin-bottom:4px}
.mpl{display:flex;flex-direction:column;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.mctx{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);align-self:flex-start}
.fbbadge{display:inline-flex;align-items:center;gap:3px;border:0;border-radius:999px;padding:4px 9px;background:var(--red);color:#fff;font-size:12px;font-weight:700;animation:fxpulse 1.4s ease-in-out infinite}
.acctb{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frq{display:flex;gap:8px;margin-top:10px}
.frq .ainp{flex:1}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px;margin:8px 0 10px}
.vsrow>div{display:flex;flex-direction:column;gap:2px}
.vsrow .num{font-size:30px;font-weight:800}
.vs{font-weight:800;color:var(--muted)}
.seg button.locked{opacity:.55;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.seg button.locked .small{font-size:10.5px;font-weight:500}
.crl{padding-top:8px}
.crr{display:grid;grid-template-columns:30px 1fr 32px 30px 30px 34px;align-items:center;gap:6px;padding:11px 0;border-bottom:1px solid var(--line)}
.crc.rt{color:var(--pitch)}
.crr:last-child{border-bottom:0}
.crh{padding:6px 0;border-bottom:1px solid var(--line)}
.crh .crc{font-size:12px;color:var(--muted);font-weight:700}
.cri{display:flex;justify-content:center}
.crmil{font-size:22px}
.crn{min-width:0;line-height:1.35}
.crn b{font-size:15px}
.crc{text-align:center;font-size:15px;font-weight:700}
.chip.mv em{font-style:normal;margin-left:2px}
.chip.mv em.up,.orow .up{color:var(--pitch)}
.chip.mv em.down,.orow .down{color:var(--red)}
.hlg{display:grid;gap:10px;margin-top:8px}
.hl{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.hl>span:last-child{display:flex;flex-direction:column;min-width:0}
.hli{font-size:24px;display:flex;justify-content:center}
.hlk{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted)}
.hl b{font-size:17px;line-height:1.3}
.sgrade{flex:none;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:800;font-size:24px;background:var(--surface-2);border:1px solid var(--line)}
.sgrade.gSp,.sgrade.gS{background:var(--card);color:var(--card-ink);border-color:transparent}
.sgrade.gA{background:var(--pitch);color:#fff;border-color:transparent}
.hl.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--surface))}
.fblink{display:block;margin:4px auto 0;font-size:14px}
textarea.ainp{resize:vertical;min-height:110px;font-family:inherit;line-height:1.5}
.fbi{align-items:flex-start}
/* 팀 색 배경과 분위기 효과 */
body.teamed{background:linear-gradient(180deg,color-mix(in srgb,var(--team) 22%,var(--bg)) 0,color-mix(in srgb,var(--team) 8%,var(--bg)) 300px,color-mix(in srgb,var(--team) 4%,var(--bg)) 100%) fixed,var(--bg)}
body.teamed .bar{background:color-mix(in srgb,var(--team) 22%,var(--bg))}
body.onfire{background:linear-gradient(180deg,color-mix(in srgb,#ff7a1a 34%,var(--bg)) 0,color-mix(in srgb,var(--team) 12%,var(--bg)) 300px,var(--bg) 600px) no-repeat,var(--bg)}
body.onfire .bar{background:color-mix(in srgb,#ff7a1a 34%,var(--bg))}
body.onfire::before{content:'';position:fixed;left:0;right:0;top:0;height:6px;z-index:6;background:linear-gradient(90deg,#ff3d00,#ffb300,#ff3d00);background-size:200% 100%;animation:fireline 1.2s linear infinite}
body.cold{background:linear-gradient(180deg,color-mix(in srgb,#4a90d9 26%,var(--bg)) 0,var(--bg) 420px) no-repeat,var(--bg)}
body.cold .bar{background:color-mix(in srgb,#4a90d9 26%,var(--bg))}
body.gloom{background:linear-gradient(180deg,color-mix(in srgb,#555 30%,var(--bg)) 0,var(--bg) 480px) no-repeat,var(--bg)}
body.gloom .bar{background:color-mix(in srgb,#555 30%,var(--bg))}
body.glory{background:linear-gradient(180deg,color-mix(in srgb,#f2c14e 40%,var(--bg)) 0,var(--bg) 480px) no-repeat,var(--bg)}
body.glory .bar{background:color-mix(in srgb,#f2c14e 40%,var(--bg))}
.streak{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:4px;letter-spacing:0}
.streak.hot{background:#ff7a1a;color:#fff;display:inline-block;animation:flicker 1s ease-in-out infinite}
.streak.icy{background:#4a90d9;color:#fff}
@keyframes flicker{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.25)}}
@keyframes fireline{from{background-position:0 0}to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){.streak.hot,body.onfire::before{animation:none}}

const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}

const qualOf=(lg,rank)=>{const q=QUAL[lg];if(!q||!rank)return null;for(const [r,c] of q)if(rank<=r)return c;return null};
// 새 커리어 처음에는 전력 순서로 출전팀을 정해 둔다
function defaultComps(){
  CLUBS.forEach(c=>{c.comp=null;c.lastRank=null});
  Object.keys(LG).forEach(lg=>{if(LG[lg].am)return;const ids=clubsIn(lg).sort((a,b)=>CLUBS[b].str-CLUBS[a].str);ids.forEach((ci,i)=>{CLUBS[ci].lastRank=i+1;CLUBS[ci].comp=qualOf(lg,i+1)})});
}
const compChip=ci=>{const c=CLUBS[ci]&&CLUBS[ci].comp;return c?`<span class="cchip ${COMP[c].c}">${COMP[c].s}</span>`:''};
// 오퍼 카드용: 대륙대회 + 순위 (같은 리그면 지금 순위, 아니면 지난 시즌 순위)
function clubStatusTxt(p,ci){
  const s=p.season,live=s&&s.tab&&p.phase==='round'&&s.tabLg===CLUBS[ci].lg&&!s.tabU21?sortTab(s.tab,s.split).findIndex(r=>r.ci===ci)+1:0;
  const rk=live?`현재 ${live}위`:CLUBS[ci].lastRank?`지난 시즌 ${CLUBS[ci].lastRank}위`:'';
  return `${compChip(ci)}${rk?`<span class="small muted"> ${rk}</span>`:''}`;
}

   50↑ 평점 하락 · 65↑ 적극 어필 불가 · 75↑ 교체 출전만 · 88↑ 번아웃(4경기 강제 휴식)
   적극 어필을 연속으로 고르면 '강행군'이 붙어 피로가 더 빨리 쌓인다 */
const FAT_SUB=75,FAT_REST=88,FAT_NOPUSH=70,REST_GAMES=4;
// 피로 효과: 노랑(50~69)은 경기력이 살짝 무뎌지고 가끔 '몸이 무거운 날'이 온다 · 빨강(70+)은 모든 능력치가 일시적으로 떨어진다
const fatiguePenalty=f=>f<50?0:Math.min(.2,(f-50)*.01);
const fatStatMod=f=>f>=FAT_NOPUSH?-Math.min(5,Math.round((f-62)/4)):0;
let fatPerf=f=>fatiguePenalty(f)-fatStatMod(f)/9+(f>=50&&f<FAT_NOPUSH&&Math.random()<.2?.35:0);
// 나이가 들수록 피로가 빨리 쌓이고 늦게 풀린다: 33세부터 조금 · 35세부터 확실히 · 40세부터는 해마다 훅훅
// 지구력: 높으면 경기마다 쌓이는 피로가 줄고, 낮으면 늘어난다 (60 기준 · 골키퍼 제외)
// 골키퍼는 뛰는 거리가 짧아 피로가 30% 덜 쌓이고, 나이에 따른 피로·회복 구간도 2살 늦게 온다
const staFat=p=>!p?1:p.pos==='GK'?.7:clamp(1-((p.stats.sta||60)-60)*.004,.85,1.12);
const fAge=p=>p.age-(p.pos==='GK'?2:0);
const ageFat=p=>{if(!p)return 1;const a=fAge(p);return a>=40?1.35+(a-40)*.1:a>=35?1.2:a>=33?1.08:1},ageRec=p=>{if(!p)return 1;const a=fAge(p);return a>=40?Math.max(.5,.75-(a-40)*.05):a>=35?.85:a>=33?.93:1};
const matchRecovery=f=>1+f*.04;   // 평소대로 선발을 계속 뛰면 피로가 60 안팎까지 차오른다: 결국 쉬어 줘야 한다
const pushMult=st=>Math.min(1.5,1+.15*(st||0));
function fatigueState(f,restLeft){
  if(restLeft>0)return {t:'번아웃',c:'var(--red)',d:`강제 휴식 · 앞으로 ${restLeft}경기 출전 불가`};
  if(f>=FAT_SUB)return {t:'과부하',c:'var(--red)',d:`교체 출전만 · 모든 능력치 일시적으로 ${fatStatMod(f)} · 부상 위험 매우 높음`};
  if(f>=FAT_NOPUSH)return {t:'지침',c:'var(--red)',d:`모든 능력치 일시적으로 ${fatStatMod(f)} · 적극 어필 불가 · 부상 위험 높음`};
  if(f>=50)return {t:'피곤',c:'var(--card)',d:'가끔 몸이 무거운 날이 와요 · 부상 위험 증가'};
  return {t:'좋음',c:'var(--pitch)',d:'경기력에 영향 없음'};
}
// 4경기를 모두 뛰었을 때의 예상 피로
function fatigueAfter(f,ap,streak,p){
  const per=(ap.rest?ap.fat*.25-8*.75:ap.fat*ageFat(p)*staFat(p)*(hasStaff(p,'nu')?.9:1))*(ap===APPR.attack?pushMult(streak):1);
  let x=f;for(let i=0;i<PER;i++){x=Math.max(0,x+(x>=FAT_SUB&&!ap.rest?per*.5:per));x=Math.max(0,x-matchRecovery(x)*ageRec(p));if(x>=FAT_REST)break}
  return Math.round(x);
}

// 구단이 이적을 막은 이유: 상황에 맞는 이유 중 하나를 고른다
function blockReason(p,of){

  if(of.fee&&(of.feeRatio||1)<1.15)r.push(`${iga(dest)} 이적료를 더 올리지 않아 협상이 멈췄습니다.`);

  if(of.winter)r.push('시즌 도중이라 전력 공백을 감당할 수 없다며 거절했습니다.');

// 이적시장 마감일 깜짝 오퍼: 드물게 한 단계 위 구단이 막판에 웃돈을 들고 뛰어든다

// 이적 시도: 구단이 막으면 false

    if(p.strike||p.struck){p.strike=false;p.struck=false;p.reqd=false;p.note=`태업 종료 · ${teamName(p.club,p.u21)}에서 새 출발합니다.`}}

// 주급 협상: 요구 폭이 클수록 성공 확률이 낮고, 실패하면 구단이 오퍼를 거둬들일 수 있다

  if(!s.alert&&!p.fa&&!(p.injury>0)&&!p.rehab){const k=chainDue(p);if(k!=null){p.event=k;s.evCount=(s.evCount||0)+1;s.usedEv=s.usedEv||[];s.usedEv.push(EVENTS[k].t);return}}
  if(!s.alert&&(s.evCount||0)<5&&Math.random()<.3*res.length/PER){p.event=pickEvent(p);if(p.event!=null)s.evCount=(s.evCount||0)+1}
}// 성적이 바닥이면 시즌 중 감독이 경질되고, 새 감독은 성향(선호 포지션·나이대)이 달라 입지가 다시 정해진다
function autoSack(p){
  const s=p.season;if(p.stage!=='pro'||p.u21||!s||!s.tab||s.sacked||s.mi<6)return;
  const rk=myRank(p),N=s.tab.length,bad=(s.ls||0)>=5||(s.mi>=s.games*.45&&rk>=N-2&&Math.random()<.18);
  if(!bad)return;s.sacked=true;
  const old=p.mgr&&STYLES[p.mgr.style]?p.mgr.name:'감독';p.mgr=newManager(p.club);const st=STYLES[p.mgr.style];
  addNews(p,`[속보] 성적 부진에 ${old} 경질 · 새 감독 ${p.mgr.name} (${st.n})`,'bad');
  // 새 감독은 처음부터 다시 본다: 성향에 맞으면 기회, 안 맞으면 경쟁
  const fit=styleFit(p);if(p.standing!=null)p.standing=clamp(p.standing*.6+(ROLE_BASE[roleFor(p,p.club,p.u21)]||50)*.4+fit*3,0,100);
  p.note=(p.note?p.note+' / ':'')+`감독 교체 · ${p.mgr.name} (${st.n})${fit>0?' · 내 스타일을 좋아하는 감독이다':fit<0?' · 나와 성향이 맞지 않는 감독이다':''}`;
}// 같은 이벤트가 반복되지 않게: 이번 시즌에 나온 것과 최근 6개는 제외
function pickEvent(p){
  if(p.fa||p.injury>0||p.rehab)return null;   // 무소속이거나 부상·재활 중에는 이벤트가 없다
  const s=p.season;s.usedEv=s.usedEv||[];p.evHist=p.evHist||[];
  const recent=p.evHist.slice(-6);
  const ok=EVENTS.map((e,i)=>i).filter(i=>!EVENTS[i].chain&&(!EVENTS[i].c||EVENTS[i].c(p))&&!s.usedEv.includes(EVENTS[i].t)&&!recent.includes(EVENTS[i].t));
  if(!ok.length)return null;
  // 능력치·출전·이적에 영향이 작은 이벤트(광고, 사인회 등)는 드물게 나온다
  let tot=ok.reduce((a,i)=>a+(EVENTS[i].w||1),0),r=Math.random()*tot,i=ok[0];for(const k of ok){r-=EVENTS[k].w||1;if(r<=0){i=k;break}}
  s.usedEv.push(EVENTS[i].t);p.evHist.push(EVENTS[i].t);p.evHist=p.evHist.slice(-12);
  return i;
}
// 라운드 결과에 따라 사기가 움직인다: 활약, 출전 시간, 팀 성적
function roundMorale(p,res){
  const played=res.filter(m=>m.play),w=res.filter(m=>m.gf>m.ga).length,l=res.filter(m=>m.gf<m.ga).length;
  // 사기는 천천히 움직인다: 나쁜 일은 덜 아프게, 시간이 지나면 평소(60) 쪽으로 돌아온다
  let d=(w-l)*.8;
  if(played.length){const avg=played.reduce((a,m)=>a+m.r,0)/played.length,x=avg-6.5;d+=x>0?x*2.4:x*1.8}
  else if(!res.some(m=>m.out||m.susp||m.forced||m.strike))d-=p.role==='벤치'?1.5:3;   // 못 뛰면 불만이 조금씩 쌓인다
  d+=(60-p.morale)*.12;
  if(p.captain)d+=1;
  p.morale=clamp(Math.round(p.morale+clamp(d,-5,7)),0,100);
  if(p.morale<25&&p.stage==='pro')p.wantsOut=true;
}
const PER=4;   // 한 번에 진행하는 경기 수
const roundsOf=s=>Math.ceil(s.games/PER);
// 시즌 중 이적·임대: 그때까지의 기록을 떼어 두었다가 시즌 기록에서 원소속팀 몫으로 나눈다
function preSnap(p){const s=p.season;if(!s||s.pre)return;
  s.pre={ci:p.fa?null:p.club,u21:!!p.u21,loan:!!p.loan,fa:!!p.fa,lg:p.fa?null:curLg(p).name,name:p.fa?'무소속':teamName(p.club,p.u21),apps:s.apps,subs:s.subs||0,goals:s.goals,assists:s.assists,cs:s.cs,conc:s.conc||0,kp:s.kp||0,ds:s.ds||0,dk:s.dk||0,sot:s.sot||0,saves:s.saves||0,rs:s.ratingSum}}
function winterMove(p,i){
  const of=p.winter&&p.winter[i];if(!of){p.winter=null;return}const from=p.fa?'무소속':teamName(p.club,p.u21);
  if(of.kind==='loan'){p.note=doLoan(p,of,true);p.winter=null;return}
  if(of.pre){p.precontract={...of,pre:false,label:'사전 계약 이행',block:0};p.winter=null;p.wantsOut=false;p.note=`보스만 사전 계약 · 시즌이 끝나면 ${teamName(of.club,of.u21)}에 자유 이적으로 합류합니다(${wageTxt(of.salary)}, ${of.years}년).`;return}
  const snapAt=p.season&&!p.season.pre?(preSnap(p),true):false;
  if(!tryMove(p,of)){if(snapAt)delete p.season.pre;return}
  if(!p.season.from)p.season.from=from;
  p.note=`겨울 이적시장 · ${from} → ${teamName(p.club,p.u21)} 이적 완료 (${wageTxt(of.salary)}, ${of.years}년)`;
  p.winter=null;
}

const CHAIN={'열애설 보도|0':['열애설 그 후',.6,[2,4]],'열애설 보도|1':['파파라치 후속 보도',.45,[2,4]],'라이벌의 도발|0':['도발 그 후: 맞대결',.8,[1,3]],

  '해외 이적설|0':['유럽 스카우트 재방문',.6,[3,6]],'개인 트레이너|0':['트레이너 재계약',.7,'next']};
function chainPush(p,e,v){const c=CHAIN[e.t+'|'+v];if(!c||Math.random()>=c[1])return;const s=p.season;
  p.chainQ=(p.chainQ||[]).filter(x=>x.t!==c[0]);p.chainQ.push(c[2]==='next'?{t:c[0],y:p.year+1,r:1}:{t:c[0],y:p.year,r:(s?s.round:0)+ri(c[2][0],c[2][1])})}
function chainDue(p){const s=p.season;if(!p.chainQ||!p.chainQ.length||!s)return null;
  p.chainQ=p.chainQ.filter(x=>x.y>=p.year-1);
  const i=p.chainQ.findIndex(x=>x.y<p.year||(x.y===p.year&&s.round>=x.r));if(i<0)return null;
  const x=p.chainQ.splice(i,1)[0],k=EVENTS.findIndex(e=>e.t===x.t&&e.chain);if(k<0)return null;return !EVENTS[k].c||EVENTS[k].c(p)?k:null}
const evDesc=(e,p)=>typeof e.d==='function'?e.d(p):e.d;

function weakStat(p){const w=DPOS[dposOf(p)].w;return STATS.filter(k=>w[k]>=.1).sort((a,b)=>p.stats[a]-p.stats[b])[0]||STATS[0]}

/* ---------- promotion & relegation ---------- */
// 리그 순위표를 만든다. 목록에 없는 팀은 이름 없는 팀으로 채우고, 내 팀은 실제 순위에 넣는다
function simTable(lg,fixed,order){
  if(order&&fixed)return order.map((ci,i)=>({ci,rank:i+1}));   // 내 리그는 실제 순위표 그대로
  const N=LG[lg].teams,ids=clubsIn(lg).filter(i=>!fixed||i!==fixed.ci);
  const e=ids.map(i=>({ci:i,s:CLUBS[i].str+gauss()*2.2}));
  for(let k=e.length+(fixed?1:0);k<N;k++)e.push({ci:null,s:-1+gauss()*1.8});
  e.sort((a,b)=>b.s-a.s);
  if(fixed)e.splice(clamp(fixed.rank,1,N)-1,0,{ci:fixed.ci});
  return e.map((x,i)=>({ci:x.ci,rank:i+1}));
}
// 리그를 옮기면 절대 전력은 유지하고 새 리그 기준으로 다시 계산한다
// 리그를 옮기면 절대 전력은 유지하되, 승격팀은 1부 적응에 애를 먹고(전력 -2) 강등팀은 2부에서 강팀이 된다
function moveClub(ci,to,drop){const c=CLUBS[ci],abs=LG[c.lg].lv+c.str;c.lg=to;c.str=clamp(abs-LG[to].lv+(drop?0:-2),-7,8)}
/* 승강 규칙: 1부 최하위 3팀 강등 · 2부 1·2위 자동 승격 · 2부 3~6위 플레이오프(준결승 3위-6위, 4위-5위 → 결승) 우승팀 승격 */
const poName=(x,lg)=>x.ci!=null?CLUBS[x.ci].name:`${LG[lg].name} ${x.rank}위 팀`;
function poMatch(p,x,y,lg){
  const me=p.stage==='pro'&&!p.u21?p.club:null,lv=e=>e.ci!=null?teamLv(e.ci,false):LG[lg].lv-1+gauss()*1.5;
  const mine=x.ci===me?x:y.ci===me?y:null;
  let sx=lv(x),sy=lv(y);const o=ovr(p);
  const playing=mine&&p.injury<=0&&!p.strike&&p.fatigue<FAT_REST;
  if(playing){const d=(o-clubLv(p))*.35;if(mine===x)sx+=d;else sy+=d}
  let gx=poisson(clamp(1.3+(sx-sy)*.07,.3,3)),gy=poisson(clamp(1.3+(sy-sx)*.07,.3,3)),pk=false;
  if(gx===gy){pk=true;if(Math.random()<.5+(sx-sy)*.02)gx++;else gy++}
  const win=gx>gy?x:y;let myG=0;
  if(playing){const dp=DPOS[dposOf(p)],gf=mine===x?gx:gy;for(let i=0;i<gf;i++)if(Math.random()<dp.goal)myG++}
  return {win,line:`${poName(x,lg)} ${gx}:${gy} ${poName(y,lg)}${pk?' (승부차기)':''}${myG?` · 내 ${myG}골`:''}`,mineIn:!!mine,mineWon:mine===win};
}
function seasonMovements(p,rank,order){
  const me=p.stage==='pro'&&!p.u21?p.club:null,news=[];let my=null,myPo=null;
  // 2부가 없는 리그(네덜란드·포르투갈·벨기에·튀르키예·스코틀랜드): 승강 없이 순위와 대륙대회 출전권만 정한다
  Object.keys(LG).filter(lg=>!LG[lg].am&&LG[lg].tier===1&&!PAIRS.some(x=>x.top===lg)).forEach(lg=>{
    simTable(lg,me!=null&&CLUBS[me].lg===lg?{ci:me,rank}:null,order).forEach(x=>{if(x.ci!=null){CLUBS[x.ci].lastRank=x.rank;CLUBS[x.ci].comp=qualOf(lg,x.rank)}})});
  for(const pr of PAIRS){
    const fx=lg=>me!=null&&CLUBS[me].lg===lg?{ci:me,rank}:null;
    const T=simTable(pr.top,fx(pr.top),order),B=simTable(pr.bot,fx(pr.bot),order),Nt=T.length;
    // 다음 시즌 대륙대회 출전권과 지난 시즌 순위 기록
    T.forEach(x=>{if(x.ci!=null){CLUBS[x.ci].lastRank=x.rank;CLUBS[x.ci].comp=qualOf(pr.top,x.rank)}});
    B.forEach(x=>{if(x.ci!=null){CLUBS[x.ci].lastRank=x.rank;CLUBS[x.ci].comp=null}});
    let D,U,poWinCi=null;
    if(pr.top==='k1'){
      // K리그 실제 승강 방식: 1부 12위 다이렉트 강등 · 2부 1위 다이렉트 승격
      // 승강 PO: 1부 11위 vs 2부 2위, 1부 10위 vs 2부 PO 승자(4위-5위 준PO → 승자 vs 3위)
      const t=k=>T.find(x=>x.rank===k),b=k=>B.find(x=>x.rank===k);
      D=[t(Nt)];U=[b(1)];
      const q1=poMatch(p,b(4),b(5),pr.bot),q2=poMatch(p,b(3),q1.win,pr.bot);

/* 랭킹 시즌: 모두의 랭킹은 3일마다 새로 시작한다 (한국 시간 2026.10.05 00:00부터 3일 단위).

const RANK_EPOCH=Date.parse('2026-10-05T00:00:00+09:00'),RANK_LEN=3*864e5;

function rankRewards(past,cur){

  const got=[];
  Object.entries(by).forEach(([k,rows])=>rows.slice(0,3).forEach((x,i)=>{if(!isMyRow(x))return;const n=lpEarn(`rk:${k}:${i+1}`,RANK_LP[i]);if(n)got.push({k:+k,i,n,name:x.name})}));

function setSession(j,name){const uid=j.user&&j.user.id,keep=G.auth&&G.auth.uid===uid?G.auth.nick:null;G.auth={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid,name};if(keep)G.auth.nick=keep;saveAuth()}

let refreshing=null;
async function authToken(){
  if(!G.auth)return null;
  if(Date.now()>G.auth.exp-60000){
    if(!refreshing)refreshing=(async()=>{
      try{const j=await authReq('token?grant_type=refresh_token',{refresh_token:G.auth.rt});setSession(j,G.auth.name)}
      catch(e){G.auth=null;saveAuth();render()}
    })().finally(()=>{refreshing=null});
    await refreshing;if(!G.auth)return null;
  }
  return G.auth.at;
}

function livePs(){
  const m={};
  const add=x=>{if(!x||x.phase==='retired'||isClosed(x))return;if(!x.pid)x.pid=newPid();const k=pkey(x),o=m[k];if(!o||newer(x,o))m[k]=x};
  G.cloudPs.forEach(add);
  // 지금 플레이 중인 선수가 같은 선수 중 기준: 목록에서는 지금 선수로 대표한다
  if(G.p&&G.p.phase!=='retired'){if(!G.p.pid)G.p.pid=newPid();const k=pkey(G.p),o=m[k];if(!o||!newer(o,G.p))m[k]=G.p;else{o.pid=G.p.pid}}
  return Object.values(m).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,4);
}const saveData=()=>({dex:G.dex,lp:G.lp,p:G.p,ps:livePs(),retiredPids:(G.retiredPids||[]).slice(-60),hof:G.hof,b11:G.b11,unlock:G.unlock,ach:G.ach,frRec:G.frRec,chal:G.chal,create:{seed:G.create.seed,rerolls:G.create.rerolls,used:G.create.used}});
function applyData(d){
  if(!d)return;G.p=d.p||null;migStats(G.p);G.hof=(d.hof||[]).map(h=>h.stats?{...h,stats:conv8(h.stats)}:h);G.b11=d.b11||G.b11;if(d.create)Object.assign(G.create,d.create);if(d.unlock)G.unlock=UNLOCK_ORDER.filter(k=>d.unlock.includes(k)||G.unlock.includes(k));syncUnlock();
  if(d.ach)G.ach={...d.ach,...G.ach};if(d.frRec)G.frRec={...d.frRec,...G.frRec};if(d.chal){for(const k in d.chal)G.chal[k]=Math.max(G.chal[k]||0,d.chal[k])}
  G.cloudPs=(d.ps||[]).filter(Boolean);G.retiredPids=d.retiredPids||[];
  if(G.p){applyWorld(G.p.world);G.p.evHist=G.p.evHist||[]}
}
/* 기기 간 동기화: 덮어쓰지 않고 합친다
   명예의 전당·업적·해금·챌린지 기록은 두 기기 것을 모두 남기고(합집합),
   진행 중인 선수는 모두 클라우드에 남겨 두고, 같은 선수라면 더 최근에 플레이한 쪽을 쓴다 */
const hofKey=r=>r.id||[r.name,r.num,r.year,r.score,r.pos].join('|');
function mergeData(d){
  if(!d)return false;let ch=lpMerge(d.lp);
  const have=new Set(G.hof.map(hofKey));
  (d.hof||[]).forEach(r=>{if(!have.has(hofKey(r))){G.hof.push(r);have.add(hofKey(r));ch=true}});
  if(ch)G.hof.sort((a,b)=>(b.year||0)-(a.year||0)||((b.id||'')>(a.id||'')?1:-1));
  if(d.unlock){const u=UNLOCK_ORDER.filter(k=>d.unlock.includes(k)||G.unlock.includes(k));if(u.length!==G.unlock.length){G.unlock=u;syncUnlock();ch=true}}
  if(d.ach)for(const k in d.ach)if(!G.ach[k]){G.ach[k]=d.ach[k];ch=true}
  if(d.dex&&d.dex.c){for(const k in d.dex.c)if(!G.dex.c[k]){G.dex.c[k]=d.dex.c[k];ch=true}if(!G.dex.eq&&d.dex.eq)G.dex.eq=d.dex.eq;dexSave()}
  if(d.chal)for(const k in d.chal)if((d.chal[k]||0)>(G.chal[k]||0)){G.chal[k]=d.chal[k];ch=true}
  if(d.frRec)for(const k in d.frRec)if(!G.frRec[k]){G.frRec[k]=d.frRec[k];ch=true}
  if(d.b11&&d.b11.line&&!(G.b11&&G.b11.line&&G.b11.line.some(Boolean))){G.b11=d.b11;ch=true}
  G.retiredPids=[...new Set([...(G.retiredPids||[]),...(d.retiredPids||[])])].slice(-60);try{localStorage.setItem('kickoff-life-closed',JSON.stringify(G.retiredPids))}catch(e){}
  // 진행 중인 선수들: 예전 저장(p 하나)도 목록으로 받는다
  const ps=(d.ps&&d.ps.length?d.ps:d.p?[d.p]:[]).filter(x=>x&&x.phase!=='retired');
  const before=JSON.stringify(G.cloudPs.map(x=>[x.pid,x.ts]));
  G.cloudPs=ps;if(JSON.stringify(ps.map(x=>[x.pid,x.ts]))!==before)ch=true;
  // 지금 선수와 같은 선수가 다른 기기에서 더 진행됐으면 그걸로 이어간다. 이 기기에 선수가 없으면 가장 최근 선수를 가져온다
  const lp=G.p,same=lp?ps.filter(x=>x.pid===lp.pid||pkey(x)===pkey(lp)).sort((a,b)=>newer(a,b)?-1:1)[0]:null;
  const take=same&&newer(same,lp)?same:!lp||(lp.phase==='retired'&&isClosed(lp))?ps.filter(x=>!isClosed(x)).sort((a,b)=>(b.ts||0)-(a.ts||0))[0]:null;
  if(take&&JSON.stringify(take)!==JSON.stringify(lp)){const keep=lp&&same===take?lp.pid:null;G.p=JSON.parse(JSON.stringify(take));migStats(G.p);if(keep)G.p.pid=keep;applyWorld(G.p.world);G.p.evHist=G.p.evHist||[];ch=true}
  return ch;
}
// 다른 기기에서 진행 중인 선수 카드: 눌러서 그 선수로 이어하기
function otherPsHtml(){

  return `<div class="note small"><b>☁️ 다른 기기에서 진행 중인 선수</b>${L.map(x=>{let club='';try{club=x.fa?'무소속':teamName(x.club,x.u21)}catch(e){}
    return `<div class="li" style="align-items:center"><span><b>${esc(x.name)}</b> <span class="muted">${x.age}세 · ${x.year}년 · ${esc(club)}${x.ts?` · ${ago(x.ts)} 플레이`:''}</span></span><button class="sbtn" data-act="switch-p" data-v="${x.pid}">이어하기</button></div>`}).join('')}
    ${G.p&&G.p.phase!=='retired'?'<span class="muted">지금 선수도 클라우드에 남아 있어서 나중에 다시 바꿔 이어할 수 있어요.</span>':''}</div>`;
}
// 다른 기기에서 진행 중인 (지금 선수가 아닌) 선수들
const otherPs=()=>livePs().filter(x=>!G.p||(x.pid!==G.p.pid&&pkey(x)!==pkey(G.p)));
// 진행 중인 선수 바꾸기: 지금 선수는 클라우드 목록에 그대로 남는다
function switchPlayer(pid){
  const t=livePs().find(x=>x.pid===pid);if(!t||(G.p&&pkey(t)===pkey(G.p)))return;
  if(G.p&&G.p.phase!=='retired')G.cloudPs=livePs();
  G.p=JSON.parse(JSON.stringify(t));migStats(G.p);applyWorld(G.p.world);G.p.evHist=G.p.evHist||[];G.screen='game';G.tab='season';G.toTop=true;
}
async function cloudPull(){
  const rows=await rest(`saves?select=data,updated_at&user_id=eq.${G.auth.uid}`);
  return rows&&rows[0]?rows[0].data:null;
}
// 앱을 열 때·다시 볼 때: 클라우드 기록을 받아 합치고, 합친 결과를 다시 올린다
let syncing=null;
function cloudSync(){
  if(!sharedOn()||!G.auth)return Promise.resolve(false);
  if(syncing)return syncing;
  syncing=(async()=>{let ok=false;
    try{const d=await cloudPull();const ch=mergeData(d);if(ch){store(true);render()}
      ok=await cloudSave(true);G.acct.pulled=Date.now()}catch(e){G.acct.saveErr=String(e&&e.message||e)}
    return ok})().finally(()=>{syncing=null});
  return syncing;
}
// 자동 클라우드 저장: 진행할 때마다 몇 초 모았다가 한 번에 올린다
let cloudTimer=null;
function cloudSaveSoon(){if(!sharedOn()||!G.auth)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,2500)}
async function cloudSave(merged){
  if(!G.auth)return false;let ok=false;
  // 올리기 전에 다른 기기가 올린 기록을 먼저 합친다 (다른 기기의 명예의 전당·선수가 지워지지 않게)
  if(!merged){try{if(mergeData(await cloudPull())){store()}}catch(e){}}
  try{await rest('saves',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:G.auth.uid,data:saveData(),updated_at:new Date().toISOString()})});
    if(!G.fr.off)try{await rest('showcase',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(showcaseData())})}catch(e){}
    G.acct.saved=Date.now();G.acct.saveErr=false;ok=true}
  catch(e){G.acct.saveErr=String(e&&e.message||e)}
  if(G.screen==='home'||(G.screen==='acct'&&G.auth))render();
  return ok;
}
async function afterLogin(){
  await loadProfile();loadFriends(true);
  // 이 기기 기록과 클라우드 기록을 합친다 (어느 한쪽을 지우지 않는다)
  const cloud=await cloudPull();
  if(cloud){if(!G.p&&!G.hof.length)applyData(cloud);else mergeData(cloud)}
  await cloudSave(true);
  store();if(needNick()){G.screen='acct';G.acct.mode='nick'}else G.screen='home';
}
async function acctSubmit(kind){
  const a=G.acct,id=a.id.trim().toLowerCase();a.err=null;
  if(!ID_RE.test(id)){a.err='아이디는 영문 소문자·숫자·_ 로 3~12자예요.';return render()}
  if(kind!=='reset'&&a.pw.length<6){a.err='비밀번호는 6자 이상이어야 해요.';return render()}
  if(kind==='signup'&&a.pw!==a.pw2){a.err='비밀번호 확인이 일치하지 않아요.';return render()}
  if(kind==='signup'&&deviceId()){a.err='이 기기에서는 이미 아이디를 만들었어요.';return render()}
  if(kind==='signup'&&!NICK_RE.test((a.nick||'').trim())){a.err='닉네임은 한글·영문·숫자·_ 로 2~10자예요.';return render()}
  a.busy=true;render();
  try{
    if(kind==='signup'){
      const j=await authReq('signup',{email:idEmail(id),password:a.pw});
      if(!j.access_token)throw {msg:'confirm'};
      setSession(j,id);try{localStorage.setItem(DEVKEY,JSON.stringify(id))}catch(e){}
      const code=makeCode();await rest('rpc/set_recovery',{method:'POST',body:JSON.stringify({p_code:code})});
      // 가입 화면에서 받은 닉네임을 바로 저장. 그 사이 누가 먼저 썼으면 복구 코드 뒤에 다시 정하게 한다
      const nk=(a.nick||'').trim(),nr=await putNick(nk);
      if(nr==='dup'){a.nickMsg=`'${nk}'은(는) 이미 있는 닉네임이에요. 다른 닉네임을 정해 주세요.`;a.nick=''}
      else if(nr==='err')await loadProfile();
      else a.nick='';
      a.newCode=code;await cloudSave();
    }else if(kind==='login'){
      const j=await authReq('token?grant_type=password',{email:idEmail(id),password:a.pw});
      setSession(j,id);await afterLogin();
    }else{
      if(a.pw.length<6){a.err='새 비밀번호는 6자 이상이어야 해요.';a.busy=false;return render()}
      const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/reset_password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_username:id,p_code:a.code.trim().toUpperCase(),p_new:a.pw})});
      const ok=r.ok&&await r.json();
      if(!ok){a.err='아이디나 복구 코드가 맞지 않아요.'}
      else{const j=await authReq('token?grant_type=password',{email:idEmail(id),password:a.pw});setSession(j,id);await afterLogin()}
    }
    a.pw='';a.pw2='';a.code='';
  }catch(e){a.err=authErr(e)}
  a.busy=false;store();render();
}

const FORMATIONS={
  '4-3-3':[['WG','ST','WG'],['CM','DM','CM'],['FB','CB','CB','FB'],['GK']],
  '4-4-2':[['ST','TM'],['WM','CM','CM','WM'],['FB','CB','CB','FB'],['GK']],
  '4-2-3-1':[['ST'],['WG','CAM','WG'],['DM','CM'],['FB','CB','BPD','FB'],['GK']],
  '3-5-2':[['ST','SS'],['WB','CM','DM','CAM','WB'],['CB','BPD','CB'],['GK']],
  '3-4-3':[['WG','ST','WG'],['WB','CM','CM','WB'],['CB','BPD','CB'],['GK']],
  '5-3-2':[['ST','TM'],['CM','DM','CM'],['WB','CB','CB','CB','WB'],['GK']]
};
const slotList=f=>FORMATIONS[f].flatMap((row,r)=>row.map((d,c)=>({d,key:`${r}-${c}`})));
// 은퇴 선수가 특정 역할에서 보여줄 능력: 전성기 능력치 기준, 포지션군이 다르면 감점
function slotRating(h,d){
  const g=DPOS[d].g;
  if(!h.stats)return Math.round(h.peak*(h.pos===g?1:g==='GK'||h.pos==='GK'?.35:.8));
  const f=fitOf(h.stats,d);
  if(h.pos===g)return f;
  return Math.round(f*(g==='GK'||h.pos==='GK'?.35:.9));
}
function autoB11(){
  const sl=slotList(G.b11.f),pairs=[];
  sl.forEach(s=>G.hof.forEach(h=>pairs.push({s:s.key,id:h.id,r:slotRating(h,s.d)})));
  pairs.sort((a,b)=>b.r-a.r);
  const used=new Set(),slots={};
  pairs.forEach(x=>{if(!slots[x.s]&&!used.has(x.id)){slots[x.s]=x.id;used.add(x.id)}});
  G.b11.slots=slots;G.b11.sel=null;G.b11.match=null;
}
function teamRating(){
  const sl=slotList(G.b11.f),line={att:[],mid:[],def:[]};let sum=0,n=0;
  sl.forEach(s=>{const h=G.hof.find(x=>x.id===G.b11.slots[s.key]);const r=h?slotRating(h,s.d):40;sum+=r;n++;
    const g=DPOS[s.d].g;(g==='FW'?line.att:g==='MF'?line.mid:line.def).push(r)});
  const av=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  return {ovr:Math.round(sum/n),att:av(line.att),mid:av(line.mid),def:av(line.def),filled:sl.filter(s=>G.hof.some(h=>h.id===G.b11.slots[s.key])).length};
}
const OPP=[{n:'K리그 올스타',lv:66},{n:'아시아 올스타',lv:71},{n:'유럽 올스타',lv:77},{n:'역대 월드 레전드',lv:83}];
function friendly(i){
  const t=teamRating(),o=OPP[i],diff=t.ovr-o.lv;
  const gf=poisson(clamp(1.4+diff*.08+(t.att-t.ovr)*.03,.2,4)),ga=poisson(clamp(1.3-diff*.08-(t.def-t.ovr)*.03,.2,4));
  const sc=[];const ids=Object.values(G.b11.slots);
  for(let k=0;k<gf;k++){const att=slotList(G.b11.f).filter(s=>DPOS[s.d].g!=='GK').map(s=>({h:G.hof.find(x=>x.id===G.b11.slots[s.key]),w:DPOS[s.d].goal+.02})).filter(x=>x.h);
    if(!att.length)break;let r=Math.random()*att.reduce((a,x)=>a+x.w,0),pk=att[0];for(const x of att){r-=x.w;if(r<=0){pk=x;break}}sc.push(`${ri(1,90)}' ${pk.h.name}`)}
  G.b11.match={opp:o.n,gf,ga,sc:sc.sort((a,b)=>parseInt(a)-parseInt(b))};
}

/* ---------- 포지션 해금 ----------
   공격수부터 시작. 그 포지션으로 S등급(80점 이상) 커리어를 한 번 만들면 다음 포지션이 열린다
   (공격수 → 미드필더 → 수비수 → 골키퍼). 명예의 전당에 저장하지 않아도 은퇴할 때 S등급이면 열린다 */
const UNLOCK_ORDER=['FW','MF','DF','GK'],UNLOCK_SCORE=80,UNLOCKKEY='kickoff-life-unlock';
G.unlock=load(UNLOCKKEY,null);
function syncUnlock(){
  const first=G.unlock==null,u=new Set(G.unlock||[]);u.add('FW');
  // 이 기능이 생기기 전에 이미 키워 본 포지션은 열어 둔다
  if(first){G.hof.forEach(h=>u.add(h.pos));if(G.p&&G.p.pos)u.add(G.p.pos)}
  G.hof.forEach(h=>{if(h.score>=UNLOCK_SCORE){const i=UNLOCK_ORDER.indexOf(h.pos);if(i>=0&&i<UNLOCK_ORDER.length-1)u.add(UNLOCK_ORDER[i+1])}});
  G.unlock=UNLOCK_ORDER.filter(k=>u.has(k));
}
syncUnlock();
const isUnlocked=pos=>G.unlock.includes(pos);
const unlockNeed=pos=>{const i=UNLOCK_ORDER.indexOf(pos);return i>0?`${POS[UNLOCK_ORDER[i-1]].name} S등급 1명`:''};
// 은퇴할 때 S등급이면 다음 포지션 해금. 새로 열린 포지션 이름을 돌려준다
function unlockByCareer(pos,score){
  if(score<UNLOCK_SCORE)return null;
  const i=UNLOCK_ORDER.indexOf(pos),nx=UNLOCK_ORDER[i+1];
  if(!nx||isUnlocked(nx))return null;
  G.unlock=UNLOCK_ORDER.filter(k=>k===nx||G.unlock.includes(k));return nx;
}

/* ---------- 닉네임 · 친구 ----------
   친구끼리는 명예의 전당, 베스트 11, 커리어 점수(랭킹)만 볼 수 있다. 진행 중인 선수는 공개하지 않는다 */
const NICK_RE=/^[가-힣A-Za-z0-9_]{2,10}$/;
G.fr={list:null,loading:false,err:null,q:'',msg:null,view:null,show:{},match:null,inN:0,off:false};
const needNick=()=>!!(G.auth&&!G.auth.nick&&!G.fr.off);
async function loadProfile(){
  if(!G.auth)return;
  // 서버 응답이 비어 와도(일시적인 인증 문제 등) 이미 정한 닉네임을 지우지 않는다. 기기에 닉네임이 있으면 서버에 다시 등록해 맞춘다
  try{const r=await rest(`profiles?select=nickname&user_id=eq.${G.auth.uid}`);G.fr.off=false;
    if(r&&r[0]&&r[0].nickname){G.auth.nick=r[0].nickname;saveAuth()}
    else if(G.auth.nick){const keep=G.auth.nick,res=await putNick(keep);if(res==='dup'){G.auth.nick=null;saveAuth()}}}
  catch(e){G.fr.off=true}   // 친구용 SQL을 아직 실행하지 않은 경우
}
// 닉네임 저장: 'ok' | 'dup'(이미 있음) | 'err'
async function putNick(n){
  try{
    const t=await authToken();
    const r=await fetch(`${SUPABASE_URL}/rest/v1/profiles`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:G.auth.uid,nickname:n})});
    if(r.status===409)return 'dup';
    if(!r.ok)return 'err';
    G.auth.nick=n;saveAuth();return 'ok';
  }catch(e){return 'err'}
}
async function setNick(){
  const a=G.acct,n=(a.nick||'').trim();a.err=null;
  if(!NICK_RE.test(n)){a.err='닉네임은 한글·영문·숫자·_ 로 2~10자예요.';return render()}
  a.busy=true;render();
  const r=await putNick(n);
  if(r==='dup')a.err='이미 있는 닉네임이에요. 다른 닉네임을 써 주세요.';
  else if(r==='err')a.err='저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
  else{a.nick='';a.nickMsg=null;a.mode='me';G.screen='home';cloudSave()}
  a.busy=false;render();
}
// 베스트 11을 선수 정보째로 풀어 둔다 (친구가 내 명예의 전당 없이도 볼 수 있게)
const pick11=h=>({name:h.name,num:h.num,pos:h.pos,foot:h.foot,dpos:h.dpos,stats:h.stats,peak:h.peak});
const lineupOf=()=>slotList(G.b11.f).map(s=>{const h=G.hof.find(x=>x.id===G.b11.slots[s.key]);return {key:s.key,d:s.d,h:h?pick11(h):null}});
const showcaseData=()=>({user_id:G.auth.uid,
  // 친구가 선수를 눌러 커리어 카드를 볼 수 있게 점수 상위 30명은 카드 정보까지 담는다
  hof:G.hof.slice().sort((a,b)=>b.score-a.score).slice(0,30).map(h=>({name:h.name,num:h.num,pos:h.pos,foot:h.foot,dpos:h.dpos,peak:h.peak,score:h.score,grade:h.grade||gradeOf(h.score),apps:h.apps,goals:h.goals,assists:h.assists,cs:h.cs,caps:h.caps,trophies:h.trophies,club:h.club,year:h.year,age:h.age,top:h.top,tTeam:h.tTeam,tInd:h.tInd,intlGoals:h.intlGoals,tl:(h.tl||[]).slice(0,40),badges:h.badges,detail:h.detail})),
  b11:{f:G.b11.f,line:lineupOf(),ch:G.chal,ach:Object.keys(G.ach||{}).length,fr:G.lp.eq.frame||null,nb:myNb()},best_score:G.hof.reduce((a,x)=>Math.max(a,x.score||0),0),updated_at:new Date().toISOString()});
async function loadFriends(quiet){
  if(!G.auth||G.fr.off)return;
  if(!quiet){G.fr.loading=true;G.fr.err=null;render()}
  try{
    const uid=G.auth.uid;
    const fs=await rest(`friendships?select=id,requester,addressee,status&or=(requester.eq.${uid},addressee.eq.${uid})`)||[];
    const ids=[...new Set(fs.map(f=>f.requester===uid?f.addressee:f.requester))];
    const ps=ids.length?await rest(`profiles?select=user_id,nickname&user_id=in.(${ids.join(',')})`):[];
    const acc=fs.filter(f=>f.status==='accepted').map(f=>f.requester===uid?f.addressee:f.requester);
    const sc=await rest(`showcase?select=user_id,hof,b11,best_score&user_id=in.(${[uid,...acc].join(',')})`)||[];
    const nick=id=>((ps||[]).find(p=>p.user_id===id)||{}).nickname||'(알 수 없음)';
    G.fr.list=fs.map(f=>{const o=f.requester===uid?f.addressee:f.requester;return {id:f.id,uid:o,nick:nick(o),status:f.status,out:f.requester===uid}});
    G.fr.show=Object.fromEntries(sc.map(r=>[r.user_id,r]));
    G.fr.inN=G.fr.list.filter(x=>x.status==='pending'&&!x.out).length;
  }catch(e){if(!quiet)G.fr.err='친구 정보를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'}
  G.fr.loading=false;render();
}
async function friendReq(){
  const F=G.fr,q=F.q.trim();F.msg=null;
  if(!NICK_RE.test(q)){F.msg='닉네임을 정확히 입력해 주세요.';return render()}
  if(q.toLowerCase()===(G.auth.nick||'').toLowerCase()){F.msg='내 닉네임이에요.';return render()}
  try{
    const r=await rest(`profiles?select=user_id,nickname&nickname=ilike.${encodeURIComponent(q)}`);
    const t=(r||[]).find(x=>x.nickname.toLowerCase()===q.toLowerCase());
    if(!t){F.msg='그 닉네임을 찾을 수 없어요.';return render()}
    const ex=(F.list||[]).find(x=>x.uid===t.user_id);
    if(ex){if(ex.status==='pending'&&!ex.out){F.msg=`${t.nickname}님의 요청을 수락했어요.`;return friendAct('accept',ex.id)}
      F.msg=ex.status==='accepted'?'이미 친구예요.':'이미 요청을 보냈어요. 상대가 수락하면 친구가 돼요.';return render()}
    await rest('friendships',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({requester:G.auth.uid,addressee:t.user_id})});
    F.msg=`${t.nickname}님에게 친구 요청을 보냈어요.`;F.q='';await loadFriends(true);
  }catch(e){F.msg='요청을 보내지 못했어요. 잠시 후 다시 시도해 주세요.';render()}
}
async function friendAct(kind,id){
  try{
    if(kind==='accept')await rest(`friendships?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'accepted'})});
    else await rest(`friendships?id=eq.${id}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});
  }catch(e){G.fr.msg='처리하지 못했어요. 잠시 후 다시 시도해 주세요.'}
  if(kind!=='accept'&&G.fr.view)G.fr.view=null;
  await loadFriends(true);
}
// 베스트 11 가상 대결: 공격(공격진·중원) 대 상대 수비(수비진·중원)로 득점 기대치를 정한다
function lineRating(line){
  const g={att:[],mid:[],def:[]};let sum=0;
  line.forEach(s=>{const r=s.h?slotRating(s.h,s.d):40;sum+=r;const k=DPOS[s.d].g;(k==='FW'?g.att:k==='MF'?g.mid:g.def).push(r)});
  const av=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  return {ovr:line.length?Math.round(sum/line.length):40,att:av(g.att),mid:av(g.mid),def:av(g.def),filled:line.filter(s=>s.h).length};
}
function pickScorers(line,n){
  const pool=line.filter(s=>s.h&&DPOS[s.d].g!=='GK').map(s=>({n:s.h.name,w:DPOS[s.d].goal+.02})),out=[];
  for(let k=0;k<n;k++){if(!pool.length){out.push({m:ri(1,90),n:'유스 선수'});continue}
    let r=Math.random()*pool.reduce((a,x)=>a+x.w,0),pk=pool[0];for(const x of pool){r-=x.w;if(r<=0){pk=x;break}}out.push({m:ri(1,90),n:pk.n})}
  return out;
}
function friendMatch(uid){
  const me=lineupOf(),sc=G.fr.show[uid],op=sc&&sc.b11&&sc.b11.line||[];
  const A=lineRating(me),B=lineRating(op);
  const atkA=A.att*.6+A.mid*.4,atkB=B.att*.6+B.mid*.4,defA=A.def*.6+A.mid*.4,defB=B.def*.6+B.mid*.4;
  const gf=poisson(clamp(1.35+(atkA-defB)*.07,.2,4)),ga=poisson(clamp(1.35+(atkB-defA)*.07,.2,4));
  const sh=clamp(Math.round(50+(A.mid-B.mid)*1.2+gauss()*3),25,75);
  const f=(G.fr.list||[]).find(x=>x.uid===uid);
  const rec=G.frRec[uid]=G.frRec[uid]||{w:0,d:0,l:0};if(gf>ga)rec.w++;else if(gf===ga)rec.d++;else rec.l++;
  G.fr.match={uid,nick:f?f.nick:'친구',gf,ga,A,B,sh,sc:[...pickScorers(me,gf).map(x=>({...x,me:true})),...pickScorers(op,ga)].sort((a,b)=>a.m-b.m)};
}
/* ---------- 베스트 11 친구 대결 · 하이라이트 중계 ----------
   전반 장면이 문자 중계로 흐르고 → 하프타임에 전술(공격적·균형·수비적)을 고르면 → 후반이 이어진다.
   장면마다 양쪽 베스트 11의 실제 선수 이름이 나오고, 끝나면 친구와의 전적에 쌓인다 */
const TAC={att:{n:'공격적',d:'찬스 ↑ · 뒷공간 노출',my:1.4,op:1.25,cv:.03},bal:{n:'균형',d:'지금처럼',my:1,op:1,cv:0},def:{n:'수비적',d:'실점 ↓ · 찬스 ↓',my:.7,op:.65,cv:-.02}};
function lineGroups(line){const by=g=>line.filter(s=>s.h&&DPOS[s.d].g===g).map(s=>({n:s.h.name,d:s.d}));return {at:[...by('FW'),...by('MF')],df:by('DF'),gk:by('GK')[0]}}
function pickW(arr,wf){if(!arr.length)return null;let r=Math.random()*arr.reduce((a,x)=>a+wf(x),0);for(const x of arr){r-=wf(x);if(r<=0)return x}return arr[arr.length-1]}
function simHalf(L,half){
  const A=L.A,B=L.B,G1=lineGroups(L.me),G2=lineGroups(L.op),tA=TAC[L.tac||'bal'],tB=TAC[L.otac||'bal'];
  const atk=x=>x.att*.6+x.mid*.4,dfn=x=>x.def*.6+x.mid*.4,share=clamp(.5+(A.mid-B.mid)*.012,.3,.7);
  const wA=share*tA.my*tB.op,wB=(1-share)*tB.my*tA.op,n=Math.min(7,Math.round(ri(4,6)*(wA+wB))),ev=[];   // 한 하프에 장면은 최대 7개
  for(let i=0;i<n;i++){
    const mine=Math.random()<wA/(wA+wB),at=mine?G1:G2,de=mine?G2:G1,t=mine?tA:tB;
    const sh=pickW(at.at,x=>DPOS[x.d].goal+.03)||{n:'유스 선수',d:'ST'},as=pickW(at.at.filter(x=>x!==sh),x=>DPOS[x.d].ast+.02);
    const pg=clamp(.28+(atk(mine?A:B)-dfn(mine?B:A))*.015+t.cv,.1,.55),u=Math.random();let m=half===1?ri(2,45):ri(46,90),guard=0;while(ev.some(e=>e.m===m)&&guard++<20)m=half===1?ri(2,45):ri(46,90);   // 같은 분에 장면이 겹치지 않게
    let k,txt;
    if(u<pg){k='goal';txt=`⚽ 골! ${esc(sh.n)}${as&&Math.random()<.75?` <span class="muted">(도움 ${esc(as.n)})</span>`:''} · ${pick(['오른발 감아차기','왼발 강슛','헤더','골키퍼 키를 넘기는 칩슛','문전 혼전 끝에 밀어 넣기','중거리 대포알','침착한 일대일 마무리'])}`}
    else{const r=Math.random(),gk=de.gk?esc(de.gk.n):'골키퍼',df=de.df.length?esc(pick(de.df).n):'수비수';
      if(r<.42){k='save';txt=`🧤 ${esc(sh.n)}의 슈팅을 ${iga(gk)} ${pick(['막아 낸다','몸을 날려 쳐 낸다','손끝으로 걷어 낸다'])}`}
      else if(r<.57){k='block';txt=`🧱 ${iga(df)} 몸을 던져 ${esc(sh.n)}의 슈팅을 막는다`}
      else if(r<.67){k='post';txt=`🥅 ${esc(sh.n)}의 슈팅이 골대를 강타!`}
      else{k='miss';txt=`${esc(sh.n)}, ${pick(['아쉽게 빗나간다','하늘로 뜬다','옆그물을 때린다','슈팅이 힘없이 굴러간다'])}`}}
    ev.push({m,side:mine?'me':'op',k,txt,sc:k==='goal'?esc(sh.n):null});
  }
  return ev.sort((a,b)=>a.m-b.m);
}
function liveStart(uid){
  const sc=G.fr.show[uid],f=(G.fr.list||[]).find(x=>x.uid===uid),me=lineupOf(),op=sc&&sc.b11&&sc.b11.line||[];
  clearTimeout(G.fr.live&&G.fr.live.timer);
  const L=G.fr.live={uid,nick:f?f.nick:'친구',me,op,A:lineRating(me),B:lineRating(op),tac:'bal',otac:'bal',stage:'h1',shown:0,ev:[{m:0,side:'',k:'info',txt:'🏟️ 킥오프! 두 베스트 11의 맞대결이 시작됩니다'}]};
  L.ev.push(...simHalf(L,1));G.fr.match=null;liveTick();
}
const liveScore=L=>{const s=L.ev.slice(0,L.shown);return [s.filter(e=>e.k==='goal'&&e.side==='me').length,s.filter(e=>e.k==='goal'&&e.side==='op').length]};
function liveTick(){const L=G.fr.live;if(!L||L.stage==='ht'||L.stage==='ft')return;
  if(L.shown<L.ev.length){L.shown++;render();L.timer=setTimeout(liveTick,L.shown===1?500:850);return}liveEnd()}
function liveEnd(){const L=G.fr.live;if(!L)return;clearTimeout(L.timer);

function lpMerge(d){
  if(!d)return false;let ch=false;
  for(const k in d.earn||{})if(G.lp.earn[k]==null){G.lp.earn[k]=d.earn[k];ch=true}
  const ids=new Set(G.lp.buy.map(b=>b.id));(d.buy||[]).forEach(b=>{if(!ids.has(b.id)){G.lp.buy.push(b);ch=true}});
  const us=new Set(G.lp.use.map(b=>b.id));(d.use||[]).forEach(b=>{if(!us.has(b.id)){G.lp.use.push(b);ch=true}});
  for(const k in d.eq||{})if(!G.lp.eq[k]&&d.eq[k]){G.lp.eq[k]=d.eq[k];ch=true}

/* ---------- 은퇴 후 이야기 (자동) ----------

function retirementStory(p,score){

        :pk([`지도자 연수를 받고 고등학교 축구부 감독이 됐다. 제자 중 몇 명이 프로에 입단했다.`,`유소년 클럽 코치로 아이들에게 축구를 가르치고 있다.`])},
      {w:2,i:'🎙️',t:top?pk([`방송사 메인 해설위원이 됐다. 월드컵 중계 시청률 1위를 이끌었다.`,`날카로운 분석으로 인기 해설위원이 됐다. 그의 한마디가 매주 기사 제목이 된다.`]):pk([`케이블 채널 K리그 해설위원으로 활약하고 있다.`,`축구 전문 라디오 프로그램의 고정 패널이 됐다.`])},
      {w:1,i:'📺',t:pk([`스포츠 아나운서로 변신해 주말 축구 하이라이트 프로그램을 진행한다.`,`스포츠 뉴스 앵커가 됐다. 선수 출신다운 인터뷰로 호평받는다.`])},
      {w:1,i:'🔍',t:pk([`${best}의 스카우트가 돼 전국 고교 대회를 누빈다. 그가 발굴한 유망주가 국가대표가 됐다.`,`유럽 구단의 아시아 담당 스카우트가 됐다.`])},
      {w:1,i:'🏢',t:top?pk([`${best}의 단장이 돼 구단 운영을 맡았다.`,`대한축구협회 기술위원장이 됐다.`]):pk([`${best} 프런트에 입사해 유소년 육성 팀장을 맡았다.`,`프로축구연맹 경기감독관으로 일하고 있다.`])},
      {w:1,i:'🤝',t:pk([`선수 에이전트가 돼 후배들의 해외 진출을 돕고 있다.`,`스포츠 매니지먼트 회사를 차려 선수 20여 명을 관리한다.`])},
      {w:1,i:'🌱',t:pk([`고향에 '${n.slice(-2)} 축구 아카데미'를 열었다. 15년 뒤 그곳 출신 선수가 국가대표에 뽑혔다.`,`유소년 축구교실을 운영한다. "꿈은 크게, 패스는 정확하게"가 그의 구호다.`])}

    let tot=paths.reduce((a,x)=>a+x.w,0),q=Math.random()*tot,c=paths[0];for(const x of paths){q-=x.w;if(q<=0){c=x;break}}
    out.push({i:c.i,t:c.t,k:'football'});

      {i:'📱',t:`축구 유튜버로 대박이 났다. 구독자 ${top?'300만':'50만'} 명의 인플루언서가 됐다.`},
      {i:'📸',t:`SNS 인플루언서가 됐다. 패션 브랜드 모델로도 활동한다.`},

      {i:'📉',t:`지인의 투자 권유에 넘어가 사기를 당했다. 큰돈을 잃었지만 다시 일어서기 위해 해설 공부를 시작했다.`},
      {i:'💔',t:`이혼 소식이 전해졌다. 한동안 언론을 피해 조용히 지냈다.`},

  if(good&&rich)extra.push(pk([{i:'⚽',t:`고향에 인조잔디 축구장을 기부했다. 구장에는 그의 이름이 붙었다.`},{i:'🎓',t:`자신의 이름을 딴 장학재단을 세워 매년 유소년 선수들을 후원한다.`}]));

  if(out[0].k!=='bad'&&extra.length)out.push(...extra.slice(0,2));

/* ---------- 대륙대회: 조별리그 → 토너먼트 ----------
   출전권이 있는 팀은 리그 사이사이 주중에 대륙대회 경기를 치른다. 조 추첨(포트·같은 리그 회피)과

const CC_F={

  ACL2:[['감바 오사카',61],['산둥 타이산',60],['알 와슬',59],['샤르자',59],['세파한',58],['이스테그랄',58],['나사프 카르시',56],['방콕 유나이티드',56],['포트 FC',55],['라이언 시티 세일러스',55],['동아시아 예선 통과팀',54],['서아시아 예선 통과팀',54]]

const CC_RR=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];

const ccTag=cc=>`[${COMP[cc.cp].s}]`;
const ccMine=(p,cc)=>cc.ci===p.club&&!p.u21&&!p.fa;
function ccSim(A,B){const d=A.lv-B.lv;return [poisson(clamp(1.35+d*.07,.3,3.5)),poisson(clamp(1.35-d*.07,.3,3.5))]}
function ccInit(p){
  const s=p.season,cp=CLUBS[p.club].comp;if(!cp||p.u21||p.stage!=='pro')return;
  const G=cp==='ACLE'||cp==='ACL2'?4:8,N=G*4,euro=!(cp==='ACLE'||cp==='ACL2');
  const okLg=i=>euro?LG[CLUBS[i].lg].euro&&LG[CLUBS[i].lg].tier===1:CLUBS[i].lg==='k1';
  const real=CLUBS.map((c,i)=>i).filter(i=>CLUBS[i].comp===cp&&okLg(i));if(!real.includes(p.club))real.push(p.club);
  const T=i=>({ci:i,n:CLUBS[i].name,lv:teamLv(i,false),lg:CLUBS[i].lg});
  let teams=real.map(T).concat(shuffle(CC_F[cp].slice()).filter(([n])=>!CLUBS.some(c=>c.name===n)).map(([n,lv])=>({ci:null,n,lv:lv+gauss()*.8,lg:null})));
  if(teams.length<N)shuffle(CLUBS.map((c,i)=>i).filter(i=>okLg(i)&&!teams.some(t=>t.ci===i))).slice(0,N-teams.length).forEach(i=>teams.push(T(i)));
  while(teams.length<N)teams.push({ci:null,n:`예선 통과팀 ${teams.length}`,lv:euro?62:56,lg:null});
  // 내 팀은 반드시 들어가게 하고, 전력 순으로 32(16)팀을 고른다
  const me=teams.find(t=>t.ci===p.club);teams=teams.filter(t=>t!==me).sort((a,b)=>b.lv-a.lv).slice(0,N-1).concat(me).sort((a,b)=>b.lv-a.lv);
  // 조 추첨: 전력 순 포트 4개, 포트마다 조에 한 팀씩. 같은 리그 팀은 같은 조를 피한다
  const groups=Array.from({length:G},()=>[]);
  for(let pot=0;pot<4;pot++)shuffle(teams.slice(pot*G,pot*G+G)).forEach(t=>{let gi=groups.findIndex(g=>g.length===pot&&!(t.lg&&g.some(x=>x.lg===t.lg)));if(gi<0)gi=groups.findIndex(g=>g.length===pot);groups[gi].push(t)});
  groups.forEach((g,gi)=>g.forEach(t=>Object.assign(t,{gi,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})));
  const mg=groups.findIndex(g=>g.includes(me));groups[mg].splice(groups[mg].indexOf(me),1);groups[mg].unshift(me);
  const gm=s.games,at=f=>Math.max(1,Math.round(gm*f));
  const gr=G===8?[.08,.15,.22,.29,.36,.43]:[.08,.16,.24,.32,.4,.48],ko=G===8?[[.55,.59],[.68,.72],[.82,.86]]:[[.62,.66],[.8,.84]];
  const sched=gr.map((f,md)=>({at:at(f),k:'g',md})).concat(ko.flatMap((r,ri)=>r.map((f,leg)=>({at:at(f),k:'ko',r:ri,leg}))));
  s.cc={cp,G,groups,mg,md:0,q:0,sched,ko:[],stage:'group',ci:p.club,alive:true,fin:null,champ:null};
  addNews(p,`${ccTag(s.cc)} 조 추첨 · ${'ABCDEFGH'[mg]}조: ${groups[mg].slice(1).map(t=>t.n).join(', ')}`,'');
}
// 토너먼트 추첨: 첫 판은 조 1위 vs 다른 조 2위(같은 리그 회피), 다음부터는 자유 추첨
function ccDraw(win,run){
  const ties=[];
  if(run){const rs=shuffle(run.slice());shuffle(win.slice()).forEach(w=>{let k=rs.findIndex(r=>r.gi!==w.gi&&!(w.lg&&r.lg===w.lg));if(k<0)k=rs.findIndex(r=>r.gi!==w.gi);if(k<0)k=0;ties.push({a:rs[k],b:w,legs:[]});rs.splice(k,1)})}
  else{const l=shuffle(win.slice());for(let i=0;i+1<l.length;i+=2)ties.push({a:l[i],b:l[i+1],legs:[]})}
  return {name:CC_RN[ties.length*2]||`${ties.length*2}강`,ties,done:false};
}
function ccPlay(p,ap,o,label,ko){
  const s=p.season,cc=s.cc,before=p.fatigue,big=ko||o.lv>=clubLv(p);
  const m=simMatch(p,s,ap,COMP[cc.cp].s,{oi:null,tags:big?['cc','cup','big']:['cc','cup'],cc:{n:o.n,lv:o.lv,s:COMP[cc.cp].s}});
  p.fatigue=Math.max(0,p.fatigue-matchRecovery(p.fatigue)*ageRec(p));m.fat=Math.round(p.fatigue);m.tired=m.play&&before>=60;m.pen=m.play?fatiguePenalty(before)-fatStatMod(before)/9:0;
  m.ccRound=`${COMP[cc.cp].s} ${label}`;m.oci=o.ci;m.ko=!!ko;return m;
}
// 결과가 정해진 단계를 정리한다: 조별리그 순위 확정·추첨, 토너먼트 승자·다음 추첨, 결승
function ccSettle(p){
  const s=p.season,cc=s&&s.cc;if(!cc)return;const tag=ccTag(cc),mine=ccMine(p,cc);
  if(cc.stage==='group'&&cc.md>=6){
    cc.stage='ko';const sorted=cc.groups.map(g=>g.slice().sort(tabCmp));cc.sorted=sorted.map(g=>g.map(t=>t.n));
    const pos=sorted[cc.mg].findIndex(t=>t.ci===cc.ci)+1;cc.alive=pos<=2;
    cc.ko=[ccDraw(sorted.map(g=>g[0]),sorted.map(g=>g[1]))];
    if(mine){if(cc.alive){const t=cc.ko[0].ties.find(t=>t.a.ci===cc.ci||t.b.ci===cc.ci),o=t.a.ci===cc.ci?t.b:t.a;addNews(p,`${tag} 조별리그 ${pos}위로 ${cc.ko[0].name} 진출! 추첨 결과 상대는 ${o.n}`,'good',o.ci!=null?o.ci:o.n);mor(p,4)}
      else{addNews(p,`${tag} 조별리그 ${pos}위… ${COMP[cc.cp].n} 조별 탈락`,'bad');mor(p,-4)}}
    else if(cc.alive)addNews(p,`${tag} 친정팀 ${CLUBS[cc.ci].name}, 조별리그 통과`,'');
  }
  if(cc.stage==='ko'){const R=cc.ko[cc.ko.length-1];
    if(R&&!R.done&&R.ties.every(t=>t.legs.length===2&&t.legs[1])){
      R.done=true;
      R.ties.forEach(t=>{const A=t.legs[0][0]+t.legs[1][0],B=t.legs[0][1]+t.legs[1][1];t.agg=[A,B];
        if(A!==B)t.w=A>B?t.a:t.b;else{t.pk=true;t.w=Math.random()<clamp(.5+(t.a.lv-t.b.lv)*.03,.25,.75)?t.a:t.b}});
      const my=R.ties.find(t=>t.a.ci===cc.ci||t.b.ci===cc.ci);
      if(my&&cc.alive){const meA=my.a.ci===cc.ci,o=meA?my.b:my.a,ag=meA?my.agg:[my.agg[1],my.agg[0]];
        if(my.w.ci===cc.ci){if(mine){addNews(p,`${tag} ${R.name} 통과! vs ${o.n} 합계 ${ag[0]}-${ag[1]}${my.pk?' (승부차기)':''}`,'good',o.ci!=null?o.ci:o.n);mor(p,5)}}
        else{cc.alive=false;if(mine){addNews(p,`${tag} ${R.name} 탈락… vs ${o.n} 합계 ${ag[0]}-${ag[1]}${my.pk?' (승부차기)':''}`,'bad',o.ci!=null?o.ci:o.n);mor(p,-5)}}}
      const ws=R.ties.map(t=>t.w);
      if(ws.length===2){cc.stage='final';cc.fin={a:ws[0],b:ws[1]};
        if(cc.alive&&mine){const o=ws.find(t=>t.ci!==cc.ci);s.finals=(s.finals||[]).concat({name:COMP[cc.cp].n,opp:o.n,oppL:o.lv,cc:true});s.finalWins=s.finalWins||[];addNews(p,`[결승 진출] ${COMP[cc.cp].n} 결승 진출! 상대는 ${o.n}`,'good',o.ci!=null?o.ci:o.n)}
        else{const [x,y]=ccSim(ws[0],ws[1]);const w=x>y?ws[0]:x<y?ws[1]:Math.random()<.5?ws[0]:ws[1];cc.fin.res={gf:x,ga:y,pk:x===y};cc.champ=w.n;cc.stage='done';
          addNews(p,`${tag} 결승 ${ws[0].n} ${x}-${y} ${ws[1].n}${x===y?' (승부차기)':''} · 우승은 ${w.n}`,'',w.ci!=null?w.ci:w.n)}}
      else{cc.ko.push(ccDraw(ws));const N=cc.ko[cc.ko.length-1];
        if(cc.alive&&mine){const t=N.ties.find(t=>t.a.ci===cc.ci||t.b.ci===cc.ci),o=t.a.ci===cc.ci?t.b:t.a;addNews(p,`${tag} ${N.name} 추첨 · 상대는 ${o.n}`,'',o.ci!=null?o.ci:o.n)}}
    }}
}
// 리그 경기 뒤 그 시점까지 잡혀 있던 대륙대회 경기를 치른다 (내 경기는 결과 목록에 더해 돌려준다)
function ccStep(p,ap,max){
  const s=p.season,cc=s&&s.cc;if(!cc)return [];const out=[];max=max||9;
  ccSettle(p);
  while(cc.q<cc.sched.length&&cc.sched[cc.q].at<=s.mi&&out.length<max){
    const ev=cc.sched[cc.q],mine=ccMine(p,cc);
    if(ev.k==='g'&&cc.stage==='group'){
      cc.groups.forEach((g,gi)=>CC_RR[ev.md%3].forEach(([x,y])=>{const A=g[x],B=g[y];
        if(mine&&(A.ci===cc.ci||B.ci===cc.ci)){const meA=A.ci===cc.ci,o=meA?B:A,m=ccPlay(p,ap,o,`조별리그 ${ev.md+1}차전`,false);
          m.ccRef={t:'g',gi,a:meA?x:y,b:meA?y:x};tabRes(meA?A:B,m.gf,m.ga);tabRes(o,m.ga,m.gf);out.push(m)}
        else{const [a,b]=ccSim(A,B);tabRes(A,a,b);tabRes(B,b,a)}}));
      cc.md++;
    }else if(ev.k==='ko'){
      if(cc.stage==='group')ccSettle(p);
      const R=cc.ko[ev.r];
      if(R&&!R.done)R.ties.forEach((t,ti)=>{if(t.legs[ev.leg])return;
        if(mine&&cc.alive&&(t.a.ci===cc.ci||t.b.ci===cc.ci)){const meA=t.a.ci===cc.ci,o=meA?t.b:t.a,m=ccPlay(p,ap,o,`${R.name} ${ev.leg+1}차전`,true);
          m.ccRef={t:'ko',r:ev.r,ti,leg:ev.leg,home:meA};t.legs[ev.leg]=meA?[m.gf,m.ga]:[m.ga,m.gf];out.push(m)}
        else t.legs[ev.leg]=ccSim(t.a,t.b)});
    }
    cc.q++;
    if(out.some(m=>m.inj))break;
  }
  return out;
}
// 결정적 순간으로 대륙대회 경기 결과가 바뀌었을 때
function ccFix(p,m,gf,ga){
  const s=p.season,cc=s.cc,def=p.pos==='GK'||p.pos==='DF';
  if(m.play&&def){if(m.ga===0&&ga>0)s.cs--;if(m.ga>0&&ga===0)s.cs++}
  if(m.play)s.conc=(s.conc||0)+(ga-m.ga);
  const ref=m.ccRef,undo=(r,x,y)=>{r.pl--;r.gf-=x;r.ga-=y;if(x>y){r.w--;r.pts-=3}else if(x===y){r.d--;r.pts--}else r.l--};
  if(cc&&ref){if(ref.t==='g'){const g=cc.groups[ref.gi];undo(g[ref.a],m.gf,m.ga);undo(g[ref.b],m.ga,m.gf);tabRes(g[ref.a],gf,ga);tabRes(g[ref.b],ga,gf)}
    else{const t=cc.ko[ref.r].ties[ref.ti];t.legs[ref.leg]=ref.home?[gf,ga]:[ga,gf]}}
  m.gf=gf;m.ga=ga;
}
// 순위 탭 › 대륙대회: 조별리그 순위표와 토너먼트 대진
function ccView(p){

  const row=(t,i)=>`<div class="trow${t.ci===cc.ci?' me':''}${i<2?' z-'+C.c:''}"><span class="num">${i+1}</span>${crest(t.ci!=null?t.ci:t.n,16)}<span class="tn">${esc(t.n)}</span>${tabCells(t)}</div>`;

  return h;

/* ---------- 결승전 ----------
   시즌 막판(80% 지점)에 컵대회·대륙대회 결승 진출 여부가 정해지고, 결승은 직접 치른다 */
const AFC_OPP=['요코하마 F. 마리노스','알 힐랄','상하이 하이강','가와사키 프론탈레','알 아인','부리람 유나이티드','알 나스르'];
function scheduleFinals(p){
  const s=p.season,l=curLg(p),club=CLUBS[p.club],rank=myRank(p)||99,eu=isEuro(p.club)&&!p.u21&&isTop(p.club);
  if(p.u21||p.fa||s.finalsSet)return;s.finalsSet=true;
  const list=[],sameLg=clubsIn(club.lg).filter(i=>i!==p.club);
  // 컵대회는 1부·2부가 함께 치른다: 2부 팀은 결승까지 가기 어렵고, 결승 상대는 대부분 1부 팀이다
  const pair=PAIRS.find(x=>x.top===club.lg||x.bot===club.lg),tier2=!!pair&&pair.bot===club.lg,topLg=pair?pair.top:club.lg;
  if(l.cup&&Math.random()<clamp((.06+club.str*.025+(rank<=3?.05:0))*2.2*(tier2?.2:1),.01,.6)){
    const oppPool=(pair&&!tier2&&Math.random()<.15?clubsIn(pair.bot):clubsIn(topLg)).filter(i=>i!==p.club),oi=oppPool.length?pick(oppPool):null;
    list.push({name:l.cup,opp:oi!=null?teamName(oi,false):'상대 팀',oppL:oi!=null?teamLv(oi,false)+gauss()*1.5:clubLv(p)+gauss()*3})}
  // 대륙대회: 지난 시즌 순위로 얻은 출전권(UCL·UEL·UECL·ACLE·ACL2)에 따라 결승 진출을 노린다
  // 대륙대회는 실제 조별리그·토너먼트(s.cc)로 치른다. 예전 저장(s.cc 없음)만 확률로 결승을 정한다
  const cp=s.cc?null:club.comp;
  if(cp){const str=club.str,reach={UCL:(.04+str*.02)*2.2,UEL:.08+str*.025,UECL:.12+str*.03,ACLE:(.08+str*.03)*2,ACL2:.2+str*.03}[cp];
    const euPool=(lo,hi)=>CLUBS.map((c,i)=>i).filter(i=>i!==p.club&&CLUBS[i].lg!==club.lg&&LG[CLUBS[i].lg].euro&&LG[CLUBS[i].lg].tier===1&&CLUBS[i].str>=lo&&CLUBS[i].str<=hi);
    const pool=cp==='UCL'?euPool(4,9):cp==='UEL'?euPool(1,5):cp==='UECL'?euPool(-3,2):[];
    if(Math.random()<clamp(reach,.03,.45))list.push({name:COMP[cp].n,opp:pool.length?teamName(pick(pool),false):pick(AFC_OPP),oppL:clubLv(p)+({UCL:2,UEL:1,UECL:0,ACLE:1,ACL2:0}[cp])+gauss()*2});
  }
  s.finals=(s.finals||[]).concat(list);s.finalWins=s.finalWins||[];
  list.forEach(f=>addNews(p,`[결승 진출] ${f.name} 결승 진출! 상대는 ${f.opp}`,'good'));
}
// 결승은 실제처럼 리그 일정이 모두 끝난 뒤에 치른다 (대륙대회·컵대회 모두)
const pendingFinal=p=>{const s=p.season;return s&&s.done&&s.finals&&s.finals.find(f=>!f.done)};
function playFinal(p,mode){
  const s=p.season,f=pendingFinal(p);if(!f||p.moment)return;
  const lv=clubLv(p),o=ovr(p)+sharpMod(p),allIn=mode==='all';
  const can=p.injury<=0&&!(p.susp>0)&&!p.strike;
  const play=can&&Math.random()<({'주전':.97,'로테이션':.65,'벤치':.25}[p.role]||.5);
  const perf=play?5.6+(o-lv)/9+(allIn?.35:0)+moraleBonus(p.morale)+chemBonus(p)-fatPerf(p.fatigue)+traitPerf(p,['final'])+gauss()*.7:0;
  const diff=lv+(play?(o-lv)*.45+(perf-6.5)*.4:0)-f.oppL;
  let gf=poisson(clamp(1.3+diff*.07,.3,3.2)),ga=poisson(clamp(1.3-diff*.07,.3,3.2));
  let g=0,a=0,r=null;
  if(play){const dp=DPOS[dposOf(p)];for(let i=0;i<gf;i++){const u=Math.random();if(u<clamp(dp.goal*(1+(perf-6.5)*.35),0,.7))g++;else if(u<clamp(dp.goal*(1+(perf-6.5)*.35),0,.7)+clamp(dp.ast*(1+(perf-6.5)*.3),0,.5))a++}
    r=clamp(perf+.3+g*.45+a*.3+(gf>ga?.3:gf<ga?-.2:0)+(p.pos==='GK'?(ga===0?.45:0)-ga*.15:p.pos==='DF'?(ga===0?.4:0)-ga*.08:0),4,10)}
  if(allIn)p.fatigue+=12;else p.fatigue+=play?6:0;
  const res={gf,ga,play,g,a,r,diff,perf,opp:f.opp};
  // 결승에 뛰었다면 결정적 순간을 직접 고른다
  if(play){p.moment=buildMoment(p,res,'final');return}
  finishFinal(p,f,res);
}
function finishFinal(p,f,res){
  const s=p.season;let {gf,ga,play,g,a,r,diff,perf}=res,pk=null;
  if(gf===ga){const gkB=play&&p.pos==='GK'?(perf-6.5)*.15:0;pk=Math.random()<clamp(.5+diff*.02+gkB,.2,.8)?'win':'lose'}
  const win=gf>ga||pk==='win';
  f.done=true;f.res={gf,ga,pk,play,g,a,r,win};
  // 결승도 시즌 기록에 넣는다 (컵 결승은 시즌 전체 기록, 대륙대회 결승은 대륙대회 기록에도)
  if(play&&r!=null){s.apps++;s.goals+=g;s.assists+=a;s.ratingSum+=r;if(r>=8.3)s.motm=(s.motm||0)+1;
    if(ga===0&&(p.pos==='GK'||p.pos==='DF'))s.cs++;
    if(f.cc){s.ccG=(s.ccG||0)+g;s.ccA=(s.ccA||0)+a;s.ccApps=(s.ccApps||0)+1;s.ccRs=(s.ccRs||0)+r;if(ga===0&&(p.pos==='GK'||p.pos==='DF'))s.ccCs=(s.ccCs||0)+1}}
  if(f.cc&&s.cc&&s.cc.fin){const cc=s.cc;cc.fin.res=cc.fin.a.ci===cc.ci?{gf,ga,pk:!!pk}:{gf:ga,ga:gf,pk:!!pk};cc.champ=win?CLUBS[cc.ci].name:f.opp;cc.stage='done'}
  if(win){s.finalWins.push(f.name);p.finalWins=(p.finalWins||0)+1;mor(p,8);repA(p,play?3:1);celebrate('🏆',`${f.name} 우승!`,`결승 vs ${f.opp} ${gf}-${ga}${pk?' (승부차기)':''}${play?` · 평점 ${dr(r)}${g?` · ${g}골`:''}`:''}`)}else mor(p,-5);
  const me=play?` · ${p.name} ${g?`${g}골 `:''}${a?`${a}도움 `:''}평점 ${dr(r)}`:' · 출전하지 못했다';
  p.note=(p.note?p.note+' / ':'')+`${f.name} 결승 vs ${f.opp} · ${gf}-${ga}${pk?` (승부차기 ${pk==='win'?'승':'패'})`:''} · ${win?'🏆 우승!':'준우승'}${me}`;
  addNews(p,`[결승] ${f.name} ${win?'우승!':'준우승'} · ${gf}-${ga}${pk?' (승부차기)':''}`,win?'good':'bad');
}

  {d:'2026.10.09 17:19',t:'주전 경쟁 · 계약 조항 · 시즌 리포트',l:['⚔️ 주전 경쟁자: 팀마다 내 자리를 다투는 선수가 생겨요 (이름·나이·OVR). 경쟁자가 다치면 기회, 폼이 좋으면 밀려요. 해가 지나면 나이 들고, 은퇴·이적하고, 구단이 새로 영입하기도 해요','📈 팀 전력 변동: 여름마다 보강·이탈로 팀 전력이 조금씩 달라지고, 시즌 프리뷰 기사에 예상 순위가 나와요','✍️ 계약 조항 요구: 오퍼에서 출전 보장(첫 시즌 주전 출발 · 쉽게 밀리지 않음)이나 바이아웃 조항을 요구할 수 있어요. 무리하면 오퍼가 철회될 수 있어요','🩹 부상 현실화: 다쳤던 부위는 재발하기 쉽고, 같은 부위를 자주 다치면 고질이 돼요. 큰 부상은 해외 전문의(비용)로 복귀를 앞당길 수 있어요. 장기 부상에서 돌아오면 복귀 소식이 떠요','🔗 이벤트 연쇄: 열애설·라이벌 도발·승부 조작 신고·예능 출연 등 선택한 결과가 몇 경기 뒤나 다음 시즌에 후속 이벤트로 돌아와요','📊 시즌 리포트: 시즌 결산에 경기별 평점 그래프 · 전반기/후반기 비교 · 베스트 경기 · 작년 대비 기록','💼 개인 스태프: 시즌 준비 때 개인 트레이너(훈련 효과↑) · 물리치료사(부상↓) · 영양사(피로↓) 중 한 명을 고용해요. 비용은 리그 수준과 내 OVR로 정해지고, 주급이 비용의 두 배 이상이어야 해요. 성장했는데 예전 계약이면 재계약이나 이적이 필요해요','🤝 팀 케미가 천천히 쌓여요: 이적 직후엔 손발이 안 맞고, 오래 뛸수록 경기력이 더 올라가요','©️ 주장: 주전에서 쉽게 밀리지 않고 이기면 인지도가 더 올라요. 대신 성적이 나쁘면 책임론이 나와요','🩺 해외 전문의 수술: 10경기 이상 큰 부상에만, 3시즌에 한 번 · 결과는 대성공부터 실패까지 운에 달렸어요','🔓 바이아웃: 지금 팀보다 큰 구단이 오면 발동해 소속팀이 막을 수 없어요','📰 이적 확정 연출이 실제 계약 내용(바이아웃 발동 · 자유 이적 · 계약 조항)과 실패 이유에 맞게 나와요','🃏 커리어 카드 새 디자인: 세로형 · 대표 구단 색 · 랜덤 세레머니 픽셀 선수 · 능력치·통산 기록·커리어·트로피','🎉 우승·해트트릭 세레머니 포즈 17가지 (랜덤)','골키퍼 OVR 비중 재정리: 반응·다이빙·핸들링·위치선정·공중볼 중심, 민첩성 비중은 줄임 (진행 중인 골키퍼는 OVR이 떨어지지 않게 자동 보정)','골키퍼는 피로가 덜 쌓이고, 나이에 따른 피로·하락이 몇 년 늦게 와요 (더 오래 뛸 수 있어요)','🕶️ 몰래 모드 (홈 맨 아래): 흑백·반투명 화면, 움직이는 연출 끄기, 탭 제목 변경 · 왼쪽 작은 탭(PC는 Esc)을 누르면 업무 문서 화면으로 바로 숨겨요 · 흐림 정도 3단계','경기 화면 픽셀 경기장을 세로로 키우고, 팀 이름·경기 수 글자가 선수와 겹치지 않게 옮겼어요','시즌 베팅 한 줄이 픽셀 경기장 바로 아래에 보여요','커리어 점수: 은퇴 화면·내 선수·명예의 전당 랭킹 점수가 서로 다르게 나오던 문제 수정 (모두 같은 기준)']},
