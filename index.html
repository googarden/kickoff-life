/* 경력: 같은 팀에서 뛴 기간을 한 줄로 묶는다 (FotMob 경력 화면처럼).
   임대·상무·현역 복무·무소속은 따로 한 줄이 되고, 그동안에도 원소속팀 기간은 끊기지 않는다
   (대구 27 → 안양 임대 28 → 대구 29 이면 '대구 2027 - 2029' + '안양 (임대) 2028') */
function careerStints(p){
  const rows=[];let parent=null;
  // 예전 기록에는 구단 번호가 없어서 이름으로 찾는다
  const resolve=h=>{
    if(h.ci!=null)return {ci:h.ci,u21:!!h.u21};
    const nm=(h.club||'').split(' → ').pop();
    for(let i=0;i<CLUBS.length;i++){if(teamName(i,false)===nm)return {ci:i,u21:false};if(teamName(i,true)===nm)return {ci:i,u21:true}}
    return {ci:null,u21:false};
  };
  const mk=(key,o)=>({key,ci:o.ci,u21:o.u21,loan:o.loan,mil:o.mil,fa:o.fa,name:o.name,y1:o.y,y2:o.y,apps:0,goals:0,assists:0,cs:0,conc:0,rs:0,now:false});
  const addTo=(r,o)=>{r.y2=Math.max(r.y2,o.y);r.apps+=o.apps;r.goals+=o.goals;r.assists+=o.assists;r.cs+=o.cs;r.conc+=o.conc;r.rs+=o.rs;if(o.now)r.now=true};
  const add=(key,o,interim)=>{
    if(interim){const last=rows[rows.length-1];if(last&&last.key===key){addTo(last,o);return}const r=mk(key,o);addTo(r,o);rows.push(r);return}
    if(parent&&parent.key===key){addTo(parent,o);return}
    const r=mk(key,o);addTo(r,o);rows.push(r);parent=r;
  };
  p.history.forEach(h=>{
    const st={y:h.year,apps:h.apps||0,goals:h.goals||0,assists:h.assists||0,cs:h.cs||0,conc:h.conc||0,rs:(h.avg||0)*(h.apps||0)};
    if(h.lg==='군 복무'){add('mil',{...st,mil:true,name:'현역 복무'},true);return}
    if(h.club==='무소속'){add('fa',{...st,fa:true,name:'무소속'},true);return}
    const r=resolve(h),name=r.ci!=null?teamName(r.ci,r.u21):(h.club||'').split(' → ').pop();
    add(`${r.ci==null?name:r.ci}|${r.u21?1:0}|${h.loan?1:0}`,{...st,ci:r.ci,u21:r.u21,loan:!!h.loan,name},!!h.loan||r.ci===SANGMU);
  });
  // 지금 뛰고 있는 팀 (이번 시즌 기록은 아직 시즌 기록에 들어가지 않았다)
  if(p.phase!=='retired'){
    const s=p.season,inS=p.phase==='round'&&s,y=p.phase==='round'||p.phase==='prep'?p.year:p.year+1;
    const st={y,apps:inS?s.apps:0,goals:inS?s.goals:0,assists:inS?s.assists:0,cs:inS?s.cs:0,conc:inS?(s.conc||0):0,rs:inS?s.ratingSum:0,now:true};
    if(p.fa)add('fa',{...st,fa:true,name:'무소속'},true);
    else add(`${p.club}|${p.u21?1:0}|${p.loan?1:0}`,{...st,ci:p.club,u21:!!p.u21,loan:!!p.loan,name:teamName(p.club,p.u21)},!!p.loan||p.club===SANGMU);
    // 임대·상무 중이면 원소속팀 계약도 아직 이어지고 있다
    if((p.loan||p.mil.st==='serving')&&parent&&!parent.loan){const home=p.loan?p.loan.club:p.mil.ret&&p.mil.ret.club;if(parent.ci===home){parent.y2=Math.max(parent.y2,y);parent.now=true}}
  }
  return rows;
}
function careerList(p){
  const rows=careerStints(p).map((r,i)=>({...r,i})).sort((a,b)=>b.y1-a.y1||b.i-a.i),gk=p.pos==='GK';
  const per=r=>r.y1===r.y2?(r.now?`${r.y1} - 지금`:`${r.y1}`):`${r.y1} - ${r.now?'지금':r.y2}`;

  const dock=G.screen==='game'&&G.tab==='season'&&G.dock,app=document.getElementById('app');

document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.k){G.det=G.det||{};G.det[d.dataset.k]=d.open;

const detOpen=(k,def)=>G.det&&k in G.det?G.det[k]:def;function act(a,v){

    case 'rehab':rehabChoice(p,v==='1');break;
    case 'nego-open':{const [w,i]=v.split(':'),o=(w==='winter'?p.winter:p.offers)[+i];o.negoOpen=!o.negoOpen;break}

    case 'confirm-no':G.confirm=null;break;
    case 'req-yes':G.confirm=null;requestTransfer(p);break;
    case 'strike-yes':G.confirm=null;goStrike(p);break;
    case 'strike-end':endStrike(p);break;
    case 'save-career':saveCareer(p,true);break;
    case 'discard-career':saveCareer(p,false);break;

    case 'loan-req':if(longInj(p)){p.note='장기 부상 재활 중에는 임대를 갈 수 없어요.';break}if(Math.random()<loanAccept(p)){const lo=loanOptions(p,3,'겨울 임대');if(lo.length)p.winter=lo;else p.note='임대 받아줄 팀을 찾지 못했어요.'}else{p.morale=clamp(p.morale-3,0,100);p.note='구단이 임대 요청을 거절했어요 · 사기 -3'}break;
    case 'cancel-new':G.confirmNew=false;break;
    case 'continue':G.screen='game';G.tab='season';break;
    case 'hof':G.screen='hof';G.toTop=true;if(sharedOn()&&G.rank.tab==='shared'&&!G.rank.rows&&!G.rank.loading)setTimeout(fetchRanking);break;
    case 'rank-tab':G.rank.tab=v;if(v==='shared'&&!G.rank.rows&&!G.rank.loading)setTimeout(fetchRanking);break;

    case 'acct':G.screen='acct';G.acct.mode=v==='signup'&&deviceId()?'login':v||'login';G.acct.err=null;G.toTop=true;break;
    case 'acct-go':acctSubmit(v);break;
    case 'acct-logout':clearTimeout(cloudTimer);G.auth=null;saveAuth();G.acct.saved=null;G.acct.mode='login';break;
    case 'acct-save':cloudSave();break;
    case 'acct-done':G.acct.newCode=null;if(needNick()){G.acct.mode='nick';G.screen='acct'}else G.screen='home';break;
    case 'nick-go':setNick();break;
    case 'friends':G.screen='friends';G.fr.view=null;G.fr.match=null;G.fr.msg=null;G.toTop=true;setTimeout(()=>loadFriends());break;
    case 'fr-req':friendReq();break;
    case 'fr-acc':friendAct('accept',v);break;
    case 'fr-del':friendAct('del',v);break;
    case 'fr-view':G.fr.view=v;G.fr.match=null;G.toTop=true;break;
    case 'fr-back':G.fr.view=null;G.fr.match=null;break;
    case 'fr-match':friendMatch(v);break;
    case 'acct-pick':{const c=G.acct.conflict;G.acct.conflict=null;if(c&&v==='cloud')applyData(c.data);if(needNick()){G.screen='acct';G.acct.mode='nick'}else G.screen='home';store();if(v!=='cloud')cloudSave();break}
    case 'form':G.b11.f=v;G.b11.sel=null;G.b11.match=null;if(G.hof.length)autoB11();break;
    case 'slot':G.b11.sel=G.b11.sel===v?null:v;break;
    case 'put':{const s=G.b11.slots;Object.keys(s).forEach(k=>{if(s[k]===v)delete s[k]});if(v)s[G.b11.sel]=v;else delete s[G.b11.sel];G.b11.sel=null;G.b11.match=null;break}
    case 'b11-auto':autoB11();break;
    case 'b11-clear':G.b11.slots={};G.b11.sel=null;G.b11.match=null;break;
    case 'friendly':friendly(+v);break;
    case 'dpos':if(v==='auto'){p.dposAuto=true;updateRole(p)}else{p.dposAuto=false;p.dpos=v}if(p.phase!=='retired'&&p.stage)p.role=roleFor(p,p.club,p.u21);break;
    case 'rand-name':c.name=c.heir?c.name.slice(0,1)+randomName().slice(1):randomName();break;
    case 'heir':{const sur=p.name.slice(0,1);c.heir=p.name;c.pos=pick(Object.keys(POS));c.type=pick(Object.keys(POS[c.pos].types));c.foot=p.foot;c.school=-1;c.name=sur+randomName().slice(1);c.num=p.num;c.cands=null;freshLuck(c);G.screen='create';G.toTop=true;break}
    case 'rand-num':c.num=randomNum(c.pos);break;
    case 'rand-all':if(c.challenge){c.name=randomName();break}c.pos=pick(G.unlock);c.type=pick(Object.keys(POS[c.pos].types));c.foot=pick(['오른발','오른발','왼발','양발']);c.school=pick([-1,...youthHs()]);c.name=c.heir?c.name.slice(0,1)+randomName().slice(1):randomName();c.num=randomNum(c.pos);if(c.cands)makeCands(c);break;
    case 'pos':if(!isUnlocked(v)||c.challenge)break;c.pos=v;c.type=Object.keys(POS[v].types)[0];if(c.cands)makeCands(c);break;
    case 'type':if(c.challenge)break;c.type=v;if(c.cands)makeCands(c);break;

    case 'gen':makeCands(c);break;
    case 'reroll':if(c.rerolls>0&&!c.challenge){c.rerolls--;c.seed=newSeed();makeCands(c)}break;
    case 'pick':{c.num=clamp(parseInt(c.num)||10,1,99);c.used=true;G.p=newPlayer(c,c.cands[+v]);if(c.challenge){G.p.challenge=c.challenge;c.challenge=null}G.train=[];G.screen='game';G.tab='season';G.toTop=true;break}
    case 'tab':G.tab=v;break;
    case 'ptab':G.ptab=v;break;
    case 'ttab':G.ttab=v;break;
    case 'goto-team':G.tab='player';G.ptab='status';G.toTop=true;break;
    case 'train':{const i=G.train.indexOf(v);if(i>=0)G.train.splice(i,1);else{G.train.push(v);if(G.train.length>2)G.train.shift()}break}

    case 'challenge-force':G.confirmNew=false;G.screen='create';c.heir=null;challengeSetup(c);G.toTop=true;break;

    case 'winter':{const o=p.winter&&p.winter[+v],sus=o&&o.kind!=='loan'&&!o.pre;winterMove(p,+v);
      if(sus){const ok=!o.blocked,dest=teamName(o.club,o.u21);reveal(`겨울 이적시장 · ${dest}`,ok,ok?`${dest} 이적 확정!`:'이적 무산',ok?`${o.fee?`이적료 ${money(o.fee)}원 · `:''}${wageTxt(o.salary)} · ${o.years}년 계약`:o.why)}
      break}
    case 'winter-stay':p.winter=null;if(!p.note||!p.note.includes('무산'))p.note='겨울 이적시장 · 잔류를 선택했습니다';break;
    case 'end':{if(p.moment)resolveMoment(p,ri(0,p.moment.opts.length-1));endSeason(p);G.toTop=true;const m=p.summary;if(m){
      (m.aw||[]).filter(x=>x.k==='team'&&!(p.season&&(p.season.finalWins||[]).some(n=>x.n===n+' 우승'))).forEach(x=>celebrate('🏆',`${x.n}!`,`${m.team} · ${p.year} 시즌`));
      (m.aw||[]).filter(x=>x.k!=='team').forEach(x=>celebrate('🏅',`${x.n} 수상!`,`${p.year} 시즌 · ${p.name}`));
      if(m.mv&&m.mv.my==='up')celebrate('⬆️','승격!',`${m.team}, 다음 시즌은 한 단계 위 리그에서 뛴다`,'up');

      if(p.phase!=='offseason')G.toTop=true;break}

  checkAch(G.p);
