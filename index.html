  {d:'2026.10.08 10:45',t:'국대 · 부상 · 피로 · 스카우트 조정',l:['국가대표 전력 상향 · 아시안컵 · 월드컵은 성적 좋은 3위도 토너먼트 진출','시즌 베팅은 가끔씩만 열려요','부상·재활 중에는 이벤트가 뜨지 않아요','35세 이후 큰 부상: 속도·민첩성·체력이 크게 떨어지고 재활로도 회복 안 됨','33세부터 피로가 더 빨리 쌓이고 늦게 풀려요 (35세부터 확실히 · 40세부터 해마다 더 가파르게)','스카우트 잠재력 더 정확하게 · 잠재력 등급 기준 조정','주간 챌린지 초기화 시각 표시 (매주 월요일 00시)','로그인 1시간 뒤 닉네임을 다시 정하라고 뜨던 문제 수정']},
  {d:'2026.10.08 02:30',t:'능력치 8개 · 커리어 베팅 · 베테랑',l:['능력치 8개: 피지컬 → 민첩성 · 체력으로 나누고 위치선정 추가 (골키퍼는 공중볼) · 역할별 OVR 비중 새로 정리','진행 중인 커리어는 OVR이 그대로 유지되도록 자동 변환','나이: 속도·민첩성·체력은 일찍 떨어지고 위치선정은 오래 유지','🎰 커리어 베팅: 새 커리어 시작 때 가끔 찬스 · 최대 30 LP · 은퇴 등급 B 1.25배 · A 2배 · S 3배 · S+ 5배','40세 이후: 잘 뛰면 소속팀 연장 · 같은 리그 · 하부 리그(유럽이면 K리그 복귀) 1년 제안 · 나이 한도 없음 (40세부터 신체 능력 급격히 하락)','🏆 랭킹 시즌 보상: 시즌 끝나면 1위 100 · 2위 50 · 3위 20 LP (여러 자리 차지하면 모두)','업적 추가: 철인의 마지막 춤 (42세 시즌 주전)','커리어 베팅은 시즌 결산 · 이적시장 화면(은퇴 버튼 위)에서 "지금 은퇴하면 몇 등급 · 몇 LP" 미리보기']},
  {d:'2026.10.08 02:30',t:'🎲 시즌 베팅',l:['시즌 첫 경기 전 LP를 걸고 이번 시즌 리그 골 · 도움 · 무실점 · 팀 최종 순위 맞히기','배당은 이번 시즌을 미리 600번 돌려 본 확률로 계산 · 항목마다 쉬움~대박 기준선','여러 항목 묶으면 배당 곱 (하나라도 틀리면 실패) · 3 / 5 / 10 / 20 LP · 최대 200 LP','시즌 중 진행 상황 실시간 표시 · 시즌 종료 때 자동 정산']},
  {d:'2026.10.08 01:01',t:'꾸미기 추가',l:['카드 테두리: 핑크 블라썸 추가 · 가격 정리 (골드 60 · 핑크 70 · 불꽃 80 · 홀로그램 120 · 클럽 컬러 180 · 레전드 다이아 300)','은퇴식 연출 3종 추가: 별빛 축제 · 머플러 응원 · 트로피 비','커리어를 명예의 전당에 저장하면 모두의 랭킹에도 자동 등록 · 로그인 없이 올린 기록은 (비로그인)으로 표시','설명 문구를 짧은 개조식으로 정리 · 게임 방법 최신 내용으로 다시 씀','이적 연출 문구 다양화 · 시즌 중 이적 루머가 검토 → 스카우트 파견 → 계약 임박 단계로 진전 (단계가 높을수록 실제 오퍼 확률↑)','휘장 조건 강화 (여행자 10곳 · K리그 18곳 · 유럽 15곳 · 5대 리그 각 2곳 · 변방 5개 리그 · 40곳 · 80곳) · 장착한 휘장이 내 화면 닉네임에도 보여요','내 선수 카드 맨 위에 커리어 카드 이미지 저장 버튼']},
  {d:'2026.10.08 00:09',t:'버그 수정 · 다음 상대 표시',l:['하단에 이번 4경기에서 만날 상대 팀이 보여요 (한 묶음 안에서는 같은 팀을 두 번 만나지 않아요)','LP 상점 소모품 가격 인하: 리롤권 2 · 스카우트권 3 · 특성 선택권 5 · 이중국적 10 · 유럽 유스 시작권 25 LP','주간 챌린지 보상: 챌린지 선수를 B등급 이상으로 은퇴시키면 하루 한 번 20 LP (받으면 알림이 떠요)','출석 체크: 홈 › 출석·보상에서 버튼을 누르면 하루 한 번 3 LP · 7일 연속마다 보너스 10 LP · 이번 주 출석 도장과 챌린지 보상 받은 날도 볼 수 있어요','운영자 공지에 포지션 해금 선물을 담을 수 있어요','S등급으로 은퇴하면 LP 뽑기: 10 · 15 · 20 · 30 LP 중 하나 (S+는 30 LP)','업적 25개 추가 (일반 6 · 중간 10 · 어려움 9) · 어려움 업적 LP 2 → 3 (이미 받은 것도 3으로)','카드 테두리·은퇴식 같은 영구 꾸미기는 가격을 올렸어요 (테두리 60~300 · 은퇴식 70~200 LP)','등번호 랜덤이 포지션 대표 번호만 나오던 문제 수정 (이제 1~99 골고루)','무소속일 때 지난 소속팀이 우승해도 트로피를 받던 버그 수정','2군·무소속이어도 시즌 결산 주요 수상에 1군 리그 MVP·득점왕·도움왕이 보여요','예전 명예의 전당 기록도 커리어 카드에 대표 트로피가 보여요']},
  {d:'2026.10.07 19:00',t:'국가대표 대회 · 커리어 카드 · 구단 도감',l:['월드컵·아시안컵·아시안게임·올림픽을 경기마다 직접 뛰어요: 조별리그 → 토너먼트, 접전엔 결정적 순간, 비기면 승부차기. 아시안게임 3·4위전은 결과만 바로 봐요. 대회 득점왕·MVP(월드컵 골든볼)도 있어요','발롱도르에 월드컵 성적이 조금 반영돼요 (발롱도르는 정말 압도적인 시즌이어야 받을 수 있어요). 시즌 결산에 올해의 주요 수상(발롱도르·리그 MVP·득점왕·도움왕 수상자)이 나와요','은퇴 화면·내 선수 카드에서 커리어 카드 이미지를 저장·공유할 수 있어요','30대에 몸이 예전 같지 않으면 감독이 포지션 전환을 제안해요 (윙어 → 측면 미드·윙백, 공미 → 레지스타, 수미 → 센터백 …)','이적은 루머 기사 → 구단 간 협상 → 서류·이사회 승인 순서로 진행돼요','LP 상점: 이중국적(유럽 워크퍼밋 불필요) · 유럽 유스 시작권(유럽 전체 구단 유스 중 뽑기 · 빅클럽 대박부터 변방 꽝까지)','유럽 리그 수준 조정: 변방 1부(에레디비시·포르투갈 67, 벨기에·튀르키예 65)를 챔피언십(66) 근처로 올리고, 다른 2부(2. 분데스 63 · 세군다 62 · 세리에 B · 리그 2 61)는 조금 낮췄어요','구단 도감: 뛰어 본 구단을 모으고, 휘장 장착 → 랭킹·친구 화면 닉네임 테두리 변경','S+ 조건: 빅클럽 주전 5시즌 이상으로 강화 · 5대 리그 개인상에 도움왕·올해의 포지션상도 포함 · 5대 리그 안에서도 위상 차(EPL > 세리에 A > 라리가 > 분데스 > 리그 1)']},
  {d:'2026.10.07 18:29',t:'등급 기준 상향 · 랭킹 점수 통일',l:['등급 기준을 조금 올렸어요: S+ 90 · S 80 · A 67 · B 52 · C 37 (다음 포지션 해금도 S 80점)','S+ 조건의 5대 리그 개인상에 도움왕·올해의 공격수·미드필더·수비수·골키퍼·최소실점 골키퍼도 들어가요 (합계 3회 이상)','랭킹 점수가 보는 사람마다 조금씩 다르게 계산되던 문제를 고쳤어요. 이제 누가 봐도 같은 점수·순위예요']},
  {d:'2026.10.07 16:30',t:'랭킹 시즌제 · 커리어 점수 재조정 · 선발(교체)',l:['모두의 랭킹은 3일마다 새 시즌. 1위는 금빛 왕관 테두리, 시즌 1위 기록을 올린 사람은 닉네임에 👑 휘장이 붙어요 (역대 랭킹도 볼 수 있어요)','커리어 점수: 개인상은 상 종류와 리그 수준에 따라 다르게, 같은 상을 반복하면 점점 덜 쳐줘요. 최상위는 압축돼서 100점은 나오지 않아요. 이미 올라간 기록도 새 기준으로 다시 계산해서 보여 줘요','2부 리그 팀은 컵대회 결승에 가기 어렵고, 결승 상대는 1부 팀이에요','출장 수를 선발(교체)로 표시해요 · 예) 12(4)','친구 베스트 11 대결이 문자 중계로 바뀌었어요: 전반 장면 → 하프타임에 공격적·균형·수비적 전술 선택 → 후반. 양쪽 선수 이름으로 골·선방·골대 장면이 나와요','커리어 점수는 85점 위로 곡선처럼 완만해져서 정말 엄청난 커리어만 99점대예요 (100점은 없음)']},
  {d:'2026.10.07 14:32',t:'현실성 점검 · 피로 · 유럽 진출 · 인지도',l:['피로: 노랑(50~69)은 가끔 몸이 무거운 날만 오고, 빨강(70+)은 모든 능력치가 일시적으로 2~5 떨어져요. 평점이 크게 깎이던 방식은 없앴어요','K리그에서 꾸준히 잘하면(평점 7.6+) 변방 유럽·유럽 2부 오퍼가 훨씬 자주 와요. K리그 구단도 유럽행은 대체로 보내 줘요','인지도는 리그 수준을 넘기 어려워요 (K리그는 스타급까지, 월드 스타는 유럽에서). A매치와 유럽에서 쌓은 명성은 일부 인정','잔류하면 팀 내 입지(벤치·로테이션·주전)가 그대로 이어지고, 프리시즌마다 한 단계씩만 바뀌어요','고정한 목표 역할은 포지션 변경 이벤트에서도 바뀌지 않아요 · 소화 가능 역할 수는 어떤 역할을 골라도 같아요','명예의 전당 카드 테두리가 랭킹과 친구 화면에서도 보여요. 친구 명예의 전당 선수를 누르면 카드가 열려요','업적 LP: 일반 0 · 중간 1 · 어려움 2','커리어 등급에 개인 수상이 따로 반영돼요 (팀 트로피 최대 20 + 개인 수상 최대 15). S+는 빅클럽 3시즌 외에도 발롱도르·야신상, 빅클럽 챔스 우승, 5대 리그 득점왕·MVP 3회로도 가능해요','베스트 11에 주발 표시 · 같은 팀에 두 번 따로 임대 가면 경력에 따로 표시 · 무소속일 때 입지 표시 숨김']},
  {d:'2026.10.07 13:37',t:'경력에 나라·리그 등급 · 역할 능력치 비중 조정',l:['커리어 › 경력에 팀마다 나라와 리그 등급이 보여요 (예: 한국 · K리그2(2부) → K리그1(1부))','이적시장 화면 아래에도 새 인생 시작 · 은퇴하기 버튼이 보이고, 버튼 배경을 진하게 바꿨어요','한 능력치에 몰려 있던 역할(스트라이커·레지스타·센터백 등)의 비중을 고르게 나눴어요. 이제 모든 역할에 중요한 능력치가 2개 이상 표시돼요']},
  {d:'2026.10.07 13:12',t:'개인상 개편 · 경쟁자와 겨루는 수상',l:['득점왕·도움왕·MVP는 리그 스타 선수들과 겨뤄요 (리그 경기 기록만). 스타는 시즌을 넘어 이어지고 성장·노쇠·은퇴·이적해요. 작년 득점왕이 또 경쟁자로 나오기도 하고, 새 얼굴이 터지기도 해요','새 상: 리그 올해의 공격수·미드필더·수비수·골키퍼, 챔스·유로파·컨퍼런스·ACL 득점왕·도움왕, 챔스·ACL 엘리트 올해의 포지션상, 야신상·게르트 뮐러상·코파 트로피','발롱도르는 5대 리그 선수만, 챔스 성적이 크게 반영돼요','시즌 결산에 수상 기록(골 수·2위)과 아깝게 놓친 상이 보이고, 트로피 탭 개인 수상은 세계·대륙대회·리그로 나눠 보여요']},
  {d:'2026.10.07 12:51',t:'역할 표시 간소화 · 화면 정리',l:['시즌 준비 화면에는 지금 역할 · 숙련도 별 · 배지만 보여요. 바꾸기는 선수 › 역할에서','숙련도는 1부 리그 시즌만 인정돼요','설명 글을 줄이고 글씨를 작게 해 한 화면에 더 많이 보여요','공지 선물을 받으면 운영자 목록에서 자동으로 빠져요']},
  {d:'2026.10.07 11:46',t:'역할 배지 · 유럽 리그 확장 · 포지션별 핵심 지표',l:['목표 역할을 골라요. 그 역할로 한 시즌 25경기 이상 · 평균 평점 7.4 이상이면 숙련도 +1, 3이 되면 역할 배지(16종)를 얻어요. 역할마다 따로 쌓여 여러 배지를 모을 수 있고, 장착은 하나만 해요','새 역할: 인사이드 포워드 · 레지스타','유럽 리그 5개 추가: 에레디비시 · 리가 포르투갈 · 벨기에 프로 리그 · 쉬페르 리그 · 스코티시 프리미어십. 유럽 오퍼는 실제 UEFA 리그 순위처럼, 높은 리그·빅클럽일수록 어렵고 변방 리그는 문이 넓지만 실력은 필요해요','유럽 오퍼에 필요한 평점 기준을 올렸어요. 꾸준히 잘해야(최근 두 시즌) 오퍼 확률이 커져요','시즌 기록에 포지션별 핵심 지표가 생겼어요: 공격수 유효슈팅 · 미드필더 키패스 · 수비수 결정적 수비 · 골키퍼 선방','변방 유럽 리그에서 꾸준히 잘하면 5대 리그 1부 구단이 데려가요 (잘할수록 확률이 커져요)','동계 훈련 추천은 하나만: 목표 역할에 중요한 능력치 중 지금 가장 약한 것','역할 화면 문구를 쉽게 바꿨어요: 자동(능력치에 맞춰 바뀜) / 고정(내가 고른 역할)','선수 만들기의 \'선수 유형\'이 \'시작 역할\'로 바뀌었어요. 고른 역할에 맞게 능력치가 나뉘고 그 역할로 시작해요','평점이 역할마다 다르게 매겨져요: 스트라이커는 골·유효슈팅, 윙어·윙백은 도움·키패스, 센터백은 결정적 수비가 크게 반영돼요','동계 훈련 추천은 역할의 대표 능력치 두 개 중 더 낮은 쪽이에요 (스트라이커 슈팅·속도, 타겟맨 피지컬·슈팅 …)','⏰ 마감일 깜짝 오퍼는 잔류를 고르는 순간 튀어나와요. 협상하면 3·2·1 결과 발표!','커리어 평가에 클럽 위상이 반영돼요. 빅클럽에서 주전급으로 뛴 시즌이 많을수록 가산되고, S+는 빅클럽에서 3시즌 이상 뛴 커리어만 받을 수 있어요','운영자 공지와 레전드 포인트 선물이 팝업으로 와요','대륙대회의 모든 팀에 엠블럼이 생겼어요','결정적 순간 연출이 10가지로 늘고, 결과 멘트도 훨씬 다양해졌어요','이벤트가 시즌마다 더 자주 일어나요','레전드 다이아 테두리는 S+ 커리어가 있어야 살 수 있어요','홈 화면에 공유 버튼이 있는 한 줄 안내를 넣었어요 (✕로 일주일 숨기기)']},  {d:'2026.10.07 11:08',t:'U23 선발 현실화 · 골키퍼 출전 · 결정적 순간 확장',l:['아시안게임·올림픽 U23 대표는 나이만으로 뽑히지 않아요. 실력·리그 수준·출전 시간·평점·인지도로 또래와 경쟁하고, 와일드카드는 A대표급이어야 해요. 실력이 안 되면 상무나 현역으로 가야 해요','병역 안내에 \'지금 실력이면 선발 가능성 높음/보통/낮음\'이 보여요','골키퍼는 주전이면 거의 매 경기 풀타임, 아니면 벤치예요. 교체 출전은 비상시에만 아주 가끔 있어요','결정적 순간 장면이 포지션마다 8~9가지로 늘었고, 최근 나온 장면은 한동안 다시 나오지 않아요']},  {d:'2026.10.07 10:58',t:'이적시장 화면 정리',l:['이적시장 화면에서 병역·면제 기회 안내를 오퍼 목록 아래로 옮기고, 한 줄로 접어 두었어요 (눌러서 펼치기)','지원할 수 없는 상무 카드는 목록 맨 아래로 내렸어요']},  {d:'2026.10.07 10:53',t:'LP 절반 정산 · 은퇴식 가격 · 화면 다듬기',l:['상점이 생기기 전 기록으로 받은 LP는 절반만 남겼어요. 앞으로 은퇴·업적으로 얻는 LP는 그대로 받아요','은퇴식 연출 가격을 조금 올렸어요: 꽃가루 40 · 기립박수 55 · 불꽃놀이 75 · 영구결번 110','리롤권·특성 선택권 버튼, 특성 고르기 칸, 후보 선수 카드, 홈 메뉴 등 너무 큰 칸과 글자를 줄였어요']},  {d:'2026.10.07 10:44',t:'레전드 포인트 기준 조정',l:['은퇴 LP: C 2 · B 3 · A 5 · S 10 · S+ 30, D는 0 (빨리 은퇴하는 반복으로 모을 수 없게) · 업적 LP: 일반 1 · 중간 2 · 어려움 3','가격을 올렸어요: 리롤권 3 · 스카우트권 5 · 특성 선택권 8 · 카드 테두리 30~150 · 은퇴식 40~110 (꾸미기는 여러 커리어를 모아야 살 수 있어요)','상점이 생기기 전의 기록으로 받은 LP는 절반만 남겼어요. 앞으로 은퇴·업적으로 얻는 LP는 그대로 받아요','이미 받은 LP도 새 기준으로 다시 계산했어요']},  {d:'2026.10.07 10:36',t:'레전드 상점',l:['은퇴 등급(D 1 · C 2 · B 4 · A 7 · S 12 · S+ 20)과 업적(일반 1 · 중간 2 · 어려움 5)으로 레전드 포인트(LP)가 쌓여요. 지금까지의 명예의 전당·업적만큼 한 번 소급해서 드렸어요','🎲 리롤권: 능력치 다시 돌리기 +1회 · 🔍 스카우트권: 후보 3명 중 1명의 최소 잠재력 등급(S·A·B·C·D)을 확인 · 🎭 특성 선택권: 새 선수의 시작 특성을 직접 골라요','명예의 전당 카드 테두리(골드 · 클럽 컬러 · 불꽃 · 홀로그램 · 레전드 다이아)와 은퇴식 연출(꽃가루 · 기립박수 · 불꽃놀이 · 영구결번)을 사서 장착할 수 있어요','LP와 산 물건도 로그인하면 기기끼리 합쳐져요. 주간 챌린지에서는 상점 아이템을 쓸 수 없어요','업데이트 노트는 홈 화면 맨 아래 줄로 옮겼어요']},  {d:'2026.10.07 10:23',t:'숨은 시작 특성 7종',l:['일부 선수는 숨은 특성을 하나 갖고 태어나요. 화면에는 보이지 않고 은퇴할 때 공개돼요','🧬 노익장(하락이 늦고 완만 · 대신 23세까지 성장 조금 느림) · 🔋 강철 체력(피로 덜 쌓임 · 대신 경기 감각이 천천히 오름) · 🔥 빅매치 강심장(빅매치·토너먼트·결승에 강함 · 대신 평범한 경기 집중력 소폭↓)','🌟 스타성(인지도 빨리 오름 · 대신 비판도 크게) · 🏋️ 연습벌레(동계 훈련 효과↑ · 대신 휴식 요청 시 사기↓) · ❤️ 원클럽 DNA(오래 있을수록 케미·감독 신뢰↑ · 대신 이적하면 적응 느림) · ✈️ 해외 체질(유럽 적응 빠름 · 대신 국내 인기는 천천히)']},  {d:'2026.10.07 10:05',t:'같은 선수 중복 진행 수정',l:['다른 기기 선수를 이어하기로 가져온 뒤에도 같은 선수가 목록에 또 떠서 두 갈래로 진행되던 문제를 고쳤어요','같은 선수(이름·등번호·포지션·나이)는 하나로 합치고, 더 많이 진행한 쪽으로 이어가요']},  {d:'2026.10.07 09:53',t:'동기화 강화 · 내 선수 커리어 카드 · 새 랜덤 요소',l:['기기마다 다른 선수를 키워도 클라우드에 모두 남아요. 다른 기기에서 진행 중인 선수는 홈·계정 화면에서 \'이어하기\'로 바로 이어갈 수 있어요','명예의 전당·업적·해금은 기기끼리 자동으로 합쳐지고, 계정 화면의 \'지금 저장 · 동기화\'를 누르면 바로 맞추고 \'저장했습니다\'가 떠요','예전 버전이 휴대폰에 남아 있으면 홈에 \'새 버전이 나왔어요\' 버튼이 떠요','내 선수들: 선수를 누르면 은퇴 카드처럼 경력·트로피 진열장(대회별 횟수·연도)·은퇴 후 이야기를 볼 수 있어요','⏰ 이적시장 마감일 깜짝 오퍼: 드물게 한 단계 위 구단이 웃돈을 들고 막판에 뛰어들어요','🌧️ 날씨·원정: 가끔 폭우·폭설·무더위·강풍 경기가 있고, AFC 장거리 원정은 더 지쳐요','💸 구단 위기: 아주 가끔 재정난(주급 삭감 요청)이나 새 구단주 인수(팀 전력 상승) 소식이 있어요','👔 성적이 바닥이면 시즌 중 감독이 경질되고, 성향이 다른 새 감독이 와서 입지가 다시 정해져요']},  {d:'2026.10.07 09:37',t:'기기 간 동기화 · 몸값 현실화 · 결승 일정',l:['로그인하면 컴퓨터·폰 기록이 서로 덮어쓰지 않고 합쳐져요: 명예의 전당·업적·포지션 해금은 두 기기 것을 모두 남기고, 진행 중인 선수는 더 최근에 플레이한 쪽을 써요. 앱을 열거나 다시 볼 때마다 자동으로 맞춰요','한 번에 진행하는 4경기에 대륙대회 경기가 포함돼요 (예: 리그 3경기 + UEL 1경기)','대륙대회·컵대회 결승은 실제처럼 리그 일정이 모두 끝난 뒤에 치러요. 토너먼트 일정도 실제처럼 뒤로 옮겼어요','몸값이 실제 이적시장처럼 최상위로 갈수록 가파르게 올라요. 월드클래스는 700억~1,000억대도 (아주 드물게) 가능하고, 돈 많은 빅클럽은 가끔 웃돈을 얹어 영입해요','결정적 순간에 어떤 경기인지(리그 몇 라운드 · 대륙대회 단계 · 결승) 표시되고, 선택지 버튼 색이 모두 같아졌어요','병역 정보에 앞으로 열리는 아시안게임·올림픽이 몇 년 뒤인지, 그때 나이로 U23·와일드카드 중 어떻게 나갈 수 있는지 보여요','명예의 전당: 모두의 랭킹 · 주간 챌린지 · 내 선수들 탭, 선수마다 트로피·개인 수상 전체 목록','은퇴 하이라이트의 \'최고의 팀\'에 2군(U21) 기간은 나오지 않아요','새 이벤트 16개: 예능 섭외, 개인 트레이너, 훈련장 말다툼, 축구화 스폰서, 전술 실험, 열애설, 판정 논란, 라이벌 도발, 멘탈 코치, 단독 인터뷰 등','몸값 업적 기준을 새 몸값에 맞게 올렸어요 (500억 · 1,000억 사나이, 이적료 300억)']},  {d:'2026.10.07 00:59',t:'평균 평점 소수 둘째 자리 · 피드백',l:['시즌·통산 평균 평점이 7.36처럼 소수 둘째 자리까지 보여요 (경기 평점은 그대로 첫째 자리)','피드백은 로그인한 뒤에 보낼 수 있어요 (보낸 사람 닉네임이 함께 전달돼요)']},  {d:'2026.10.07 00:34',t:'은퇴·새 인생 버튼 위치',l:['시즌 화면 아래의 은퇴하기 · 새 인생 시작 버튼은 시즌 결산 화면에서만 보여요','홈 화면의 새 인생 시작 · 주간 챌린지는 언제든 쓸 수 있어요']},  {d:'2026.10.07 00:21',t:'평점 기준 조정 · 골키퍼 선방',l:['평점이 실제 축구처럼 바뀌었어요: 무난한 경기 6.6~6.8, 무실점이나 1골·1도움이면 7.1~7.4, 공격 포인트·결정적 수비·선방이 쌓일수록 더 올라가요','골키퍼는 경기마다 선방 수가 기록되고 평점에 반영돼요 (지난 경기 목록에 🧤 선방 표시)','평점이 올라간 만큼 재계약 제안 등 평점 기준도 함께 올렸어요 (구단 재계약 제안은 최근 평점 7.4 이상)','이적·상무 결과 카운트다운 중에는 뒤 화면이 가려져서 결과가 미리 보이지 않아요']},  {d:'2026.10.07 00:09',t:'대륙대회 · 다양한 기사 · 큰 순간 연출',l:['UCL·UEL·UECL·ACLE·ACL2를 실제로 치러요. 조 추첨(포트·같은 리그 회피) → 조별리그 6경기 → 16강(AFC는 8강)부터 홈·원정 토너먼트 → 결승','대륙대회 경기는 주중에 리그 사이사이 열리고, 시즌 기록과 피로에 더해져요. 조별 탈락·토너먼트 결과가 소식에 떠요','순위 탭에 대륙대회 탭이 생겼어요: 조별 순위표 · 토너먼트 추첨 결과와 합계 스코어','순위표에 승·무·패가 보여요 (게임 안에서 실제로 치른 경기 기록)','2군 리그 순위표에 대륙대회·강등 구역이 잘못 표시되던 문제를 고쳤어요','언론·라이벌 기사가 훨씬 다양해졌어요: 멀티골·결승골·연속골·골 가뭄·인터뷰·칼럼·순위 기사 등, 가상의 매체 이름과 함께','결정적 순간이 포지션마다 여러 상황으로 나오고, 선택지 4개가 매번 다른 조합으로 나와요','해트트릭은 축구공이 날아오고 세레머니가 보이고, 결정적 골·선방, 승격·강등에도 연출이 생겼어요','이적·상무 지원·재계약·임대 요청은 3·2·1 카운트다운 뒤 결과를 알려 줘요','구단이 이적을 막을 때 이유를 알려 줘요 (이적료 부족, 감독의 잔류 요청, 시즌 중 전력 공백 등)','활약이 좋으면 가끔 소속팀이 먼저 주급·계약 기간을 올린 재계약을 제안해요','골키퍼 평점은 무실점·실점, 수비수 평점은 수비 경기력·무실점에 더 크게 움직이고, 골·도움 비중은 조금 줄었어요','중간 난이도 업적 23개가 추가됐어요']},  {d:'2026.10.06 23:13',t:'짧은 부상 · 직접 만든 학교',l:['부상이 이번 묶음 안에 끝나면 넘어가기만 뜨지 않고 평소처럼 경기 방식을 고를 수 있어요 (복귀 후 경기에 반영)','연승·연패 때 배경색이 바뀌던 효과를 없앴어요 (화면 안 표시는 그대로)','출신 고교에서 ✏️ 직접 입력을 고르면 원하는 이름의 일반고로 시작해요 (모구단·우선지명 없음)','유스 고교 이름은 원래대로 고정돼요']},
  {d:'2026.10.06 23:08',t:'유스 고교 추가 · 더 촘촘한 화면',l:['부산(개성고)·전남(광양제철고)·대구(현풍고)·대전(충남기계공고)·광주(금호고)·강원(강릉제일고)·경남(진주고)·안양(안양공고) 유스 고교가 생겼어요','유스가 없는 일반 고교는 없어졌어요','출신 고교 이름을 직접 정할 수 있어요 (비우면 원래 이름)','글자와 여백을 한 번 더 줄여 시즌 화면이 한 화면에 들어와요','새 인생 시작 · 은퇴하기 버튼을 작게 정리했어요']},
  {d:'2026.10.06 22:50',t:'결정적 순간',l:['빅매치(접전)와 결승전에 출전하면 경기 막판 결정적 순간을 직접 골라요','공격수는 슈팅 방향, 미드필더는 패스할 동료, 수비수는 막는 방법, 골키퍼는 페널티킥 방향을 골라요','성공 확률은 보이지 않고 장면마다 달라요. 상대 골키퍼·수비의 대응과 내 능력치에 따라 정해져요','성공하면 골·도움·선방이 실제 스코어와 평점에 반영되고, 결승 우승에도 영향을 줘요']},
  {d:'2026.10.06 22:40',t:'유럽대항전 · 구단 대표 색 · 촘촘한 화면',l:['UCL·UEL·UECL이 생겼어요. 지난 시즌 리그 순위로 출전권이 정해져요 (잉글랜드·스페인·독일·이탈리아 1~4위 UCL, 5~6위 UEL, 7위 UECL / 프랑스 1~4위 UCL, 5위 UEL, 6위 UECL)','K리그1은 1~2위 ACLE, 3위 ACL2에 나가요','대륙대회 결승은 실제로 출전 중인 대회에서만 오를 수 있어요','오퍼 카드에 그 팀이 나가는 대륙대회와 순위가 보여요','대륙대회에 나가는 시즌에는 시즌 시작 전에 알려 줘요','순위표에 대륙대회 출전권 구역이 표시돼요','구단 엠블럼이 실제 대표 색을 쓰고, 모양도 구단마다 다양해졌어요','팀 배경이 구단 대표 색으로 은은하게 바뀌어요','화면 전체를 더 촘촘하게 정리해 스크롤을 줄였어요']},
  {d:'2026.10.06 22:26',t:'대규모 개선 · 업적 확장 · 랭킹 카드',l:['부상 중에는 넘어가기 버튼만 나오고, 스카우트·빅매치 알림도 뜨지 않아요','시즌이 끝날 때 부상이 조금만 남았으면 비시즌 동안 회복돼요','유스 모구단이 입단 제안을 안 했으면 다른 팀 이적을 막지 않아요','보스만 사전 계약은 시즌이 끝나면 협상 없이 바로 이적해요','K리그에서 몇 시즌 꾸준히 활약하면 유럽 오퍼가 더 잘 와요. 32세까지 유럽 막차를 탈 수 있어요','나이가 들어도 잘 녹슬지 않는 숨은 특성이 생겼어요 (은퇴할 때 공개)','유럽 구단 2군에서는 성장이 더 잘 돼요','2군에서 임대 가서 활약하면 1군 기회를 얻고, 1군에서 못 뛰면 다시 2군으로 내려가요','선수 유형마다 달랐던 시작 OVR을 비슷하게 맞췄어요','우승·수상·승격하면 축하 화면이 떠요','팀 색깔 배경, 연승 불꽃 효과, 연패·강등·승격 분위기 효과','지난 경기 기록을 모든 경기 같은 양식으로 정리했어요','경기 화면 맨 아래에 새 인생 시작·은퇴하기 버튼','은퇴 기록에 골·도움(골키퍼는 무실점·실점)·평균 평점, 팀 트로피와 개인 수상을 나눠 표시','업적이 크게 늘었어요. 어려운 업적도 있어요','모두의 랭킹은 10위까지, 누르면 그 선수의 커리어 카드와 등록한 사람 닉네임이 보여요']},
  {d:'2026.10.06 16:27',t:'동계 훈련 개선',l:['동계 훈련이 잠재력에 덜 묶여요. 잠재력에 가까워도 훈련 효과가 거의 사라지지 않아요','23세까지는 고른 능력치가 최소 1은 올라요','시즌 중 성장은 그대로 잠재력과 성장 유형의 영향을 받아요']},

/* ---------- 피드백 ----------
   누구나 보낼 수 있다(로그인하면 내 계정으로 기록). 관리자 계정(googarden)은 모든 피드백을 본다 */
const ADMIN_ID='googarden';
const isAdmin=()=>!!(G.auth&&G.auth.name===ADMIN_ID);
G.fb={cat:'idea',text:'',busy:false,msg:null,err:null,mine:null,all:null};
const FB_CAT={bug:'🐞 버그',idea:'💡 제안',etc:'💬 기타'};
async function fbSend(){
  const F=G.fb,body=F.text.trim();F.msg=null;F.err=null;
  if(body.length<2){F.err='내용을 2자 이상 적어 주세요.';return render()}
  if(body.length>1000){F.err='1000자 이하로 적어 주세요.';return render()}
  if(!G.auth){F.err='로그인한 뒤에 보낼 수 있어요. 오른쪽 위 로그인 버튼을 눌러 주세요.';return render()}
  F.busy=true;render();
  try{
    const t=G.auth?await authToken():null,h={apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'};if(t)h.Authorization='Bearer '+t;
    const r=await fetch(`${SUPABASE_URL}/rest/v1/feedback`,{method:'POST',headers:h,body:JSON.stringify({user_id:t?G.auth.uid:null,nickname:G.auth?(G.auth.nick||G.auth.name):null,category:F.cat,body,version:UPDATES[0].d})});
    if(r.status===404)throw new Error('notable');
    if(!r.ok)throw new Error('HTTP '+r.status);
    F.text='';F.msg='고마워요! 피드백이 전달됐어요.';F.mine=null;if(G.auth)fbLoad();
  }catch(e){F.err=e.message==='notable'?'피드백 기능이 아직 준비되지 않았어요. (관리자가 피드백용 SQL을 실행해야 해요)':'보내지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'}
  F.busy=false;render();
}

   관리자(googarden)가 특정 닉네임 또는 전체에게 공지와 레전드 포인트 선물을 보낸다.
   받는 쪽은 게임을 열 때 팝업으로 보고, 선물 LP는 장부에 한 번만 기록된다 */
const NSEEN='kickoff-life-notice-seen';
G.noticeQ=[];G.nt={nick:'',title:'',body:'',lp:'',msg:null,err:null,busy:false,list:null};
async function noticeCheck(){
  if(!sharedOn())return;
  try{
    let rows;
    if(G.auth)rows=await rest('notices?select=*&order=id.desc&limit=30');
    else{const r=await fetch(`${SUPABASE_URL}/rest/v1/notices?select=id,created_at,title,body,lp,sender&target_uid=is.null&order=id.desc&limit=10`,{headers:sbHeaders()});if(!r.ok)return;rows=await r.json()}
    rows=(rows||[]).filter(x=>!x.read_at);   // 받는 사람이 이미 확인한 개인 공지는 다른 기기에서도 다시 뜨지 않게
    if(isAdmin())rows=rows.filter(x=>!x.target_uid||x.target_uid===G.auth.uid);   // 관리자는 남에게 보낸 공지가 팝업으로 뜨지 않게
    const seen=load(NSEEN,[]),fresh=rows.filter(x=>!seen.includes(x.id)&&!G.noticeQ.some(q=>q.id===x.id)).reverse();
    if(fresh.length){G.noticeQ.push(...fresh);render()}
  }catch(e){}
}
function noticeOk(){
  const n=G.noticeQ.shift();if(!n)return;
  try{const seen=load(NSEEN,[]);seen.push(n.id);localStorage.setItem(NSEEN,JSON.stringify(seen.slice(-200)))}catch(e){}
  if(n.lp>0){const got=lpEarn('n:'+n.id,n.lp);lpSave();if(got)toast(`🎁 레전드 포인트 +${got} LP를 받았어요!`)}
  // 포지션 해금 선물: 그 포지션까지 순서대로 모두 연다 (관리자만 보낼 수 있는 공지에만 들어 있다)
  const ul=ntUnlock(n);if(ul){const upto=UNLOCK_ORDER.slice(0,UNLOCK_ORDER.indexOf(ul)+1),before=G.unlock.length;G.unlock=UNLOCK_ORDER.filter(k=>upto.includes(k)||G.unlock.includes(k));syncUnlock();
    if(G.unlock.length>before)celebrate('🔓',`${POS[ul].name}까지 해금!`,'운영자 선물 · 새 선수를 만들 때 고를 수 있어요','goal')}
  // 개인 공지는 확인했다고 서버에 남긴다 → 관리자 목록에서 빠진다
  if(n.target_uid&&G.auth&&n.target_uid===G.auth.uid)rest(`notices?id=eq.${+n.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({read_at:new Date().toISOString()})}).catch(()=>{});
}
// 공지 본문 끝의 [[unlock:GK]] 표시 = 포지션 해금 선물 (화면에는 표시하지 않는다)
const ntUnlock=n=>{const m=/\[\[unlock:(MF|DF|GK)\]\]/.exec(n.body||'');return m?m[1]:null};
const ntBody=n=>(n.body||'').replace(/\s*\[\[unlock:(MF|DF|GK)\]\]/,'');

}

async function fbLoad(){
  if(!G.auth)return;
  try{
    G.fb.mine=await rest(`feedback?select=id,created_at,category,body&user_id=eq.${G.auth.uid}&order=created_at.desc&limit=20`)||[];
    if(isAdmin()){const all=await rest('feedback?select=id,created_at,user_id,nickname,category,body,version&order=created_at.desc&limit=200')||[];
      // 닉네임이 비어 있는 피드백은 보낸 계정의 닉네임을 찾아 붙인다

async function changePw(){
  const a=G.acct;a.err=null;a.msg=null;
  if(a.pw.length<6){a.err='새 비밀번호는 6자 이상이어야 해요.';return render()}
  if(a.pw!==a.pw2){a.err='비밀번호 확인이 일치하지 않아요.';return render()}
  a.busy=true;render();
  try{const t=await authToken();const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({password:a.pw})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw j}
    a.msg='비밀번호를 바꿨어요. 다음 로그인부터 새 비밀번호를 쓰세요.';a.mode='me';a.pw='';a.pw2=''}
  catch(e){a.err=/same/i.test((e&&(e.msg||e.message))||'')?'지금 쓰는 비밀번호와 같아요.':'바꾸지 못했어요. 다시 로그인한 뒤 시도해 주세요.'}
  a.busy=false;render();
}

  if(o.kind==='raise')return card('현 소속팀','재계약 협상 (주급 인상)',o.done||o.blocked?`<b style="color:${o.done?'var(--pitch)':'var(--red)'}">${esc(o.why)}</b>`:`지금 ${wageTxt(p.contract.salary)} · 계약 ${p.contract.years}년 남음. 활약을 근거로 주급을 올린 새 계약을 요구합니다(${p.age<=23?'4~5년':p.age<=29?'2~5년':'1~3년'}). 거절당하면 사기가 떨어져요.`,b(o.done?'완료':o.blocked?'거절됨':'요청하기','alt',o.blocked),o.blocked&&!o.done?'blocked':'');
  if(o.kind==='army')return card(`병역 · ${o.forced?'입대 기한':'조기 입대'}`,'현역 입대','2시즌 공백 · 지구력 소폭↑ · 기술 소폭↓',b('입대','alt'));

    +(canCl?`<button class="sbtn alt" data-act="clause-open" data-v="${act}:${i}">조항 요구</button>`:'')+(o.clOpen&&canCl?`<div class="nego">${CLAUSE.map((C,k)=>clauseOk(p,o,k)?`<button class="sbtn alt" data-act="clause" data-v="${act}:${i}:${k}"><b>${C.n}</b><span>성공 ${oddWord(clauseOdds(p,o,k))}<br>${k===0?'첫 시즌 주전 출발':(o.clause?'금액 낮추기':'조항 넣기')+' · 나중에 더 큰 구단이 오면 못 막아요'} · 철회 위험</span></button>`:'').join('')}</div>`:''),o.blocked?'blocked':'',o.club);

function newsHtml(news){

/* 경력: 같은 팀에서 뛴 기간을 한 줄로 묶는다 (FotMob 경력 화면처럼).
   임대·상무·현역 복무·무소속은 따로 한 줄이 되고, 그동안에도 원소속팀 기간은 끊기지 않는다
   (대구 27 → 안양 임대 28 → 대구 29 이면 '대구 2027 - 2029' + '안양 (임대) 2028') */
function careerStints(p){
  const rows=[];let parent=null;
  // 예전 기록에는 구단 번호가 없어서 이름으로 찾는다
  const resolve=h=>{
    if(h.ci!=null)return {ci:h.ci,u21:!!h.u21};
    const nm=(h.club||'').split(' → ').pop();
    for(let i=0;i<CLUBS.length;i++){if(teamName(i,false)===nm)return {ci:i,u21:false};if(teamName(i,true)===nm)return {ci:i,u21:true}}
    return {ci:null,u21:false};
  };
  const mk=(key,o)=>({key,ci:o.ci,u21:o.u21,loan:o.loan,mil:o.mil,fa:o.fa,name:o.name,y1:o.y,y2:o.y,apps:0,subs:0,goals:0,assists:0,cs:0,conc:0,rs:0,now:false,lgs:[]});
  const addTo=(r,o)=>{if(o.lg&&!r.lgs.includes(o.lg))r.lgs.push(o.lg);r.y2=Math.max(r.y2,o.y);r.apps+=o.apps;r.subs+=o.subs||0;r.goals+=o.goals;r.assists+=o.assists;r.cs+=o.cs;r.conc+=o.conc;r.rs+=o.rs;if(o.now)r.now=true};
  const add=(key,o,interim)=>{
    // 임대는 연속 시즌일 때만 한 줄 (2029·2031에 따로 임대 가면 두 줄)
    if(interim){const last=rows[rows.length-1];if(last&&last.key===key&&last.y2>=o.y-1){addTo(last,o);return}const r=mk(key,o);addTo(r,o);rows.push(r);return}
    if(parent&&parent.key===key){addTo(parent,o);return}
    const r=mk(key,o);addTo(r,o);rows.push(r);parent=r;
  };
  // 시즌 중 옮긴 경우: 옮기기 전 기록(pre)은 원래 팀 몫으로 떼어 낸다
  const addPre=(pr,y)=>{const pst={y,lg:pr.lg,apps:pr.apps,subs:pr.subs||0,goals:pr.goals,assists:pr.assists,cs:pr.cs,conc:pr.conc||0,rs:pr.rs};
    if(pr.fa)add('fa',{...pst,fa:true,name:'무소속'},true);else add(`${pr.ci}|${pr.u21?1:0}|${pr.loan?1:0}`,{...pst,ci:pr.ci,u21:pr.u21,loan:pr.loan,name:pr.name},!!pr.loan||pr.ci===SANGMU);return pst};
  const minus=(a,b)=>({...a,apps:a.apps-b.apps,subs:a.subs-b.subs,goals:a.goals-b.goals,assists:a.assists-b.assists,cs:a.cs-b.cs,conc:a.conc-b.conc,rs:a.rs-b.rs});
  p.history.forEach(h=>{
    let st={y:h.year,lg:h.lg,apps:h.apps||0,subs:h.subs||0,goals:h.goals||0,assists:h.assists||0,cs:h.cs||0,conc:h.conc||0,rs:(h.avg||0)*(h.apps||0)};
    if(h.pre&&h.lg!=='군 복무')st=minus(st,addPre(h.pre,h.year));
    if(h.lg==='군 복무'){add('mil',{...st,mil:true,name:'현역 복무'},true);return}
    if(h.club==='무소속'){add('fa',{...st,fa:true,name:'무소속'},true);return}
    const r=resolve(h),name=r.ci!=null?teamName(r.ci,r.u21):(h.club||'').split(' → ').pop();
    add(`${r.ci==null?name:r.ci}|${r.u21?1:0}|${h.loan?1:0}`,{...st,ci:r.ci,u21:r.u21,loan:!!h.loan,name},!!h.loan||r.ci===SANGMU);
  });
  // 지금 뛰고 있는 팀 (이번 시즌 기록은 아직 시즌 기록에 들어가지 않았다)
  if(p.phase!=='retired'){
    const s=p.season,inS=p.phase==='round'&&s,y=p.phase==='round'||p.phase==='prep'?p.year:p.year+1;
    let st={y,lg:p.fa?null:curLg(p).name,apps:inS?s.apps:0,subs:inS?(s.subs||0):0,goals:inS?s.goals:0,assists:inS?s.assists:0,cs:inS?s.cs:0,conc:inS?(s.conc||0):0,rs:inS?s.ratingSum:0,now:true};
    if(inS&&s.pre)st=minus(st,addPre(s.pre,y));
    if(p.fa)add('fa',{...st,fa:true,name:'무소속'},true);
    else add(`${p.club}|${p.u21?1:0}|${p.loan?1:0}`,{...st,ci:p.club,u21:!!p.u21,loan:!!p.loan,name:teamName(p.club,p.u21)},!!p.loan||p.club===SANGMU);
    // 임대·상무 중이면 원소속팀 계약도 아직 이어지고 있다
    if((p.loan||p.mil.st==='serving')&&parent&&!parent.loan){const home=p.loan?p.loan.club:p.mil.ret&&p.mil.ret.club;if(parent.ci===home){parent.y2=Math.max(parent.y2,y);parent.now=true}}
  }
  return rows;
}

    case 'opt-sound':G.opt.sound=G.opt.sound===false;optSave();if(G.opt.sound)sfx('goal');break;
    case 'opt-stealth':G.opt.stealth=!G.opt.stealth;G.boss=false;optSave();toast(G.opt.stealth?'몰래 모드 켬 · 왼쪽 작은 탭(PC는 Esc)을 누르면 업무 화면으로 숨겨요':'몰래 모드 끔');break;
    case 'opt-sto':G.opt.sto=((G.opt.sto??1)+1)%3;optSave();break;
    case 'boss':G.boss=!G.boss;applyStealth();return;
    case 'opt-bet':G.opt.bet=!optBet();optSave();toast(optBet()?'베팅 찬스 표시 켬':'베팅 찬스 표시 끔 · 이미 건 베팅은 그대로 진행');break;
    case 'bet-adm':if(isAdmin())betAdminLoad();break;
    case 'cbet':cbetPlace(p,v);break;
    case 'cbet-skip':if(p&&p.cbet)p.cbet.offer=false;break;
    case 'card-img':setTimeout(()=>cardOpen(v));break;
    case 'card-share':setTimeout(cardShare);break;
    case 'card-save':cardSave();break;
    case 'card-close':G.cardImg=null;break;
    case 'dex-eq':G.dex.eq=v||null;dexSave();break;
    case 'lp-buy':lpBuy(v);break;
    case 'lp-eq':{const [g,k]=v.split(':');G.lp.eq[g]=k||null;lpSave();break}
    case 'use-reroll':if(!c.challenge&&lpUse('reroll')){c.rerolls++;toast('리롤권을 썼어요 (+1회)')}break;
    case 'scout':if(!c.challenge&&c.cands&&!(c.scout&&c.scout[v]!=null)&&lpUse('scout')){c.scout=c.scout||{};c.scout[v]=potFloor(c.cands[+v])}break;
    case 'use-dual':if(!c.challenge&&lpItem('dual')>0)c.useDual=!c.useDual;break;
    case 'use-euy':if(!c.challenge&&lpItem('euy')>0)c.useEuY=!c.useEuY;break;
    case 'trait-open':if(!c.challenge&&(c.traitPaid||lpItem('trait')>0))c.traitOpen=!c.traitOpen;break;
    case 'trait-pick':if(!c.challenge){if(!c.traitPaid){if(!lpUse('trait'))break;c.traitPaid=true}c.forceTrait=v;c.traitOpen=false}break;
    case 'feedback':G.screen='feedback';G.fb.msg=null;G.fb.err=null;G.toTop=true;if(sharedOn()&&G.auth)setTimeout(fbLoad);if(isAdmin())setTimeout(noticeList);break;
    case 'fb-cat':G.fb.cat=v;break;
    case 'fb-send':if(sharedOn())fbSend();break;
    case 'fb-reload':fbLoad();break;
    case 'fb-del':fbDelete(v);break;
    case 'pw-go':changePw();break;
    case 'after':if(p&&p.final&&!p.final.after){p.final.after=v;p.final.afterTxt=afterText(p,v)}break;
    case 'challenge':if(p&&p.phase!=='retired'&&!G.confirmNew){G.screen='home';G.confirmNew='ch';break}
    // falls through
    case 'challenge-force':G.confirmNew=false;G.screen='create';c.heir=null;challengeSetup(c);G.toTop=true;break;
    case 'event':{const e=EVENTS[p.event];p.note=`${e.t} · ${e.o[+v][1](p)}`;p.fatigue=Math.max(0,p.fatigue);p.event=null;chainPush(p,e,+v);break}
    case 'winter':{const o=p.winter&&p.winter[+v],sus=o&&o.kind!=='loan'&&!o.pre;winterMove(p,+v);
      if(sus){const ok=!o.blocked,dest=teamName(o.club,o.u21);reveal(`겨울 이적시장 · ${dest}`,ok,ok?`${dest} 이적 확정!`:'이적 무산',ok?xferTerms(o):o.why,xferSteps(p,o,ok))}
      break}
    case 'winter-stay':if(p.dlWinter&&!G.dlPop){G.dlPop='winter';break}p.dlWinter=null;p.winter=null;if(!p.note||!p.note.includes('무산'))p.note='겨울 이적시장 · 잔류를 선택했습니다';break;
    case 'end':{if(p.moment)resolveMoment(p,ri(0,p.moment.opts.length-1));if(p.nat)break;if(natPending(p)){natStart(p);G.toTop=true;break}   // 리그가 끝나면 국가대표 대회부터
      endSeason(p);G.toTop=true;const m=p.summary;if(m){
      (m.aw||[]).filter(x=>x.k==='team'&&!(p.season&&(p.season.finalWins||[]).some(n=>x.n===n+' 우승'))).forEach(x=>celebrate('🏆',`${x.n}!`,`${m.team} · ${p.year} 시즌`));
      (m.aw||[]).filter(x=>x.k!=='team').forEach(x=>celebrate('🏅',`${x.n} 수상!`,`${p.year} 시즌 · ${p.name}`));
      if(m.mv&&m.mv.my==='up')celebrate('⬆️','승격!',`${m.team}, 다음 시즌은 한 단계 위 리그에서 뛴다`,'up');
      if(m.mv&&m.mv.my==='down')celebrate('⬇️','강등…',`${m.team}, 다음 시즌은 한 단계 아래 리그에서 뛴다. 팬들의 눈물 속에 시즌이 끝났다`,'down')}
      break}
    case 'celeb-ok':G.celebQ.shift();break;
    case 'rank-view':G.rank.view=+v;G.toTop=true;break;
    case 'rank-back':G.rank.view=null;break;
    case 'hof-view':G.hofView=v;G.toTop=true;break;
    case 'hof-back':G.hofView=null;break;
    case 'retire-ask':G.retireAsk=true;break;
    case 'retire-cancel':G.retireAsk=false;break;
    case 'retire-now':G.retireAsk=false;if(p&&p.phase!=='retired'){p.moment=null;p.season=null;p.event=null;p.winter=null;p.rehab=null;p.callQ=[];p.offers=null;retire(p);G.tab='season';G.toTop=true}break;
    case 'off':p.note=null;p.phase='offseason';genOffers(p);G.toTop=true;break;
    case 'offer':{const o=p.offers&&p.offers[+v],from=p.club,fromU=!!p.u21;
      if(o&&o.kind==='stay'&&p.dlOffer&&!G.dlPop){G.dlPop='summer';break}
      if(o&&o.kind!=='stay')p.dlOffer=null;
      // 결과가 갈리는 선택(이적·상무 지원·재계약·임대 요청)은 카운트다운 뒤에 결과를 보여 준다
      const sus=o&&!o.blocked&&((o.kind==='club'&&(o.club!==from||!!o.u21!==fromU)&&o.label!=='1군 승격')||o.kind==='sangmu'||o.kind==='raise'||o.kind==='loanreq');
      takeOffer(p,+v);
      if(sus){const ok=!o.blocked||!!o.done,dest=o.kind==='club'?teamName(o.club,o.u21):'';
        if(o.kind==='sangmu')reveal('김천 상무 선발 결과',ok,ok?'최종 합격!':'선발 탈락',ok?'김천 상무 입대 · 복무 중에도 K리그1 경기를 뜁니다':o.why);
        else if(o.kind==='raise')reveal('재계약 협상 결과',ok,ok?'재계약 성공!':'인상 거절',o.why);
        else if(o.kind==='loanreq')reveal('임대 요청 결과',ok,ok?'임대 허락!':'임대 거절',o.why);
        else reveal(`${dest} 이적 협상`,ok,ok?`${dest} 이적 확정!`:'이적 무산',ok?xferTerms(o):o.why,o.kind==='club'?xferSteps(p,o,ok):null)}
      if(p.phase!=='offseason')G.toTop=true;break}
    case 'reveal-ok':G.reveal=null;break;
    case 'notice-ok':noticeOk();break;
    case 'nt-ul':G.nt.ul=v||null;break;
    case 'nt-send':setTimeout(noticeSend);break;
    case 'nt-reload':setTimeout(noticeList);break;
    case 'nt-del':setTimeout(()=>noticeDel(v));break;
    // 마감일 깜짝 오퍼: 협상하면 카운트다운으로 결과, 거절하면 원래대로 잔류
    case 'dl-take':{const w=G.dlPop==='winter',o=w?p.dlWinter:p.dlOffer;G.dlPop=null;p.dlOffer=null;p.dlWinter=null;if(!o||(w&&!p.season))break;   // 시즌이 끝난 뒤 남은 겨울 팝업은 무시
      if(w){p.winter=p.winter||[];p.winter.push(o);act('winter',String(p.winter.length-1))}else{p.offers.push(o);act('offer',String(p.offers.length-1))}return}
    case 'dl-stay':{const w=G.dlPop==='winter';G.dlPop=null;p.dlOffer=null;p.dlWinter=null;
      if(w){act('winter-stay')}else{const i=p.offers.findIndex(x=>x.kind==='stay');if(i>=0)act('offer',String(i))}return}
  }
  checkAch(G.p);
  // 진행 중인 선수가 바뀐 시각 (기기 간 동기화 때 더 최근 쪽을 고른다)
  if(G.p&&(G.p!==p||JSON.stringify(G.p)!==ver0))G.p.ts=Date.now();
  if(G.p&&!G.p.pid)G.p.pid=newPid();
  // 은퇴했거나 새 인생으로 지운 선수는 다른 기기의 '이어하기' 목록에서도 빠지게 기록한다
  const closed=[];if(p&&G.p!==p&&p.phase!=='retired'&&a==='pick')closed.push(p.pid,pkey(p));
  if(G.p&&G.p.phase==='retired')closed.push(G.p.pid,pkey(G.p));
  if(closed.some(id=>id&&!(G.retiredPids||[]).includes(id))){G.retiredPids=[...new Set([...(G.retiredPids||[]),...closed.filter(Boolean)])].slice(-60);try{localStorage.setItem('kickoff-life-closed',JSON.stringify(G.retiredPids))}catch(e){}}
  store();render();
}
// 몰래 모드: 흑백·반투명 화면 · 움직이는 연출 끄기 · 탭 제목 바꾸기 · 왼쪽 작은 탭(PC는 Esc)을 누르면 업무 문서 화면으로 숨긴다
const STO=[.85,.6,.38],STO_N=['진하게','보통','흐리게'];
function bossSheet(){
  const heads=['항목','담당','1주차','2주차','3주차','4주차','합계','달성률','비고'],items=['자료 정리','회의록 작성','거래처 확인','견적 검토','주간 보고','예산 집행','일정 조율','품질 점검','교육 자료','문서 결재','현황 파악','재고 확인','계약 검토','지표 분석','이슈 정리','업무 협조','결과 보고','개선 과제','보안 점검','자산 관리','월간 마감','기타'];
  const who=['기획','영업','운영','재무','총무','개발'],cols='ABCDEFGHI'.split('');let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const rows=items.map((t,i)=>{const w=[0,1,2,3].map(()=>Math.round(20+rnd()*180)),sum=w.reduce((a,b)=>a+b,0);
    return `<tr><th>${i+3}</th><td class="t">${t}</td><td class="t">${who[i%who.length]}</td>${w.map(v=>`<td>${v.toLocaleString()}</td>`).join('')}<td>${sum.toLocaleString()}</td><td>${(70+rnd()*30).toFixed(1)}%</td><td class="t">${i%5===2?'확인 필요':''}</td></tr>`}).join('');
  return `<div class="bt">주간 업무 정리 <span>· 저장됨</span></div><div class="bf">fx&nbsp;&nbsp;=SUM(C3:F3)</div>
    <div class="bg"><table><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr><tr><th>1</th><td class="t" colspan="9"><b>2026년 4분기 주간 업무 현황</b></td></tr><tr class="h"><th>2</th>${heads.map(x=>`<td>${x}</td>`).join('')}</tr>${rows}
    ${Array.from({length:14},(_,i)=>`<tr><th>${items.length+3+i}</th>${cols.map(()=>'<td></td>').join('')}</tr>`).join('')}</table></div>
    <div class="bs"><button class="on" data-act="boss">시트1</button><button data-act="boss">요약</button><button data-act="boss">+</button></div>`}
function applyStealth(){
  const on=!!G.opt.stealth,b=document.body;b.classList.toggle('stealth',on);b.style.setProperty('--sto',STO[G.opt.sto??1]);
  document.title=on?'주간 업무 정리':'킥오프 라이프';
  let t=document.getElementById('bosstab');if(!t){t=document.createElement('button');t.id='bosstab';t.dataset.act='boss';t.setAttribute('aria-label','업무 화면으로 숨기기');t.textContent='▤';b.appendChild(t)}
  let x=document.getElementById('boss');if(!x){x=document.createElement('div');x.id='boss';x.hidden=true;b.appendChild(x)}
  const show=on&&!!G.boss;if(show&&!x.innerHTML)x.innerHTML=bossSheet();x.hidden=!show;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G.opt.stealth){G.boss=!G.boss;applyStealth()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='cname')G.create.name=e.target.value;if(e.target.id==='cschool')G.create.schoolName=e.target.value;if(e.target.id==='a-id')G.acct.id=e.target.value;if(e.target.id==='a-pw')G.acct.pw=e.target.value;if(e.target.id==='a-pw2')G.acct.pw2=e.target.value;if(e.target.id==='a-code')G.acct.code=e.target.value;if(e.target.id==='a-nick')G.acct.nick=e.target.value;if(e.target.id==='f-q')G.fr.q=e.target.value;if(e.target.id==='fb-text')G.fb.text=e.target.value;if(e.target.id==='nt-nick')G.nt.nick=e.target.value;if(e.target.id==='nt-title')G.nt.title=e.target.value;if(e.target.id==='nt-body')G.nt.body=e.target.value;if(e.target.id==='nt-lp')G.nt.lp=e.target.value;if(e.target.id==='cnum')G.create.num=e.target.value});
// 베팅 금액 직접 입력: 화면을 다시 그리지 않고(입력 중 포커스 유지) 금액·수령 예정만 바로 고친다
document.addEventListener('input',e=>{const id=e.target.id;if(id!=='bet-amt'&&id!=='cbet-amt')return;
  const raw=parseInt(e.target.value),v=clamp(isNaN(raw)?BET_MIN:raw,BET_MIN,BET_MAX),bal=lpBal(),$=x=>document.getElementById(x);

  document.querySelectorAll(`[data-act="${id==='bet-amt'?'bet-stake':'cbet-amt'}"]`).forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.v===v)))});
// 새로고침·앱 전환 뒤에도 보던 화면으로 돌아온다
{const ui=load('kickoff-life-ui',null);if(ui&&ui.screen&&ui.screen!=='create'&&(ui.screen!=='game'||G.p)){G.screen=ui.screen;G.tab=ui.tab||'season';G.ptab=ui.ptab}}

G.hof.forEach(h=>{const ns=rescoreRec(h);if(ns!=null){h.score=ns;h.grade=gradeOf(ns)}});
dexBackfill();

// 새 버전 확인 (휴대폰이 예전 버전을 캐시로 계속 띄우는 문제 방지): 서버의 최신 파일과 업데이트 노트 시각이 다르면 업데이트 버튼을 띄운다
async function checkVersion(){
  if(!/^https?:/.test(location.protocol)||/claude\.ai|claudeusercontent/.test(location.host))return;
  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();
    const m=/const UPDATES=\[\s*\{d:'([^']+)'/.exec(t);if(m&&m[1]!==UPDATES[0].d&&!G.newVer){G.newVer=m[1];render()}}catch(e){}
}
setTimeout(checkVersion,3000);
// 휴대폰에서 앱을 다시 열거나(백그라운드 → 화면) 오래 켜 두면 새 버전을 다시 확인한다
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion()});setInterval(checkVersion,5*60*1000);
